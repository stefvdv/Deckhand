/* The Commander banned list comes live from Scryfall itself (banned:commander),
   cached for a day — always the official, current list, zero maintenance. */
let _cmdrBansLoading = false;
async function ensureCmdrBans(force){
  if(!state.cmdrBans){
    try{ state.cmdrBans = JSON.parse(localStorage.getItem(LS_PREFIX+'cmdrBans')||'null'); }catch(e){}
  }
  const fresh = state.cmdrBans && state.cmdrBans.names && state.cmdrBans.names.length && Date.now() - (state.cmdrBans.t||0) < 24*60*60*1000;
  if(fresh && !force) return;
  if(_cmdrBansLoading) return;
  _cmdrBansLoading = true;
  try{
    const names = new Set();
    // Scryfall lists ban status per legality; the surest query is the banlist
    // itself. unique=cards can collapse reprints, so dedupe by name ourselves.
    let next = `${SF_BASE}/cards/search?order=name&q=${encodeURIComponent('banned:commander')}`;
    let guard = 0;
    while(next && guard < 6){
      guard++;
      const r = await sfFetch(next, 0, true);
      if(!r.ok){ break; }
      const d = await r.json();
      (d.data||[]).forEach(c=>{ if(c && c.name) names.add(c.name.split(' // ')[0]); });
      next = d.has_more ? d.next_page : null;
    }
    if(names.size){
      state.cmdrBans = { t: Date.now(), names: Array.from(names).sort((a,b)=>a.localeCompare(b)) };
      try{ localStorage.setItem(LS_PREFIX+'cmdrBans', JSON.stringify(state.cmdrBans)); }catch(e){}
      if(state.screen==='settings') render();
    }
  }catch(e){}
  finally{ _cmdrBansLoading = false; }
}

/* ================= PUBLISHER FORMAT FILE =================
   format.txt ships alongside index.html and is the publisher's editable copy
   of the format: the [banned] section IS the banlist (one card name per line
   — add or remove by editing), and [ub-sets] IS the curated Universes Beyond
   selection (one set name per line, exactly as Scryfall names it). Edit the
   file, redeploy the whole folder, and every player's app picks it up on next
   load. If the file is missing or a section is empty, the values baked into
   the app remain in force — nothing can break. */
function parseFormatFile(text){
  const out = { bans: [], ubs: [], quickRules: [], fullRules: [], ubBans: [] };
  let section = null;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const l = line.trim();
    if(!l || l.startsWith('#')) return;   // '#' comments; rule headers use '=='
    const m = l.match(/^\[(.+)\]$/);
    if(m){ section = m[1].trim().toLowerCase(); return; }
    if(section === 'banned'){
      const m2 = l.match(/^(.*?)\s*(?:\(UB\)|#ub)\s*$/i);
      if(m2 && m2[1] !== l){ out.bans.push(m2[1].trim()); out.ubBans.push(m2[1].trim()); }
      else out.bans.push(l);
      return;
    }
    else if(section === 'ub-sets') out.ubs.push(l);
    else if(section === 'quick-rules') out.quickRules.push(l);
    else if(section === 'full-rules') out.fullRules.push(l);
  });
  return out;
}
/* Publisher rules markup → app HTML. One paragraph per line;
   '== Title' makes a section header, '> text' a muted example line,
   **bold** works inline. Everything is HTML-escaped first. */
let RULES_OVERRIDE = { quick: null, full: null };
function fmtRuleInline(t){
  return escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function quickRulesFromLines(lines){
  return `<div class="rules-text"><ul>${lines.map(l=>`<li>${fmtRuleInline(l)}</li>`).join('')}</ul></div>`;
}
function fullRulesFromLines(lines){
  const body = lines.map(l=>{
    if(l.startsWith('== ')) return `<h4>${fmtRuleInline(l.slice(3))}</h4>`;
    if(l.startsWith('> '))  return `<p style="color:var(--sub-text-2);font-size:12px;">${fmtRuleInline(l.slice(2))}</p>`;
    return `<p>${fmtRuleInline(l)}</p>`;
  }).join('');
  return `<div class="rules-text">${body}</div>`;
}
async function loadFormatFile(){
  try{
    const res = await fetch('format.txt?ts=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const text = await res.text();
    if(!text || text.length > 200000 || text.trimStart().startsWith('<')) return;  // not our file
    const parsed = parseFormatFile(text);
    if(parsed.bans.length){
      EFFECTIVE_BANS = parsed.bans;
      bannedSet = new Set(parsed.bans.map(norm));
      EFFECTIVE_UB_BANS = new Set(parsed.ubBans.map(norm));
    }
    if(parsed.ubs.length){ UB_SET_NAMES = parsed.ubs; }
    if(parsed.quickRules.length){ RULES_OVERRIDE.quick = parsed.quickRules; }
    if(parsed.fullRules.length){ RULES_OVERRIDE.full = parsed.fullRules; }
  }catch(e){ /* offline or file absent — baked-in defaults apply */ }
}

/* ================= AUTOMATIC NEW-SET LEGALIZATION =================
   When Wizards releases a new set, no app update is needed:
   once a day the app checks Scryfall's set catalog for freshly released
   paper core/expansion sets, then verifies with Scryfall's own data that the
   set is (a) Standard-legal and (b) NOT Universes Beyond. In-universe
   Standard sets legalize themselves on release day — searchable, priced,
   legality-checked, listed in the rules. UB sets are always held back for
   the publisher's curated list (shipped via normal app updates). */
function loadAutoSets(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'autoSets');
    const v = raw ? JSON.parse(raw) : {codes:[], names:{}, ubCodes:[], previewCodes:[], previewMeta:{}, previewSeen:{}, lastCheck:0};
    if(!Array.isArray(v.ubCodes)) v.ubCodes = [];
    if(!Array.isArray(v.previewCodes)) v.previewCodes = [];
    if(!v.previewMeta || typeof v.previewMeta !== 'object') v.previewMeta = {};
    if(!v.previewSeen || typeof v.previewSeen !== 'object') v.previewSeen = {};
    return v;
  }catch(e){ return {codes:[], names:{}, ubCodes:[], previewCodes:[], previewMeta:{}, previewSeen:{}, lastCheck:0}; }
}
const autoSets = loadAutoSets();
/* Some environments (private tabs, strict storage settings) accept writes but
   drop them between sessions. Announcements keyed on stored state would then
   repeat forever — so on such devices they're suppressed outright. */
let _lsOk = false;
try{
  localStorage.setItem(LS_PREFIX+'_canary','1');
  _lsOk = localStorage.getItem(LS_PREFIX+'_canary') === '1';
}catch(e){ _lsOk = false; }
function spoilerAnnounced(code){
  try{ return !!localStorage.getItem(LS_PREFIX+'spoilAnn:'+code); }catch(e){ return true; }
}
function markSpoilerAnnounced(code){
  try{ localStorage.setItem(LS_PREFIX+'spoilAnn:'+code, '1'); }catch(e){}
}
function saveAutoSets(){ try{ localStorage.setItem(LS_PREFIX+'autoSets', JSON.stringify(autoSets)); }catch(e){} }
async function checkForNewSets(force){
  try{
    if(!force && Date.now() - (autoSets.lastCheck||0) < 20*3600*1000) return;
    await resolveLegalSets(force);
    const all = state.allSetsRaw || [];
    if(!all.length) return;
    const active = new Set(activeLegalSetCodes());
    let latest = '';
    all.forEach(x=>{ if(active.has(x.code) && x.released_at > latest) latest = x.released_at; });
    const today = new Date().toISOString().slice(0,10);
    const candidates = all.filter(x =>
      ['core','expansion'].includes(x.set_type) && !x.digital &&
      x.released_at > latest && x.released_at <= today && !active.has(x.code)
    ).slice(0, 4);   // realistically 0–1 per check
    autoSets.lastCheck = Date.now();
    saveAutoSets();
    const added = [];
    for(const cand of candidates){
      if((autoSets.ubCodes||[]).includes(cand.code)) continue;
      if((state.legalSetCodesUB||[]).includes(cand.code)) continue;   // already a seed set (e.g. The Hobbit pre-listed)
      // Scryfall's own markers make the call. In-universe Standard sets join
      // the core pool; Universes Beyond Standard sets join the pool behind
      // the "Include all Standard-legal sets" switch — automatically, so
      // future crossover releases (The Hobbit, Star Trek, …) need no update.
      const q = `set:${cand.code} legal:standard -is:universesbeyond game:paper`;
      const res = await sfFetch(`${SF_BASE}/cards/search?unique=cards&q=${encodeURIComponent(q)}`, 0, true);
      if(!res.ok && res.status !== 404) continue;  // transient error: retry later
      let hasCore = false;
      if(res.ok){ try{ hasCore = ((await res.json()).data||[]).length > 0; }catch(e){} }
      if(hasCore){
        autoSets.codes.push(cand.code);
        autoSets.names[cand.code] = cand.name;
        if(state.legalSetsMeta) state.legalSetsMeta[cand.code] = cand.name;
        added.push(cand.name);
        continue;
      }
      const q2 = `set:${cand.code} legal:standard is:universesbeyond game:paper`;
      const res2 = await sfFetch(`${SF_BASE}/cards/search?unique=cards&q=${encodeURIComponent(q2)}`, 0, true);
      if(!res2.ok) continue;
      let hasUB = false;
      try{ hasUB = ((await res2.json()).data||[]).length > 0; }catch(e){}
      if(hasUB){
        autoSets.ubCodes.push(cand.code);
        autoSets.names[cand.code] = cand.name;
        if(state.legalSetsMeta) state.legalSetsMeta[cand.code] = cand.name;
      }
    }
    // ---- Spoiler season: upcoming Standard-track sets whose previews began ----
    // Scryfall lists future sets in its catalog; once spoilers exist, cards
    // exist. In-universe preview sets join the core pool immediately; UB
    // preview sets get their own switch marked "not yet released".
    // Which upcoming sets are Standard-track? Scryfall's set relationships
    // answer it: side products (Commander decks, precons) carry a
    // parent_set_code pointing at their main set — true premier sets don't.
    // Preview cards are NOT pre-marked standard-legal, so card legality can't
    // be the gate before release (it is, as always, at release).
    const isMainStandardSet = (x)=> !!x && !x.digital && !x.parent && ['core','expansion'].includes(x.set_type);
    const seedNameMatch = (x)=> UB_SET_NAMES.some(n=>{
      const a = (x.name||'').toLowerCase(), b = n.toLowerCase();
      return a === b || a.includes(b) || b.includes(a);
    });
    const probeSet = async (code)=>{
      try{
        const r = await sfFetch(`${SF_BASE}/cards/search?unique=cards&q=${encodeURIComponent('set:'+code)}`, 0, true);   // previews lack game flags
        if(r.status === 404) return {cards:false};
        if(!r.ok) return null;   // transient — decide nothing
        const d = await r.json();
        const first = (d.data||[])[0];
        return {
          cards: !!first,
          standard: !!(first && first.legalities && first.legalities.standard === 'legal'),
          total: d.total_cards || (d.data||[]).length
        };
      }catch(e){ return null; }
    };
    const newSpoilerNotes = [];
    const trackSpoilerCount = (code, total)=>{
      const seen = autoSets.previewSeen[code];
      if(typeof seen === 'number' && total > seen){
        newSpoilerNotes.push(`${autoSets.names[code]||code.toUpperCase()} +${total-seen}`);
        state._spoilerCache = {};
      }
      autoSets.previewSeen[code] = total;
      saveAutoSets();
    };
    // Daily self-heal: any preview entry whose cards are NOT Standard-legal
    // was admitted in error (or misclassified) — purge it; it can re-enter
    // the moment Scryfall's data says otherwise.
    for(const code of Object.keys(autoSets.previewMeta)){
      if(autoSets.previewMeta[code] <= today) continue;               // release handled below
      const meta0 = all.find(x=>x.code===code);
      const seedUB0 = (state.legalSetCodesUB||[]).includes(code) || (meta0 && seedNameMatch(meta0));
      if(!seedUB0 && meta0 && !isMainStandardSet(meta0)){
        // A side product (Commander deck etc.) that slipped in earlier — out.
        autoSets.previewCodes = autoSets.previewCodes.filter(c=>c!==code);
        autoSets.ubCodes = autoSets.ubCodes.filter(c=>c!==code);
        delete autoSets.previewMeta[code];
        state.inspireCache = {}; state.browseCache = {};
        console.warn('preview set purged (side product):', code);
        saveAutoSets();
        continue;
      }
      const probe = await probeSet(code);
      if(!probe) continue;
      if(probe.cards) trackSpoilerCount(code, probe.total);
      if(seedUB0) continue;   // curated seeds are trusted
      // correctly Standard — but did the UB flag arrive late?
      if(autoSets.previewCodes.includes(code)){
        const r2 = await sfFetch(`${SF_BASE}/cards/search?unique=cards&q=${encodeURIComponent('set:'+code+' is:universesbeyond')}`, 0, true);
        if(r2.ok){
          try{
            if(((await r2.json()).data||[]).length){
              autoSets.previewCodes = autoSets.previewCodes.filter(c=>c!==code);
              autoSets.ubCodes.push(code);
              state.inspireCache = {}; state.browseCache = {};
              saveAutoSets();
            }
          }catch(e){}
        }
      }
    }
    const horizon = new Date(Date.now() + 150*86400000).toISOString().slice(0,10);
    const known = new Set([...(state.legalSetCodesCore||[]), ...autoSets.codes, ...autoSets.ubCodes,
      ...autoSets.previewCodes, ...Object.keys(autoSets.previewMeta)]);
    const seedUBCodes = new Set(state.legalSetCodesUB||[]);
    const upcoming = all.filter(x =>
      x.released_at > today && x.released_at <= horizon && !known.has(x.code) &&
      (isMainStandardSet(x) || seedUBCodes.has(x.code) || (!x.digital && seedNameMatch(x)))
    ).slice(0, 5);
    for(const u of upcoming){
      const seedUB = seedUBCodes.has(u.code) || seedNameMatch(u);
      const probe = await probeSet(u.code);
      if(!probe || !probe.cards) continue;               // no spoilers yet — try again tomorrow
      if(seedUB && !(state.legalSetCodesUB||[]).includes(u.code)){
        // Seed matched by name (e.g. Scryfall styles it slightly differently):
        // register the code so the switch, markers and pool all line up.
        state.legalSetCodesUB = (state.legalSetCodesUB||[]).concat(u.code);
        const seedName = UB_SET_NAMES.find(n=>seedNameMatch({name:u.name})) || u.name;
        state.ubNameToCode = state.ubNameToCode || {};
        state.ubNameToCode[norm(seedName)] = u.code;
      }
      autoSets.previewMeta[u.code] = u.released_at;
      autoSets.names[u.code] = u.name;
      if(state.legalSetsMeta) state.legalSetsMeta[u.code] = u.name;
      const alreadyAnnounced = typeof autoSets.previewSeen[u.code] === 'number';
      autoSets.previewSeen[u.code] = probe.total || 0;
      if(!seedUB){
        const r2 = await sfFetch(`${SF_BASE}/cards/search?unique=cards&q=${encodeURIComponent('set:'+u.code+' is:universesbeyond')}`, 0, true);
        let isUB = false;
        if(r2.ok){ try{ isUB = ((await r2.json()).data||[]).length > 0; }catch(e){} }
        if(isUB){ autoSets.ubCodes.push(u.code); }
        else { autoSets.previewCodes.push(u.code); }
      }
      state.inspireCache = {}; state.browseCache = {};
      if(_lsOk && !alreadyAnnounced && !spoilerAnnounced(u.code)){
        toast(`🔮 Spoiler season: ${u.name} previews are in the pool.`);
        markSpoilerAnnounced(u.code);
      }
      saveAutoSets();
    }
    if(_lsOk && newSpoilerNotes.length) toast(`🔮 New spoilers: ${newSpoilerNotes.join(', ')}`);
    // ---- Release day: preview sets graduate to full members ----
    (autoSets.previewCodes||[]).slice().forEach(code=>{
      const rel = autoSets.previewMeta[code];
      if(rel && rel <= today){
        autoSets.previewCodes = autoSets.previewCodes.filter(c=>c!==code);
        if(!autoSets.codes.includes(code)) autoSets.codes.push(code);
        delete autoSets.previewMeta[code];
        added.push(autoSets.names[code]||code.toUpperCase());
        saveAutoSets();
      }
    });
    (autoSets.ubCodes||[]).forEach(code=>{
      const rel = autoSets.previewMeta[code];
      if(rel && rel <= today){ delete autoSets.previewMeta[code]; saveAutoSets(); }
    });
    if(added.length){
      saveAutoSets();
      state.inspireCache = {}; state.browseCache = {};
      toast(`⚓ Now legal in Admiral: ${added.join(', ')}`);
    }
  }catch(e){ console.warn('new-set check failed', e); }
}
const uid = ()=> 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function isBanned(card){
  if(isCmdrMode()) return !!(card && card.legalities && card.legalities.commander === 'banned'); return bannedSet.has(norm(card.name)) || (card.card_faces||[]).some(f=>bannedSet.has(norm(f.name))); }
function frontFace(card){ return (card.card_faces && card.card_faces.length) ? card.card_faces[0] : card; }
function isNonlandFront(card){ const f=frontFace(card); return f.type_line && !f.type_line.includes('Land'); }
/* Commander plays lands; Admiral doesn't. Every client-side land filter goes
   through this so the rule lives in one place. Pass the deck when there is
   one; otherwise the current app mode decides. */
function landOk(card, d){ return (d ? deckFormat(d)==='commander' : isCmdrMode()) || isNonlandFront(card); }
function hasPowerToughness(card){ const f=frontFace(card); return f.power !== undefined && f.power !== null; }
function isLegendary(card){ return (card.type_line||'').includes('Legendary'); }
function allowsDuplicates(card){
  // Basic lands may always repeat (rule 903.5c) — their text doesn't say so.
  const tl = (card.type_line || (card.card_faces && card.card_faces[0] ? card.card_faces[0].type_line : '') || '');
  if(/\bBasic\b/i.test(tl)) return true;
  const text = (card.oracle_text || (card.card_faces? card.card_faces.map(f=>f.oracle_text||'').join(' ') : '')) || '';
  return /a deck can have any number of cards named/i.test(text);
}
function colorIdentityOk(card, admiral){
  if(!admiral) return true;
  const need = new Set(admiral.color_identity||[]);
  return (card.color_identity||[]).every(c=>need.has(c));
}
/* ---- multi-leader (partner) mechanics ------------------------------------
   Commander lets certain cards share command: Partner, Partner with <name>,
   Friends forever, Choose a Background + Background enchantments, and
   Time Lord Doctors + Doctor's companion. Each leader card is classified
   into one "pair kind"; canPair() encodes which kinds accept each other. */
function oracleAllText(card){
  return (card.oracle_text || (card.card_faces ? card.card_faces.map(f=>f.oracle_text||'').join('\n') : '')) || '';
}
function pairAbility(card){
  if(!card) return null;
  const t = card.type_line || (frontFace(card).type_line||'');
  const o = oracleAllText(card);
  const kw = card.keywords || [];
  if(/Time Lord Doctor/i.test(t)) return { kind:'doctor', label:'Time Lord Doctor' };
  if(kw.includes("Doctor's companion") || /Doctor's companion/i.test(o)) return { kind:'companion', label:"Doctor's companion" };
  if(/\bBackground\b/.test(t)) return { kind:'background', label:'Background' };
  if(kw.includes('Choose a Background') || /Choose a Background/i.test(o)) return { kind:'chooseBg', label:'Choose a Background' };
  if(kw.includes('Friends forever') || /Friends forever/i.test(o)) return { kind:'friends', label:'Friends forever' };

/* ========================= SCRYFALL ========================= */

const SF_BASE = 'https://api.scryfall.com';

/* Every Scryfall request goes through here: spaced out and auto-retried with
   exponential backoff on 429/5xx, so bulk operations (which fire many
   requests) don't get rate-limited and misreported as "not found". */
let _nextSfSlot = 0;
/* ---------- The Scryfall scheduler ----------
   One worker drains two queues — interactive first, background second — one
   request at a time with polite spacing. Three hard guarantees:
   1. A search waits behind AT MOST one in-flight request, never a queue of
      price lookups (priority is re-decided before every single request).
   2. No request can hang forever: mobile networks sometimes black-hole a
      fetch (no reply, no error) — a 12s abort converts that into a normal
      retry instead of an infinite spinner that wedges the whole session.
   3. Retries rejoin the FRONT of their own lane after backoff. */
const _sfQ = { hi: [], lo: [] };
let _sfWorking = false;
function sfFetch(url, attempt, bg, fresh){
  return new Promise((resolve, reject)=>{
    const job = { url, attempt: attempt || 0, bg: !!bg, fresh: !!fresh, resolve, reject };
    (job.bg ? _sfQ.lo : _sfQ.hi).push(job);
    _sfPump();
  });
}
async function _sfPump(){
  if(_sfWorking) return;
  _sfWorking = true;
  try{
    while(_sfQ.hi.length || _sfQ.lo.length){
      const job = _sfQ.hi.length ? _sfQ.hi.shift() : _sfQ.lo.shift();
      let res = null, err = null;
      const ctl = new AbortController();
      const killer = setTimeout(()=>{ try{ ctl.abort(); }catch(e){} }, 12000);
      try{ res = await fetch(job.url, { signal: ctl.signal, cache: job.fresh ? 'no-store' : 'default' }); }
      catch(e){ err = e; }
      clearTimeout(killer);
      const retryable = err || (res && (res.status === 429 || res.status >= 500));
      if(retryable && job.attempt < 6){
        if(res) console.warn('Scryfall ' + res.status + ', retrying (attempt ' + (job.attempt+1) + ')', job.url);
        job.attempt++;
        const lane = job.bg ? _sfQ.lo : _sfQ.hi;
        setTimeout(()=>{ lane.unshift(job); _sfPump(); }, backoffMs(job.attempt - 1));
      } else if(err){
        job.reject(err);
      } else {
        job.resolve(res);
      }
      await new Promise(r=>setTimeout(r, 80));
    }
  } finally {
    _sfWorking = false;
    if(_sfQ.hi.length || _sfQ.lo.length) _sfPump();
  }
}
function backoffMs(attempt){
  return Math.min(6000, 450 * Math.pow(1.8, attempt)) + Math.random()*250;
}

async function resolveLegalSets(force){
  if(state.setsResolved && !force) return;
  try{
    const res = await sfFetch(SF_BASE + '/sets', 0, false, !!force);
    const data = await res.json();
    const all = data.data || [];
    const byNorm = new Map();
    all.forEach(s=>byNorm.set(norm(s.name), s.code));
    const resolve = (names)=>{
      const codes = [];
      names.forEach(n=>{
        const key = norm(n);
        if(byNorm.has(key)){ codes.push(byNorm.get(key)); return; }
        let found=null;
        for(const [k,v] of byNorm.entries()){ if(k.includes(key) || key.includes(k)){ found=v; break; } }
        if(found) codes.push(found);

      return codes;
    };
    state.legalSetCodesCore = resolve(LEGAL_SET_NAMES);
    state.ubNameToCode = {};
    UB_SET_NAMES.forEach(n=>{ const c = resolve([n])[0]; if(c) state.ubNameToCode[norm(n)] = c; });

  try{ return JSON.parse(localStorage.getItem(LS_PREFIX+'ubBanSets')||'{}'); }catch(e){ return {}; }
}
let _ubBanSetMap = loadUBBanSetMap();
async function classifyUBBans(){
  const pending = EFFECTIVE_BANS.filter(n=>EFFECTIVE_UB_BANS.has(norm(n)) && !_ubBanSetMap[norm(n)]);
  for(const name of pending){

      const res = await sfFetch(SF_BASE + '/cards/named?exact=' + encodeURIComponent(name), 0, true);
      if(!res.ok) continue;
      const card = await res.json();
      if(card && card.set){ _ubBanSetMap[norm(name)] = card.set.toLowerCase(); }
    }catch(e){}
  }
  try{ localStorage.setItem(LS_PREFIX+'ubBanSets', JSON.stringify(_ubBanSetMap)); }catch(e){}
}
function ubBansForSet(code){
  if(!code) return [];
  return EFFECTIVE_BANS.filter(n=>EFFECTIVE_UB_BANS.has(norm(n)) && _ubBanSetMap[norm(n)] === code.toLowerCase());
}
function ubCatalog(){
  const seeds = UB_SET_NAMES.map(n=>({ name:n, code:(state.ubNameToCode||{})[norm(n)]||null }));
  const autos = (autoSets.ubCodes||[]).filter(c=>!seeds.some(x=>x.code===c))
    .map(c=>({ name: autoSets.names[c]||c.toUpperCase(), code:c }));
  return seeds.concat(autos).map(x=>({ ...x, preview: isPreviewSet(x.code) }));
}

function enabledUBCodes(){ return ubCatalog().filter(x=>state.ubOn[norm(x.name)] && x.code).map(x=>x.code); }
function ubSelectionSig(){
  const on = ubCatalog().filter(x=>state.ubOn[norm(x.name)]).map(x=>x.code||norm(x.name)).sort();
  return on.length ? on.join('.') : 'core';

function isUBCard(c){

}
function ubMarkHtml(c){ return (!isCmdrMode() && isUBCard(c)) ? '<span class="ub-mark">UB</span>' : ''; }
/* Old scans have square white corners; the CSS clips every card image to the
   real card corner radius so corners read dark like the physical card — except
   genuinely white-bordered cards, which keep their light corners. */
function wbClass(c){ return (c && c.border_color === 'white') ? 'wb-card' : ''; }
/* Owned marker: a small check on deck tiles for cards that are in the
   collection under ANY printing. */
function ownedNames(){
  if(!state._ownedSet) state._ownedSet = new Set((state.collection.items||[]).map(it=>it.name));
  return state._ownedSet;
}

/* Spoiler season: sets whose release date is still ahead but whose previews
   are already on Scryfall. Their cards flow into the pool the moment they're
   spoiled, wearing a SPOILER marker until the set actually releases. */
function isPreviewSet(code){
  const d = (autoSets.previewMeta||{})[(code||'').toLowerCase()];
  return !!d && d > new Date().toISOString().slice(0,10);
}
function isPreviewCard(c){ return !!c && isPreviewSet(c.set); }
function pvMarkHtml(c){ return isPreviewCard(c) ? '<span class="pv-mark">SPOILER</span>' : ''; }
function activeLegalSetCodes(){
  const core = (state.legalSetCodesCore || []).concat(autoSets.previewCodes||[]);
  const ub = enabledUBCodes();
  return Array.from(new Set(core.concat(ub, autoSets.codes)));
}
async function runLimited(items, worker, limit=6){
  const out = new Array(items.length); let idx=0;
  async function next(){ while(idx<items.length){ const my=idx++; out[my]=await worker(items[my],my); } }
  await Promise.all(new Array(Math.min(limit,items.length)).fill(0).map(next));
  return out;
}

/* Core search primitive: one broad Scryfall query (no giant OR-of-sets clause),
   then verify each candidate's historical legality via its own prints list.
   This is the same reliable technique Bulk Edit uses, applied to live search
   so we don't depend on a single fragile multi-set query string. */
function chunkArr(arr, size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }

/* Fast path: instead of fetching a broad result set and then verifying each
   candidate's legality one-by-one (which needs ~2x N requests and was the
   reason Inspiration was slow), restrict the query itself to legal sets via
   a handful of parallel "(set:a OR set:b OR ...)" queries and merge the
   results. This needs ~8 requests total regardless of how many cards match,
   and is safe now that sfFetch's queue no longer has the race condition that
   caused an earlier version of this approach to silently return nothing. */
const _queryCache = new Map();   // session cache — repeating a search is instant

/* ---------- Persistent query cache ----------
   Deck-building is iterative: people circle the same themes and searches for
   days while an idea takes shape. Results are therefore also kept in
   IndexedDB for 24 hours, so reopening the app and re-running yesterday's
   search paints instantly from disk, then behaves exactly like the live
   result. Anything can fail here without consequence — every operation
   degrades silently to a normal network search. */
const QCACHE_TTL = 24*3600*1000;
let _qdb = null;
function qdbOpen(){
  if(_qdb) return _qdb;
  _qdb = new Promise((res)=>{
    try{
      const req = indexedDB.open('admiral-qcache', 1);
      req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore('q'); }catch(e){} };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
  return _qdb;
}
async function qdbGet(key){
  try{
    const db = await qdbOpen(); if(!db) return null;
    return await new Promise((res)=>{
      const rq = db.transaction('q').objectStore('q').get(key);
      rq.onsuccess = ()=>res(rq.result || null);
      rq.onerror = ()=>res(null);
    });
  }catch(e){ return null; }
}
function qdbSet(key, value){
  qdbOpen().then(db=>{
    if(!db) return;
    try{ db.transaction('q','readwrite').objectStore('q').put({t: Date.now(), v: value}, key); }catch(e){}
  }).catch(()=>{});
}
/* prune stale entries once per startup, in the background */
function qdbPrune(){
  qdbOpen().then(db=>{
    if(!db) return;
    try{
      const st = db.transaction('q','readwrite').objectStore('q');
      const cur = st.openCursor();
      cur.onsuccess = ()=>{
        const c = cur.result; if(!c) return;
        if(!c.value || (Date.now() - (c.value.t||0)) > QCACHE_TTL) c.delete();
        c.continue();
      };
    }catch(e){}
  }).catch(()=>{});
}
function _qcSet(k, v){
  _queryCache.set(k, v);
  if(_queryCache.size > 60) _queryCache.delete(_queryCache.keys().next().value);
  qdbSet(k, v);
}
let _searchBusy = 0;   // live searches in flight — background work yields to these
async function searchAndVerifyLegal(baseClause, sortOrder, limit, opts){
  limit = limit || 40;
  opts = opts || {};
  await resolveLegalSets();
  // The exact sorted pool is the cache key: any per-set choice change makes
  // its own cache lane, so mixed selections can never serve each other's data.
  const setsSig = (activeLegalSetCodes()||[]).slice().sort().join('.');
  const qcKey = [appMode(), baseClause||'', sortOrder||'', limit, (opts.dir||''), (opts.restrictSet||''), 's'+setsSig].join('|');
  if(_queryCache.has(qcKey)) return { results: _queryCache.get(qcKey).slice(), error: false };
  const disk = await qdbGet(qcKey);
  if(disk && (Date.now() - (disk.t||0)) < QCACHE_TTL && Array.isArray(disk.v)){
    _queryCache.set(qcKey, disk.v);
    return { results: disk.v.slice(), error: false };
  }
  _searchBusy++;
  try{
  await resolveLegalSets();
  const orderParam = sortOrder==='cmc' ? 'cmc' : sortOrder==='edhrec' ? 'edhrec' : 'name';
  const dir = opts.dir === 'desc' ? 'desc' : 'auto';
  if(isCmdrMode()){
    // Commander mode: Scryfall's own format flag IS the legality engine —
    // one query, all sets, official ban list included, lands welcome.
    let base = (baseClause||'').replace(/\s*-t:land/g, '');
    if(opts.restrictSet) base += ' set:'+opts.restrictSet;
    const q = `${base} legal:commander game:paper -is:digital`.trim();
    const url = `${SF_BASE}/cards/search?unique=cards&order=${orderParam}&dir=${dir}&q=${encodeURIComponent(q)}`;
    const out = [];
    let next = url, guard = 0;
    while(next && out.length < limit && guard < 4){
      guard++;
      const res = await sfFetch(next);
      if(!res.ok){ if(res.status===404) break; throw (res.status===400?'BAD_QUERY':res.status); }
      const dd = await res.json();
      (dd.data||[]).forEach(c=>{ if(out.length < limit) out.push(c); });
      next = dd.has_more ? dd.next_page : null;
    }
    _queryCache.set(qcKey, out);
    qdbSet(qcKey, { t: Date.now(), v: out });
    return { results: out.slice(), error: false };
  }
  let codes = activeLegalSetCodes();
  // A chosen set narrows the search, but only if it's actually format-legal —
  // otherwise we'd be offering cards that can't be played.
  if(opts.restrictSet){
    codes = codes.includes(opts.restrictSet) ? [opts.restrictSet] : [];
    if(!codes.length) return { results: [], error: false };
  }
  if(!codes.length) return { results: [], error: true };
  // Scryfall caps query length (~1000 chars). Fit as many set codes as the
  // remaining budget allows (each 'set:xyz OR ' ≈ 10 chars) — fewer, fuller
  // chunks means fewer requests and a faster first paint.
  const baseLen = (baseClause||'').length;
  const perChunk = Math.max(12, Math.min(65, Math.floor((940 - baseLen) / 10)));
  const groups = chunkArr(codes, perChunk);
  const queries = groups.map(g=>{
    const setClause = '(' + g.map(c=>'set:'+c).join(' OR ') + ')';
    const q = `${baseClause||''} ${setClause} game:paper -is:digital`.trim();
    const url = `${SF_BASE}/cards/search?unique=cards&order=${orderParam}&dir=${dir}&q=${encodeURIComponent(q)}`;
    return sfFetch(url).then(res => res.ok ? res.json() : (res.status===404 ? {data:[]} : Promise.reject(res.status===400?'BAD_QUERY':res.status)));
  });
  const runChunk = (g) => {
    const setClause = '(' + g.map(c=>'set:'+c).join(' OR ') + ')';
    const q = `${baseClause||''} ${setClause} game:paper -is:digital`.trim();
    const url = `${SF_BASE}/cards/search?unique=cards&order=${orderParam}&dir=${dir}&q=${encodeURIComponent(q)}`;
    return sfFetch(url).then(res => res.ok ? res.json() : (res.status===404 ? {data:[]} : Promise.reject(res.status===400?'BAD_QUERY':res.status)));
  };
  const settled = await Promise.allSettled(queries);
  const byName = new Map();
  const failedGroups = [];
  settled.forEach((r,i)=>{
    if(r.status==='fulfilled'){ (r.value.data||[]).forEach(c=>{ if(!byName.has(c.name)) byName.set(c.name, c); }); }
    else { failedGroups.push(groups[i]); console.error('Scryfall chunk query failed', r.reason); }
  });
  // Heavy queries (like the default all-Admirals view) sometimes drop a chunk
  // to a timeout or rate limit — one quiet retry recovers those instead of
  // declaring the whole search dead.
  let anyError = false, badQuery = false;
  settled.forEach(r=>{ if(r.status==='rejected' && r.reason==='BAD_QUERY') badQuery = true; });
  if(failedGroups.length){
    const retried = await Promise.allSettled(failedGroups.map(runChunk));
    retried.forEach(r=>{
      if(r.status==='fulfilled'){ (r.value.data||[]).forEach(c=>{ if(!byName.has(c.name)) byName.set(c.name, c); }); }
      else { anyError = true; if(r.reason==='BAD_QUERY') badQuery = true; }
    });
  }
  let list = Array.from(byName.values());
  // We merge several set-restricted queries, so re-sort the combined list ourselves
  const desc = opts.dir === 'desc';
  if(sortOrder==='edhrec') list.sort((a,b)=>(a.edhrec_rank??999999)-(b.edhrec_rank??999999));
  else if(sortOrder==='cmc') list.sort((a,b)=>(a.cmc||0)-(b.cmc||0) || a.name.localeCompare(b.name));
  else list.sort((a,b)=>a.name.localeCompare(b.name));
  if(desc) list.reverse();
  const results = list.slice(0, limit);
  const error = (anyError && !results.length) ? (badQuery ? 'badquery' : true) : false;
  if(!error) _qcSet(qcKey, results);
  return { results, error };
  } finally { _searchBusy--; }
}
function searchLegalCards(term){ return searchAndVerifyLegal(`name:"${term}"`, 'name', 40).then(r=>r.results); }

/* Resolving names one at a time costs two requests per card, which made a
   60-card import crawl. This asks Scryfall for the printings of a whole batch
   in one query — that single response tells us the card exists, whether any
   printing is format-legal, and its cheapest price. Names that don't match
   exactly (typos, nicknames) fall back to the per-card fuzzy lookup. */
async function resolveManyByName(names, onProgress){
  await resolveLegalSets();
  const out = new Array(names.length).fill(null);
  const codes = new Set(activeLegalSetCodes());
  const byLower = {};
  names.forEach((n,i)=>{
    const k = n.trim().toLowerCase();
    if(!byLower[k]) byLower[k] = [];
    byLower[k].push(i);
  });
  const uniqueNames = Object.keys(byLower);
  let done = 0;
  const bump = (n)=>{ done += n; if(onProgress) onProgress(Math.min(done, names.length), names.length); };

  const unmatched = [];
  // Commander mode resolves from a single printing (legality and price ride on
  // the card itself), skipping the all-printings pagination — basics alone
  // have hundreds of prints and were the bulk of long import waits. Admiral
  // mode still walks printings to test set-pool membership.
  const wantPrints = !isCmdrMode();
  const batches = chunkArr(uniqueNames, wantPrints ? 10 : 20);
  await runLimited(batches, async (chunk)=>{
    const q = '(' + chunk.map(n=>exactNameClause(n)).join(' or ') + ') game:paper -is:digital';
    let url = `${SF_BASE}/cards/search?unique=${wantPrints?'prints':'cards'}&q=${encodeURIComponent(q)}`;
    const hits = {};   // lowercased name -> { card, legal, minEur }
    for(let page=0; page<(wantPrints?6:2) && url; page++){
      try{
        const res = await sfFetch(url);
        if(!res.ok){ if(res.status===404) break; throw new Error('status '+res.status); }
        const data = await res.json();
        (data.data||[]).forEach(p=>{
          let key = (p.name||'').toLowerCase();
          if(!byLower[key]){
            // Double-faced and adventure cards: decklists carry the front
            // face's name while Scryfall answers "Front // Back" — match on
            // the front so these stop falling into the slow one-by-one lane.
            const cut = key.indexOf(' // ');
            const front = cut > 0 ? key.slice(0, cut) : null;
            if(front && byLower[front]) key = front;
            else return;
          }
          if(!hits[key]) hits[key] = { card: p, legal: false, minEur: null };
          const h = hits[key];
          if(isCmdrMode()){
            if(p.legalities && p.legalities.commander && p.legalities.commander !== 'not_legal') h.legal = true;
          } else if(codes.has(p.set)){
            h.legal = true;
            if(!codes.has(h.card.set)) h.card = p;   // prefer a legal printing as the representative
          }
          const raw = p.prices && p.prices.eur;
          if(raw){
            const e = parseFloat(raw);
            if(!isNaN(e) && (h.minEur===null || e < h.minEur)) h.minEur = e;
          }
        });
        url = data.has_more ? data.next_page : null;
      }catch(e){ console.error('batch resolve failed', e); break; }
    }
    chunk.forEach(k=>{
      const hit = hits[k];
      if(hit){
        state.priceCache[hit.card.name] = { v: hit.minEur, t: Date.now() };
        byLower[k].forEach(i=>{ out[i] = { input: names[i], found: true, card: hit.card, legalPrint: hit.legal }; });
        bump(byLower[k].length);
      } else {
        unmatched.push(k);   // exact match missed, or the batch errored — retry individually
      }
    });
  }, 2);
  savePriceCache();

  // Fuzzy fallback catches typos and anything the exact batch couldn't resolve
  if(unmatched.length){
    await runLimited(unmatched, async (k)=>{
      const first = byLower[k][0];
      const r = await resolveCardByName(names[first]);
      byLower[k].forEach(i=>{ out[i] = r ? Object.assign({}, r, { input: names[i] }) : { input: names[i], found:false }; });
      bump(byLower[k].length);
    }, 3);
  }
  return out;
}

async function resolveCardByName(rawName){
  const name = rawName.trim();
  if(!name) return null;
  try{
    const res = await sfFetch(SF_BASE + '/cards/named?fuzzy=' + encodeURIComponent(name));
    if(!res.ok){
      if(res.status === 404) return { input: rawName, found:false };
      console.error('Card lookup failed after retries', res.status, name);
      return { input: rawName, found:false, networkIssue:true };
    }
    const card = await res.json();
    let legal = false, verifyFailed = false;
    try{
      const pRes = await sfFetch(card.prints_search_uri, 0, true);
      if(!pRes.ok){ verifyFailed = true; }
      else{
        const pData = await pRes.json();
        if(isCmdrMode()){
          // Commander legality is a property of the card, not the set pool.
          legal = !!(card.legalities && card.legalities.commander && card.legalities.commander !== 'not_legal');
        } else {
          const codes = new Set(activeLegalSetCodes());
          legal = (pData.data||[]).some(p=>codes.has(p.set));
        }
      }
    }catch(e){ verifyFailed = true; }
    if(verifyFailed) console.error('Legality check failed after retries for', card.name);
    return { input: rawName, found:true, card, legalPrint: legal, verifyFailed };
  }catch(e){ console.error('resolveCardByName error', name, e); return { input: rawName, found:false, networkIssue:true }; }
}
function idClauseFor(admiral){
  const ci = (admiral.color_identity||[]).map(c=>c.toLowerCase());
  if(!ci.length) return 'id=c';
  return 'id<=' + ci.join('');
}
function idClauseForDeck(d){
  return idClauseFor({ color_identity: deckColorIdentity(d) });
}

/* ---------- Format-change announcements: whenever the banlist, the curated
   UB selection, or the auto-legalized set list differs from what this device
   last saw, tell the player what changed. ---------- */
function formatSnapshotNow(){
  return {
    b: EFFECTIVE_BANS.slice().sort(),
    u: UB_SET_NAMES.slice().sort().concat((autoSets.ubCodes||[]).map(c=>autoSets.names[c]||c).sort()),
    s: (autoSets.codes||[]).slice().sort(),
    p: Object.keys(autoSets.previewMeta||{}).filter(isPreviewSet).map(c=>autoSets.names[c]||c).sort(),
    r: (RULES_OVERRIDE.quick||[]).join('\n') + '|' + (RULES_OVERRIDE.full||[]).join('\n')
  };
}
function maybeShowFormatChanges(){
  try{
    if(document.getElementById('welcomeScrim') || !localStorage.getItem(LS_PREFIX+'welcomed') && !localStorage.getItem(LS_PREFIX+'formatSnap')){
      // brand-new device: record silently; the welcome covers them
      localStorage.setItem(LS_PREFIX+'formatSnap', JSON.stringify(formatSnapshotNow()));
      return;
    }
    const now = formatSnapshotNow();
    const prevRaw = localStorage.getItem(LS_PREFIX+'formatSnap');
    if(!prevRaw){ localStorage.setItem(LS_PREFIX+'formatSnap', JSON.stringify(now)); return; }
    const prev = JSON.parse(prevRaw);
    const diff = (a,b)=>a.filter(x=>!b.includes(x));
    const banned = diff(now.b, prev.b||[]), unbanned = diff(prev.b||[], now.b);
    const ubAdded = diff(now.u, prev.u||[]), ubRemoved = diff(prev.u||[], now.u);
    const newSets = diff(now.s, prev.s||[]).map(c=>autoSets.names[c]||c.toUpperCase());
    const newPreviews = diff(now.p||[], prev.p||[]);
    const rulesChanged = (typeof prev.r === 'string') && prev.r !== now.r;
    if(!banned.length && !unbanned.length && !ubAdded.length && !ubRemoved.length && !newSets.length && !newPreviews.length && !rulesChanged) return;
    if(document.getElementById('changelogScrim') || document.getElementById('showcaseOverlay')) return;  // next launch
    const li = arr=>arr.map(x=>`<li style="margin-bottom:4px;">${escapeHtml(x)}</li>`).join('');

  // Re-home children and decks to this folder's parent, then remove it.
  const f = (state.folders||[]).find(x=>x.id===id); if(!f) return;
  const parent = f.parentId || null;
  (state.folders||[]).forEach(x=>{ if(x.parentId===id) x.parentId = parent; });
  state.decksIndex.forEach(d=>{ if(d.folderId===id){ d.folderId = parent; persistDeck(d); } });
  state.folders = (state.folders||[]).filter(x=>x.id!==id);
  saveFolders();

async function loadDecksIndex(){
  try{
    if(!lsAvailable()){ warnStorageOnce(); state.decksIndex=[]; state.homeLoaded=true; return; }
    const decks = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith(LS_PREFIX+'deck:')) continue;
      try{ decks.push(JSON.parse(localStorage.getItem(k))); }catch(e){ /* skip corrupt entry */ }
    }
    state.decksIndex = decks.filter(Boolean).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  }catch(e){ console.error(e); state.decksIndex = []; }
  state.folders = loadFolders();
  if(state.folderNav===undefined) state.folderNav = null;   // which folder we're viewing (null = top)

}

  }catch(e){
    console.error('Save failed', e);
    if(e && e.name==='QuotaExceededError'){

function switchPage(p){
  state._focusSearchOnce = (p === 'search' && state.screen !== 'search');
  // A deck pinned via "Search Cards" only lives for that one visit to the
  // Search page — any navigation elsewhere returns Search to popup mode.
  if(p !== 'search' && p !== 'browse'){
    state.searchPinnedDeckId = null;
  }
  if(p !== 'browse') state.switchSeat = null;
  if(p !== 'search'){
    // Every visit to Search starts completely fresh: results cleared AND all
    // advanced filters wiped, so no invisible filter quietly hides cards.
    state.searchRan = false; state.searchResults = [];
    state.searchName = ''; state.advOpen = false;
    resetSearchFilters();
  }
  if(p !== 'browse'){
    // Inspiration resets the same way — a fresh landing has no selections.
    state.browseSel = {count:'', combo:'', theme:'', type:''};
    state.browseTypal = null;
  }
  if(p === 'decks'){ state.folderNav = null; state.deckFilter = ''; }
  state.screen = p; state.menuOpen = false; state.openCSelect = null;
  pushHistory(p);
  render();
}

  try{ history.pushState(Object.assign({screen}, extra), '', '#'+screen); }catch(e){}
}

function pushOverlay(id, closeFn, defer){
  // History entries created during page load (no user interaction yet) are
  // SKIPPED by the browser's back button as an anti-abuse measure — which
  // made hardware-back on a freshly opened share link exit the app entirely.
  // Deferred entries are pushed on the user's first touch instead, which
  // makes them legitimate: back then returns to the app's home page.
  state.overlayStack.push({id, closeFn, pushed: !defer});
  if(!defer){ try{ history.pushState({overlay:id}, '', '#'+id); }catch(e){} }
}
/* ---------- Swipe navigation across the main pages ----------
   Drag left-to-right to move one page left, right-to-left to move right:
   Home · My Decks · Search · Inspiration · Extras. Deliberately strict —
   a clearly horizontal, decisive swipe only — so vertical scrolling, grids,
   dropdowns and controls are never hijacked. */
const PAGE_STRIP = ['home','decks','search','browse','settings'];
// My Collection lives under My Stuff, so it rides the strip at the 'decks'
// position — swiping there works like My Stuff, and swiping back returns to
// My Stuff rather than the collection.
const stripScreen = (s)=> s === 'collection' ? 'decks' : s;
(function(){
  let sx = null, sy = null, ok = false;
  document.addEventListener('touchstart', e=>{
    ok = false; sx = null;
    if(!PAGE_STRIP.includes(stripScreen(state.screen))) return;
    if(state.overlayStack.length) return;                                  // card views, life tracker…
    if(document.querySelector('.deckpick-scrim')) return;                  // popups
    if(state.openCSelect || document.getElementById('tileMenuPop')) return;
    if(e.target.closest && e.target.closest('input,textarea,select,.toggle-switch,.cselect')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; ok = true;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!ok || sx === null) return;
    const t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    const dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null; ok = false;
    if(Math.abs(dx) < 72 || Math.abs(dx) < 2.2*Math.abs(dy)) return;       // not a decisive horizontal swipe
    const idx = PAGE_STRIP.indexOf(stripScreen(state.screen));
    if(idx === -1) return;
    const next = dx > 0 ? idx - 1 : idx + 1;                               // L→R drag = page to the LEFT
    if(next < 0 || next >= PAGE_STRIP.length) return;
    try{ navigator.vibrate && navigator.vibrate(8); }catch(err){}
    animateSwipeTo(PAGE_STRIP[next], dx > 0 ? 1 : -1);
  }, {passive:true});
})();
/* The pages behave as one linked strip: the current page slides out in the
   swipe direction while the destination slides in from the opposite side —
   one continuous motion instead of a hard cut. */
function animateSwipeTo(target, dir){
  const app = document.querySelector('.app');
  if(!app){ switchPage(target); return; }
  document.documentElement.style.overflowX = 'hidden';
  app.style.willChange = 'transform';
  app.style.transition = 'transform .15s ease-in, opacity .15s ease-in';
  app.style.transform = `translateX(${dir*38}vw)`;
  app.style.opacity = '0.35';
  setTimeout(()=>{
    switchPage(target);
    const na = document.querySelector('.app');
    if(!na){ document.documentElement.style.overflowX = ''; return; }
    na.style.willChange = 'transform';
    na.style.transition = 'none';
    na.style.transform = `translateX(${-dir*55}vw)`;
    na.style.opacity = '0.4';
    void na.offsetWidth;   // commit the start position before animating
    na.style.transition = 'transform .24s cubic-bezier(.22,.9,.3,1), opacity .24s ease-out';
    na.style.transform = 'translateX(0)';
    na.style.opacity = '1';
    setTimeout(()=>{
      na.style.transition = ''; na.style.transform = ''; na.style.opacity = '';
      na.style.willChange = ''; document.documentElement.style.overflowX = '';
    }, 300);
  }, 150);
}

/* An open dropdown or context menu claims the next tap: touching anything
   outside it closes the menu and NOTHING else happens — the element under the
   finger is not activated. (Capture phase, so it runs before any handler.) */
document.addEventListener('click', (e)=>{
  if(state.openCSelect){
    const inside = e.target.closest && e.target.closest('.cselect');
    if(!inside){
      e.preventDefault();
      e.stopPropagation();
      state.openCSelect = null;
      try{ csRerender(); }catch(err){}
      return;
    }
  }
  const pop = document.getElementById('tileMenuPop');
  if(pop && !pop.contains(e.target)){
    e.preventDefault();
    e.stopPropagation();
    pop.remove();
  }
}, true);
function _promoteDeferredOverlay(){
  const top = state.overlayStack[state.overlayStack.length-1];
  if(top && !top.pushed){
    top.pushed = true;
    try{ history.pushState({overlay: top.id}, '', '#'+top.id); }catch(e){}
  }
}
['pointerdown','touchstart','mousedown','keydown'].forEach(ev=>
  window.addEventListener(ev, _promoteDeferredOverlay, {capture:true, passive:true}));
function closeTopOverlay(){
  if(!state.overlayStack.length) return;
  const top = state.overlayStack[state.overlayStack.length-1];
  if(!top.pushed){
    // No history entry exists for this overlay — close it directly.
    state.overlayStack.pop();
    top.closeFn();
    return;
  }
  try{ history.back(); } // popstate runs the closeFn
  catch(e){ const t = state.overlayStack.pop(); if(t) t.closeFn(); }
}
function goBack(){
  try{ history.back(); }catch(e){ switchPage('decks'); }
}

/* The page word / deck name shrinks its font (down to a floor) until it fits,
   only ellipsizing for truly enormous deck names. Re-measured after the
   display font finishes loading and on every resize — the original bug was
   measuring with the fallback font, which is narrower than Cinzel Decorative,
   so "fits" flipped to overflow once the real font arrived. */
function fitBrandTitle(){
  // Static sizing: the title always renders at one fixed size, wraps onto two
  // lines (breaking long single words like "Aikidon't"), and ellipsizes past
  // that. No measuring, no visible shrink-steps — the CSS does all the work.
  const el = document.getElementById('brandTitle');
  if(el) el.style.fontSize = '';
  state._brandSize = null;
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>fitBrandTitle());
window.addEventListener('resize', fitBrandTitle);
function wireNav(){
  const bt = document.getElementById('brandTitle');
  if(bt){
    const t = bt.textContent;
    const changed = state._lastBrand !== t;
    if(changed){ bt.classList.add('swap'); state._brandSize = null; }
    // Apply the last known good size for this exact word immediately, so a
    // re-render of the same title doesn't flash big-then-small.
    if(!changed && state._brandSize){ bt.style.fontSize = state._brandSize; }
    state._lastBrand = t;
  }
  requestAnimationFrame(()=>requestAnimationFrame(fitBrandTitle));
  setTimeout(fitBrandTitle, 250);
  setTimeout(fitBrandTitle, 700);   // late settle (fonts, async deck load)
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click', ()=>switchPage(b.dataset.page)));
  const hb = document.getElementById('homeBtn');
  if(hb){
    // Tap: home. Long-press (~½s): switch between Admiral and Commander.
    let lpT = null, lpFired = false;
    const lpStart = ()=>{ lpFired = false; lpT = setTimeout(()=>{
      lpFired = true;
      try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
      setAppMode(isCmdrMode() ? 'admiral' : 'commander');
      state.browseCache = {};   // browse results are mode-specific
      if(state.screen === 'decklist' || state.screen === 'decks'){
        // Deck views belong to the fleet you were in — cross over to the
        // other side's My Stuff instead of staring at the wrong fleet's deck.
        switchPage('decks');
      } else {
        render();   // stay on the page, re-dressed in the other side's colours
      }
    }, 550); };
    const lpCancel = ()=>{ if(lpT){ clearTimeout(lpT); lpT = null; } };
    hb.addEventListener('touchstart', lpStart, {passive:true});
    hb.addEventListener('touchend', lpCancel);
    hb.addEventListener('touchmove', lpCancel);
    hb.addEventListener('touchcancel', lpCancel);
    hb.addEventListener('mousedown', lpStart);
    hb.addEventListener('mouseup', lpCancel);
    hb.addEventListener('mouseleave', lpCancel);
    hb.addEventListener('contextmenu', e=>e.preventDefault());
    hb.addEventListener('click', ()=>{ if(lpFired){ lpFired = false; return; } switchPage('home'); });
  }
  // The page word is plain text — only on the decklist is it tappable, to rename the deck.
  if(state.screen === 'decklist'){
    document.getElementById('brandTitle')?.addEventListener('click', ()=>{
      const d = getDeck(state.activeDeckId);
      if(!d) return;
      const name = prompt('Rename this deck:', d.name);
      if(name === null) return;
      d.name = name.trim() || 'Untitled Fleet';
      scheduleSave(d);
      render();
    });
  }
}

function deckPriceFromCache(d){
  const all = deckLeaders(d).concat(d.cards||[]);
  const seen = new Set(); let total = 0; let complete = all.length > 0;
  const now = Date.now();
  all.forEach(c=>{
    if(seen.has(c.name)) return;
    seen.add(c.name);
    const hit = state.priceCache[c.name];
    if(hit && now - hit.t < PRICE_TTL){ if(typeof hit.v === 'number') total += hit.v; }
    else complete = false;
  });
  return { total, complete };
}

function folderTileHtml(f){
  const deckN = countFolderDecks(f.id);
  const subN = childFolders(f.id).length;
  const bits = [];
  if(deckN) bits.push(deckN+' deck'+(deckN>1?'s':''));
  if(subN) bits.push(subN+' folder'+(subN>1?'s':''));
  return `<div class="folder-tile" data-folder="${f.id}">
      <button class="tile-menu" data-foldermenu="${f.id}" title="Folder options">⋯</button>
      <div class="folder-face">${folderIconSvg(f.icon, 56)}</div>
      <div class="folder-name">${escapeHtml(f.name)}</div>
      <div class="folder-sub">${bits.join(' · ')||'empty'}</div>
    </div>`;
}
function countFolderDecks(folderId){
  // decks directly in this folder + all descendant folders — CURRENT MODE ONLY,
  // so a folder's count never includes the other fleet's decks.
  let ids = [folderId], total = 0;
  while(ids.length){
    const cur = ids.pop();
    total += decksInFolderMode(cur).length;
    childFolders(cur).forEach(c=>ids.push(c.id));
  }
  return total;
}

    if(state.decksIndex.length >= 3 && Date.now()-last > twoWeeks && Date.now()-snooze > twoWeeks){

  let el = document.getElementById('inAppPrompt');
  if(!el){ el = document.createElement('div'); el.className='deckpick-scrim'; el.id='inAppPrompt'; document.body.appendChild(el); }
  el.style.alignItems='center';

  </div>`;
  let settled = false;

function importDeckFromFile(text, filename){

/* ---------------- COLLECTION PAGE ---------------- */
function colMatch(it, codes){
  const f = state.colFilter;
  if(f.q && !it.name.toLowerCase().includes(f.q.toLowerCase())) return false;
  if(f.type && !(it.type_line||'').toLowerCase().includes(f.type.toLowerCase())) return false;
  if(f.set && it.set !== f.set) return false;
  if(f.rarity && it.rarity !== f.rarity) return false;
  if(f.color){
    const cs = it.colors||[];
    if(f.color==='M'){ if(cs.length < 2) return false; }
    else if(f.color==='C'){ if(cs.length) return false; }
    else if(!cs.includes(f.color)) return false;
  }
  if(f.legal){
    codes = codes || new Set((activeLegalSetCodes()||[]).map(c=>String(c).toLowerCase()));
    const s = collectionCardStatus(it, codes);              // null = legal in current format
    if(f.legal === 'legal' && s !== null) return false;
    if(f.legal === 'illegal' && s === null) return false;
  }
  return true;
}
function colFilteredItems(){
  const f = state.colFilter;
  const codes = new Set((activeLegalSetCodes()||[]).map(c=>String(c).toLowerCase()));
  return state.collection.items.filter(it=>{
    if(f.binder && it.binder !== f.binder) return false;
    return colMatch(it, codes);
  });
}
function binderName(id){
  if(id === '__wants__') return 'Wants';
  const b = state.collection.binders.find(x=>x.id===id); return b ? b.name : null;
}
/* The Wants binder maintains itself: every card that appears in any of your
   decks but not in your collection. Manual additions and removals stick. */
function computeWants(){
  const owned = ownedNames();
  const ex = new Set(state.collection.wantsExclude||[]);
  const map = new Map();
  const take = (c)=>{
    if(!c || !c.name || owned.has(c.name) || ex.has(c.name) || map.has(c.name)) return;
    const hit = state.priceCache[c.name];
    map.set(c.name, { name:c.name, img: c.img || cardImageMed(c), type_line: c.type_line||'', set: c.set||'',
      set_name: c.set_name||'', colors: c.colors || c.color_identity || [], rarity: c.rarity||'',
      border_color: c.border_color||'', eur: c.eur != null ? c.eur : ((hit && typeof hit.v==='number') ? hit.v : null) });
  };
  (state.decksIndex||[]).forEach(d=>{
    deckLeaders(d).forEach(take);
    (d.cards||[]).forEach(take);
  });
  (state.collection.wantsManual||[]).forEach(take);
  return Array.from(map.values());
}
function collectionPageHtml(){
  const f = state.colFilter;
  const wantsMode = f.binder === '__wants__';
  const _colLegalCodes = new Set((activeLegalSetCodes()||[]).map(c=>String(c).toLowerCase()));
  const items = wantsMode ? computeWants().filter(it=>colMatch(it, _colLegalCodes)) : colFilteredItems();
  const totalQty = wantsMode ? items.length : items.reduce((a,it)=>a+it.qty,0);
  const totalEur = items.reduce((a,it)=>a+(it.eur||0)*(wantsMode?1:it.qty),0);
  return `<main>
    <div class="action-row" style="margin-bottom:8px;position:relative;">
      <button class="ghost-btn" id="colBindersBtn" style="flex:1;">${!f.binder ? '🗂' : (f.binder==='__wants__' ? '🔖' : binderGlyphsHtml(binderName(f.binder)||''))} ${escapeHtml(f.binder ? (f.binder==='__wants__' ? 'Wants' : (binderName(f.binder)||'Binder')) : 'All binders')} ⌄</button>

/* Read a binder's name and show matching symbols in front of it: mana pips for
   colours (same icons as the advanced filter), a rarity dot or a type glyph, or
   a folder as a generic fallback when the name follows none of these. */
function binderGlyphsHtml(name){
  const toks = new Set(norm(name).replace(/[^a-z]+/g,' ').trim().split(/\s+/).filter(Boolean));
  const cols = [];
  const addC = s=>{ if(!cols.includes(s)) cols.push(s); };
  const colorWords = { white:'W', blue:'U', black:'B', red:'R', green:'G', colorless:'C' };
  Object.keys(colorWords).forEach(w=>{ if(toks.has(w)) addC(colorWords[w]); });
  const combos = { azorius:'WU',dimir:'UB',rakdos:'BR',gruul:'RG',selesnya:'GW',orzhov:'WB',izzet:'UR',golgari:'BG',boros:'RW',simic:'GU',bant:'GWU',esper:'WUB',grixis:'UBR',jund:'BRG',naya:'RGW',mardu:'RWB',temur:'GUR',abzan:'WBG',jeskai:'URW',sultai:'BGU',wubrg:'WUBRG',rainbow:'WUBRG',fivecolor:'WUBRG' };
  Object.keys(combos).forEach(k=>{ if(toks.has(k)) combos[k].split('').forEach(addC); });
  if(cols.length){
    const order='WUBRGC'; cols.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    return `<span class="binder-glyphs">${cols.map(s=>manaIconSvg(s,14)).join('')}</span>`;
  }
  const rar = { mythic:'M',mythics:'M',rare:'R',rares:'R',uncommon:'U',uncommons:'U',common:'C',commons:'C' };
  for(const w in rar){ if(toks.has(w)) return `<span class="binder-glyphs"><span class="rar-dot rar-${rar[w]}" title="${w}"></span></span>`; }
  const typeIco = { creature:'🐾',creatures:'🐾',instant:'⚡',instants:'⚡',sorcery:'🔮',sorceries:'🔮',artifact:'⚙️',artifacts:'⚙️',enchantment:'✨',enchantments:'✨',planeswalker:'🔥',planeswalkers:'🔥',land:'🗺️',lands:'🗺️',token:'🎫',tokens:'🎫' };
  for(const w in typeIco){ if(toks.has(w)) return `<span class="binder-glyphs">${typeIco[w]}</span>`; }
  return '🗂';
}

function openBindersPop(anchorEl, onPick, includeAll){
  document.getElementById('bindersPop')?.remove();
  const pop = document.createElement('div');
  pop.id = 'bindersPop';
  const rows = [];
  if(includeAll){
    rows.push(`<button data-pick="" ><span class="ib">${ICONS.collection}</span>All binders</button>`);
    rows.push(`<button data-pick="__wants__">🔖 Wants <span style="font-size:10.5px;color:var(--sub-text-2);">· auto</span></button>`);
  }
  else rows.push(`<button data-pick="">— No binder —</button>`);
  state.collection.binders.forEach(b=>rows.push(`<div class="bp-row"><button data-pick="${b.id}">${binderGlyphsHtml(b.name)} ${escapeHtml(b.name)}</button><button class="bp-edit" data-ed="${b.id}" title="Rename">✎</button></div>`));
  rows.push(`<button data-newb="1" style="color:var(--brass);">＋ New binder</button>`);
  pop.innerHTML = rows.join('');
  document.body.appendChild(pop);
  const r = anchorEl.getBoundingClientRect();
  pop.style.top = (r.bottom + 6 + window.scrollY) + 'px';
  pop.style.left = Math.max(8, r.left) + 'px';
  const close = ()=>pop.remove();
  pop.querySelectorAll('button[data-pick]').forEach(b=>b.addEventListener('click', ()=>{ close(); onPick(b.dataset.pick || null); }));
  pop.querySelectorAll('.bp-edit').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const binder = state.collection.binders.find(x=>x.id===b.dataset.ed);
    const name = prompt('Rename binder', binder ? binder.name : '');
    if(binder && name && name.trim()){ binder.name = name.trim(); saveCollection(); close(); render(); }
  }));
  pop.querySelector('button[data-newb]').addEventListener('click', ()=>{
    const name = prompt('New binder name');
    if(name && name.trim()){
      const b = { id: 'bnd_'+Date.now().toString(36), name: name.trim() };
      state.collection.binders.push(b); saveCollection(); close(); onPick(b.id);
    }
  });
  setTimeout(()=>document.addEventListener('click', function once(ev){ if(!pop.contains(ev.target)){ close(); document.removeEventListener('click', once); } }), 0);
}

/* Set symbols as the card wears them: the official set SVG, tinted by the
   printing's rarity. Rendered as an image (loads without CORS), with hard
   sizing no surrounding rule can override; a set-code chip only appears if
   the image genuinely fails to load. */
function setIcoHtml(code, rarity){
  if(!code) return '';
  const c = String(code).toLowerCase();
  if(!state.setIconMap){
    try{ state.setIconMap = JSON.parse(localStorage.getItem(LS_PREFIX+'setIcons')||'{}'); }catch(e){ state.setIconMap = {}; }
  }
  const url = state.setIconMap[c] || `https://svgs.scryfall.io/sets/${c}.svg`;
  const r = ['common','uncommon','rare','mythic','special','bonus'].includes(rarity) ? rarity : 'common';
  return `<img class="set-ico r-${r}" src="${url}" alt="" loading="lazy" data-c="${escapeHtml(c.toUpperCase())}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'set-chip',textContent:this.dataset.c}))">`;
}
function printEur(p){ return p && p.prices ? (parseFloat(p.prices.eur)||parseFloat(p.prices.eur_foil)||null) : (p && p.eur!=null ? p.eur : null); }

/* ---- legality ----------------------------------------------------------
   Re-derived from scratch on every deck change, so swapping your Admiral or
   editing the banlist immediately re-judges cards that were legal when added. */
function checkCommanderLegality(d){
  const issues = [];
  const all = deckLeaders(d).concat(d.cards||[]);
  const total = all.length;
  if(total > 100) issues.push({ level:'error', text:`Deck has ${total} cards — Commander decks are exactly 100 including the commander.` });
  else if(total < 100) issues.push({ level:'warn', text:`${100-total} more card${100-total===1?'':'s'} to reach 100.` });
  if(!d.admiral) issues.push({ level:'warn', text:'No Commander appointed yet.' });
  else {
    if(!isLegendary(d.admiral) || !(d.admiral.type_line||'').includes('Creature'))
      issues.push({ level:'error', text:`${d.admiral.name} can't be your Commander — it must be a legendary creature.` });
    if(d.admiral.legalities && d.admiral.legalities.commander === 'banned')
      issues.push({ level:'error', text:`${d.admiral.name} is banned in Commander.` });
  }
  if(d.partner){
    if(!d.admiral) issues.push({ level:'error', text:`${d.partner.name} is a second Commander, but no first Commander is appointed.` });
    else if(!canPair(d.admiral, d.partner))
      issues.push({ level:'error', text:`${d.admiral.name} and ${d.partner.name} can't share command — their abilities don't pair.` });
    if(d.partner.legalities && d.partner.legalities.commander === 'banned')
      issues.push({ level:'error', text:`${d.partner.name} is banned in Commander.` });
  }
  const seen = new Map();
  const ci = new Set(deckColorIdentity(d));
  (d.cards||[]).forEach(c=>{
    const basic = (c.type_line||'').includes('Basic Land');
    if(!basic){
      const n = (seen.get(c.name)||0)+1;
      seen.set(c.name, n);
      if(n === 2) issues.push({ level:'error', text:`${c.name} appears more than once — Commander is singleton (basic lands excepted).` });
    }
    if(c.legalities){
      if(c.legalities.commander === 'banned') issues.push({ level:'error', text:`${c.name} is banned in Commander.` });
      else if(c.legalities.commander === 'not_legal') issues.push({ level:'error', text:`${c.name} isn't legal in Commander.` });
    }
    if(d.admiral && (c.color_identity||[]).some(x=>!ci.has(x)))
      issues.push({ level:'error', text:`${c.name} is outside your Commanders' color identity.` });
    if(deckLeaders(d).some(L=>L.name===c.name))
      issues.push({ level:'error', text:`${c.name} is both a Commander and in the deck.` });
  });
  return issues;
}
function checkDeckLegality(d){
  if(deckFormat(d) === 'commander') return checkCommanderLegality(d);
  const issues = [];
  const add = (level, label, cards) => issues.push({ level, label, cards: cards||[] });

  if(!d.admiral){
    add('error', 'No ' + fmtName(d) + ' appointed');
  } else if(!(isLegendary(d.admiral) && hasPowerToughness(d.admiral) && isNonlandFront(d.admiral))){
    add('error', `${d.admiral.name} can't be an Admiral — needs to be legendary with power/toughness`);
  } else if(isBanned(d.admiral)){
    add('error', `${d.admiral.name} is banned`);
  }
  if(d.partner){
    if(!d.admiral) add('error', `${d.partner.name} is a second leader with no first Admiral appointed`);
    else if(!canPair(d.admiral, d.partner)) add('error', `${d.admiral.name} and ${d.partner.name} can't share command — their abilities don't pair`);
    if(isBanned(d.partner)) add('error', `${d.partner.name} is banned`);
  }

  const total = d.cards.length + deckLeaders(d).length;
  if(total > DECK_TOTAL) add('error', `${total}/${DECK_TOTAL} cards — ${total-DECK_TOTAL} to cut`);
  else if(total < DECK_TOTAL) add('warn', `${total}/${DECK_TOTAL} cards — ${DECK_TOTAL-total} to add`);

  // Singleton, ignoring cards whose own text lets you run duplicates
  const counts = {};
  d.cards.forEach(c=>{ counts[c.name] = (counts[c.name]||0)+1; });
  const dupes = Object.keys(counts).filter(n=>{
    if(counts[n] < 2) return false;
    const card = d.cards.find(c=>c.name===n);
    return card && !allowsDuplicates(card);
  });
  if(dupes.length) add('error', `Duplicate card${dupes.length>1?'s':''} (singleton)`, dupes);

  deckLeaders(d).forEach(L=>{
    if(counts[L.name]) add('error', `${L.name} is both a leader and in the deck`, [L.name]);
  });

  if(d.admiral){
    const off = d.cards.filter(c=>!colorIdentityOkDeck(c, d)).map(c=>c.name);
    if(off.length) add('error', `Outside your leader${d.partner?"s'":"'s"} color identity`, Array.from(new Set(off)));
  }

  const banned = d.cards.filter(isBanned).map(c=>c.name);
  if(banned.length) add('error', `Banned card${banned.length>1?'s':''}`, Array.from(new Set(banned)));

  const lands = d.cards.filter(c=>!isNonlandFront(c)).map(c=>c.name);
  if(lands.length) add('error', `Land front side — decks run no lands`, Array.from(new Set(lands)));

  return issues;
}
function legalityHtml(d){
  if(!state.legalityOpen) return '';
  const issues = checkDeckLegality(d);
  if(!issues.length) return `<div class="legality ok" id="legalityBox"><span class="lg-icon">✓</span><span class="lg-txt">Ready to sail</span></div>`;
  const errors = issues.filter(i=>i.level==='error').length;
  return `<div class="legality ${errors?'bad':'warn'} open" id="legalityBox">
    <div class="lg-body" style="display:block;padding:10px 12px;">
