        <div class="lg-label">${escapeHtml(i.label)}</div>
        ${i.cards.length?`<div class="lg-cards">${i.cards.map(n=>`<span class="lg-card">${escapeHtml(n)}</span>`).join('')}</div>`:''}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---- pricing ------------------------------------------------------------
   Scryfall's `prices.eur` is Cardmarket's Trend Price (falling back to their
   1-day/7-day/average/suggested price when trend isn't available). We scan
   every paper printing of a card and take the cheapest, then cache it for 24h
   — both because Scryfall asks apps to cache price data, and because pricing a
   60-card deck costs one request per card. */
const PRICE_TTL = 24*60*60*1000;
/* ---------- Collection: binders + owned cards, stored locally ---------- */
function loadCollection(){
  try{
    const v = JSON.parse(localStorage.getItem(LS_PREFIX+'collection')||'null');
    if(v && Array.isArray(v.items) && Array.isArray(v.binders)){
      if(!Array.isArray(v.wantsExclude)) v.wantsExclude = [];
      if(!Array.isArray(v.wantsManual)) v.wantsManual = [];
      return v;
    }
  }catch(e){}
  return {binders:[], items:[], wantsExclude:[], wantsManual:[]};
}
function saveCollection(){ state._ownedSet = null; try{ localStorage.setItem(LS_PREFIX+'collection', JSON.stringify(state.collection)); }catch(e){} }
const COL_CONDS = [['MT','Mint'],['NM','Near Mint'],['EX','Excellent'],['GD','Good'],['LP','Light Played'],['PL','Played'],['PO','Poor']];
function slimForCollection(card){
  return { name: card.name, set: card.set, set_name: card.set_name||'', cn: card.collector_number||'',
    img: cardImageMed(card), eur: (card.prices && (parseFloat(card.prices.eur)||parseFloat(card.prices.eur_foil)))||null,
    type_line: card.type_line||'', colors: (card.color_identity||card.colors||[]), rarity: card.rarity||'', border_color: card.border_color||'',
    legal_std: (card.legalities && card.legalities.standard) || '', legal_cmd: (card.legalities && card.legalities.commander) || '' };
}
/* A collection card counts as illegal in the CURRENT format when we can show it
   isn't legal. Collections are shared across both formats, so this is evaluated
   per current mode. Older items saved before we stored legalities fall back to
   the ban list / set pool. Only the collection page ever shows this marker. */
function collectionCardStatus(it, legalCodeSet){
  const nm = norm(it.name||'');
  if(isCmdrMode()){
    if(bannedSet.has(nm) || it.legal_cmd === 'banned') return 'banned';
    if(it.legal_cmd && it.legal_cmd !== 'legal') return 'illegal';   // not_legal (e.g. un-set cards)
    return null;
  }
  // Admiral legality belongs to the CARD (ever printed in a Standard / Type-2
  // set), not to the printing you happen to own. `legal_adm` is filled in by the
  // background legality check (checkCollectionLegality); until a card is known to
  // be illegal we only flag banned cards, so a legal card owned in an
  // off-Standard printing (e.g. an 8th/9th-Edition or Ice Age reprint) is never
  // wrongly marked.
  if(bannedSet.has(nm)) return 'banned';
  if(it.legal_adm === false) return 'illegal';
  if(it.legal_adm === true) return null;
  if(it.legal_std === 'legal') return null;                         // currently Standard-legal
  const codes = legalCodeSet || new Set((activeLegalSetCodes()||[]).map(c=>String(c).toLowerCase()));
  if(codes.has(String(it.set||'').toLowerCase())) return null;      // owned printing is in the pool
  return null;                                                      // unknown — assume legal pending the check
}
function collectionCardIllegal(it, legalCodeSet){ return collectionCardStatus(it, legalCodeSet) !== null; }
function collectionMarkHtml(it, legalCodeSet){
  const s = collectionCardStatus(it, legalCodeSet);
  if(s === 'banned') return '<span class="banned-mark">Banned</span>';
  if(s === 'illegal') return '<span class="illegal-mark">Illegal</span>';
  return '';
}
/* Confirm, per card, whether ANY printing sits in the Admiral (ever-Standard)
   set pool — the same rule search uses — and cache it on each item as legal_adm.
   Runs quietly in the background on the collection page; results persist, so it
   only ever checks a given card once. Admiral-only (Commander legality is a card
   property already stored as legal_cmd). */
async function cardEverStandardLegal(name, pool){
  try{
    const q = '!"' + String(name).replace(/"/g,'') + '" game:paper';
    let url = `${SF_BASE}/cards/search?unique=prints&order=released&q=${encodeURIComponent(q)}`;
    let sets = [], guard = 0;
    while(url && guard < 4){
      guard++;
      const res = await sfFetch(url, 0, true);
      if(res.status === 404) return false;         // no such card / no paper prints
      if(!res.ok) return undefined;                // network — retry another time
      const d = await res.json();
      (d.data||[]).forEach(p=>sets.push(String(p.set||'').toLowerCase()));
      url = d.has_more ? d.next_page : null;
    }
    return sets.some(s=>pool.has(s));
  }catch(e){ return undefined; }
}
async function checkCollectionLegality(){
  if(isCmdrMode()) return;                         // Admiral-only
  if(state._colLegalRunning) return;
  await resolveLegalSets();
  const pool = new Set((activeLegalSetCodes()||[]).map(c=>String(c).toLowerCase()));
  let changed = false;
  // Cheap pass: owned-in-pool or currently-Standard cards are certainly legal.
  (state.collection.items||[]).forEach(it=>{
    if(it.legal_adm === undefined && (it.legal_std === 'legal' || pool.has(String(it.set||'').toLowerCase()))){ it.legal_adm = true; changed = true; }
  });
  // Everything still unknown needs its full print list checked (dedupe by name).
  const todo = new Map();
  (state.collection.items||[]).forEach(it=>{ if(it.legal_adm === undefined){ const k=norm(it.name); if(!todo.has(k)) todo.set(k, it.name); } });
  if(changed) saveCollection();
  if(!todo.size){ if(changed && state.screen==='collection') render(); return; }
  state._colLegalRunning = true;
  let filledAny = false;
  await runLimited([...todo.values()], async (nm)=>{
    const legal = await cardEverStandardLegal(nm, pool);
    if(legal === undefined) return;                // leave for a later pass
    state.collection.items.forEach(it=>{ if(norm(it.name)===norm(nm) && it.legal_adm === undefined){ it.legal_adm = legal; filledAny = true; } });
  }, 5);
  state._colLegalRunning = false;
  if(filledAny){ saveCollection(); if(state.screen==='collection') render(); }
}
/* ---------------- Collection CSV import / export (Moxfield-compatible) ----------------
   Moxfield and Archidekt both round-trip collections as CSV, so we do the same:
   import a CSV they exported, and export a CSV they can re-import. */
const CSV_COND_TO_APP = { 'mint':'MT','m':'MT','near mint':'NM','nearmint':'NM','nm':'NM','excellent':'EX','ex':'EX','good':'GD','gd':'GD','lightly played':'LP','light played':'LP','lightlyplayed':'LP','lp':'LP','moderately played':'PL','moderatelyplayed':'PL','played':'PL','pl':'PL','mp':'PL','heavily played':'PO','hp':'PO','poor':'PO','po':'PO','damaged':'PO','dmg':'PO' };
const APP_COND_TO_CSV = { MT:'Mint', NM:'Near Mint', EX:'Lightly Played', GD:'Lightly Played', LP:'Lightly Played', PL:'Moderately Played', PO:'Damaged' };

function splitCsvLine(line){
  const out=[]; let cur=''; let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c === '"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if(c === ',' && !q){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function csvField(v){
  const s = String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function cleanImportName(name){
  let n = String(name||'').trim().replace(/^"|"$/g,'');
  n = n.replace(/\s*\*[A-Za-z]\*\s*$/,'').trim();                             // *F* foil tag
  n = n.replace(/\s*\([0-9A-Za-z]{2,6}\)\s*[0-9A-Za-z\-★]*\s*$/,'').trim();   // trailing (SET) 123
  return n;
}
// Parse a Moxfield / Archidekt collection CSV (or a plain "N Name" list) into entries.
function parseCollectionCsv(text){
  const rows = String(text||'').split(/\r?\n/).filter(l=>l.trim().length);
  if(!rows.length) return [];
  const header = splitCsvLine(rows[0]).map(h=>norm(h.replace(/^"|"$/g,'')));
  const looksCsv = rows[0].includes(',') && header.includes('name');
  const entries = [];
  const add = (name, qty, set, cn, cond, foil)=>{
    name = cleanImportName(name);
    if(!name) return;
    entries.push({ name, qty: Math.max(1, parseInt(qty,10)||1), set:(set||'').replace(/^"|"$/g,'').toLowerCase().trim(), cn:(cn||'').replace(/^"|"$/g,'').trim(), cond: CSV_COND_TO_APP[norm(cond)] || 'NM', foil: /true|foil|etched|^1$/i.test(String(foil||'').trim()) });
  };
  if(looksCsv){
    const idx = n => header.indexOf(n);
    const pick = (...names)=>{ for(const n of names){ const i=idx(n); if(i>=0) return i; } return -1; };
    const iName = idx('name');
    const iQty = pick('count','quantity','qty');
    const iSet = pick('edition','set code','edition code','set');
    const iCn = pick('collector number','collectornumber','card number');
    const iCond = idx('condition');
    const iFoil = pick('foil','finish');
    for(let r=1;r<rows.length;r++){
      const cells = splitCsvLine(rows[r]).map(c=>c.replace(/^"|"$/g,''));
      const nm = cells[iName]; if(!nm || !nm.trim()) continue;
      add(nm, iQty>=0?cells[iQty]:1, iSet>=0?cells[iSet]:'', iCn>=0?cells[iCn]:'', iCond>=0?cells[iCond]:'', iFoil>=0?cells[iFoil]:'');
    }
  } else {
    rows.forEach(l=>{
      l=l.trim();
      if(/^(deck|commander|sideboard|maybeboard|mainboard)\b\s*:?\s*$/i.test(l)) return;
      const m = l.match(/^(\d+)\s*[xX]?\s+(.+)$/);
      if(m) add(m[2], m[1]); else add(l, 1);
    });
  }
  // merge identical rows
  const merged = [];
  entries.forEach(e=>{
    const same = merged.find(x=>norm(x.name)===norm(e.name) && x.set===e.set && x.cn===e.cn && x.cond===e.cond);
    if(same) same.qty += e.qty; else merged.push(e);
  });
  return merged;
}

// Resolve entries to Scryfall cards — exact printing (set+collector number) when
// available, otherwise by name; then a name-only retry for any misses.
async function resolveCollectionEntries(entries, onProgress){
  const cards = new Array(entries.length).fill(null);
  async function batch(list){
    const chunks=[]; for(let i=0;i<list.length;i+=70) chunks.push(list.slice(i,i+70));
    let done=0; const found=new Map();
    for(const chunk of chunks){
      const ids = chunk.map(e => (e.set && e.cn) ? {set:e.set, collector_number:e.cn} : {name:e.name});
      try{
        const r = await fetch(`${SF_BASE}/cards/collection`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({identifiers: ids})});
        if(r.ok){
          const d = await r.json();
          (d.data||[]).forEach(c=>{
            found.set('s:'+(c.set||'')+':'+(c.collector_number||''), c);
            if(!found.has('n:'+norm(c.name))) found.set('n:'+norm(c.name), c);
            (c.card_faces||[]).forEach(f=>{ if(!found.has('n:'+norm(f.name))) found.set('n:'+norm(f.name), c); });
          });
        }
      }catch(err){}
      done += chunk.length; if(onProgress) onProgress(Math.min(done, list.length), list.length);
      await new Promise(res=>setTimeout(res,110));
    }
    return found;
  }
  const found1 = await batch(entries);
  const missing = [];
  entries.forEach((e,i)=>{
    let c = (e.set && e.cn) ? found1.get('s:'+e.set+':'+e.cn) : null;
    if(!c) c = found1.get('n:'+norm(e.name));
    if(c) cards[i]=c; else missing.push({e,i});
  });
  if(missing.length){
    const found2 = await batch(missing.map(m=>({name:m.e.name})));
    missing.forEach(({e,i})=>{ const c = found2.get('n:'+norm(e.name)); if(c) cards[i]=c; });
  }
  return cards;
}

// Moxfield/Archidekt don't put the binder name inside the CSV, but exports are
// often named after the binder (e.g. "White Blue Black_2026-07-21.csv"), so we
// derive a binder name from the filename — stripping the source prefix and the
// trailing date stamp — and auto-create/reuse a binder with that name.
function binderNameFromFilename(fname){
  let n = String(fname||'').replace(/\.[a-z0-9]+$/i,'');
  n = n.replace(/^(moxfield|archidekt|manabox|deckbox|tcgplayer|dragonshield|helvault)[_\- ]+/i,'');
  n = n.replace(/[_\- ]+\d{4}-\d{2}-\d{2}([-_ tT]?\d{0,4}z?)?$/i,'');
  n = n.replace(/[_\- ]+\d{6,}$/,'');
  n = n.replace(/_+/g,' ').replace(/\s+/g,' ').trim();
  if(!n) return '';
  // "haves"/"wants" are Moxfield's generic export labels, not real binder names —
  // treat them as unknown so the import prompts the user for a name.
  if(/^(haves?|wants?|collection|library|inventory|cards)$/i.test(n)) return '';
  if(/^[a-z]+$/.test(n)) n = n.charAt(0).toUpperCase()+n.slice(1);   // "cube" -> "Cube"
  return n;
}

    if(nm){
      const existing = (state.collection.binders||[]).find(b=>norm(b.name)===norm(nm));
      if(existing){ binder = existing.id; binderLabel = existing.name; }
      else { const b={id:'bnd_'+Date.now().toString(36), name:nm}; state.collection.binders.push(b); binder=b.id; binderLabel = nm; }
    } else binder='';

  let types=0, qtyTotal=0; const missing=[];

  });

}

function loadPriceCache(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'prices');
    if(!raw) return {};
    const obj = JSON.parse(raw) || {};
    const now = Date.now();
    Object.keys(obj).forEach(k=>{ if(!obj[k] || now - obj[k].t > PRICE_TTL) delete obj[k]; });
    return obj;
  }catch(e){ return {}; }
}
function savePriceCache(){
  try{ localStorage.setItem(LS_PREFIX+'prices', JSON.stringify(state.priceCache)); }catch(e){}
}
function fmtEur(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return '€' + Number(v).toFixed(2);
}
async function cheapestEur(card){
  if(!card || !card.name) return null;
  const hit = state.priceCache[card.name];
  if(hit && Date.now()-hit.t < PRICE_TTL) return hit.v;
  if(!card.prints_search_uri) return null;
  let min = null;
  try{
    const res = await sfFetch(card.prints_search_uri, 0, true);
    if(!res.ok) return null;
    const data = await res.json();
    (data.data||[]).forEach(p=>{
      if(p.digital) return;                 // MTGO/Arena printings aren't purchasable in paper
      const raw = p.prices && p.prices.eur;
      if(!raw) return;
      const e = parseFloat(raw);
      if(!isNaN(e) && (min===null || e < min)) min = e;
    });
  }catch(e){ console.error('price lookup failed for', card.name, e); return null; }
  state.priceCache[card.name] = { v: min, t: Date.now() };
  savePriceCache();
  return min;
}

/* Pricing a whole deck one card at a time means one request per card. Instead we
   ask Scryfall for the printings of a batch of cards in a single query
   (`!"A" or !"B" or ...` with unique=prints) and reduce to the cheapest per name
   client-side — roughly an order of magnitude fewer round-trips. */
const PRICE_BATCH = 10;
function exactNameClause(name){
  // Scryfall's !"..." is an exact-name match; strip stray quotes so we can't break the query
  return '!"' + name.replace(/"/g,'') + '"';
}
async function fetchPricesForBatch(names){
  const found = {};
  names.forEach(n=>{ found[n] = null; });
  const q = '(' + names.map(exactNameClause).join(' or ') + ') game:paper -is:digital';
  let url = `${SF_BASE}/cards/search?unique=prints&q=${encodeURIComponent(q)}`;
  // Look up each name case-insensitively; Scryfall echoes canonical capitalisation
  const byLower = {};
  names.forEach(n=>{ byLower[n.toLowerCase()] = n; });
  for(let page=0; page<6 && url; page++){
    let data;
    try{
      const res = await sfFetch(url);
      if(!res.ok){
        if(res.status === 404) break;   // nothing in this batch matched
        throw new Error('status '+res.status);
      }
      data = await res.json();
    }catch(e){ console.error('batch price query failed', e); return null; }
    (data.data||[]).forEach(p=>{
      if(p.digital) return;
      const key = byLower[(p.name||'').toLowerCase()];
      if(!key) return;
      const raw = p.prices && p.prices.eur;
      if(!raw) return;
      const e = parseFloat(raw);
      if(isNaN(e)) return;
      if(found[key]===null || e < found[key]) found[key] = e;
    });
    url = data.has_more ? data.next_page : null;
  }
  return found;
}
async function priceDeck(d, onProgress){
  const all = deckLeaders(d).concat(d.cards);
  const seen = new Set(); const unique = [];
  all.forEach(c=>{ if(!seen.has(c.name)){ seen.add(c.name); unique.push(c); } });

  const now = Date.now();
  const needed = unique.filter(c=>{
    const hit = state.priceCache[c.name];
    return !(hit && now - hit.t < PRICE_TTL);
  });

  if(needed.length){
    const batches = chunkArr(needed.map(c=>c.name), PRICE_BATCH);
    let doneNames = unique.length - needed.length;
    if(onProgress) onProgress(doneNames, unique.length);
    // A few batches in parallel; sfFetch's queue still paces the actual requests
    await runLimited(batches, async (names)=>{
      const found = await fetchPricesForBatch(names);
      if(found){
        names.forEach(n=>{ state.priceCache[n] = { v: found[n], t: Date.now() }; });
      } else {
        // Batch failed outright — fall back to per-card lookups so one bad
        // query doesn't wipe out the whole deck's pricing
        for(const n of names){
          const card = unique.find(c=>c.name===n);
          if(card) await cheapestEur(card);
        }
      }
      doneNames += names.length;
      if(onProgress) onProgress(Math.min(doneNames, unique.length), unique.length);
    }, 2);
    savePriceCache();
  }

  let total = 0, missing = 0;
  unique.forEach(c=>{
    const hit = state.priceCache[c.name];
    const v = hit ? hit.v : null;
    if(v===null || v===undefined) missing++; else total += v;
  });
  if(onProgress) onProgress(unique.length, unique.length);
  return { total, missing, counted: unique.length - missing };
}

/* ---- share links -------------------------------------------------------
   There's no server behind this app, so a share link carries the whole deck
   in the URL hash: names only (the receiving app re-resolves them against
   Scryfall, exactly like Import does), gzipped when the browser supports it
   to keep the link short. */
function b64urlEncode(bytes){
  let s=''; bytes.forEach(b=>{ s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length % 4) str += '=';
  const bin = atob(str);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function buildShareUrl(d){
  // Kept deliberately lean: every byte here becomes ~1.4 characters of URL,
  // and messaging apps stop linkifying very long URLs — which cuts the deck
  // code and breaks the link. Tags are personal metadata, not the deck, so
  // they no longer travel (old links that carry them still import fine).
  const payload = {
    n: d.name,
    a: d.admiral ? d.admiral.name : null,
    a2: d.partner ? d.partner.name : null,
    c: d.cards.map(c=>c.name),
    m: (d.maybeboard||[]).map(c=>c.name),
    p: d.primer || '',
    by: d.author || ''
  };
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  let token;
  if(typeof CompressionStream !== 'undefined'){
    try{
      let fmt = 'deflate-raw', prefix = 'd';
      let cs;
      try{ cs = new CompressionStream(fmt); }
      catch(e){ fmt = 'gzip'; prefix = 'g'; cs = new CompressionStream(fmt); }
      const w = cs.writable.getWriter();
      w.write(bytes); w.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      token = prefix + b64urlEncode(new Uint8Array(buf));
    }catch(e){ token = 'r' + b64urlEncode(bytes); }
  } else {
    token = 'r' + b64urlEncode(bytes);
  }
  // location.origin is the literal string "null" on file:// and content:// pages,
  // which produced links like "null/path#deck=…". Strip any existing hash instead.
  const base = location.href.split('#')[0].split('?')[0];
  return base + '?deck=' + token;
}
async function decodeShareToken(token){
  // Messaging apps wrap, truncate, and decorate pasted links — strip anything
  // that can't be part of a token (spaces, newlines, trailing ellipsis/
  // punctuation) before decoding, so a cleanly copied link always survives.
  token = String(token||'').replace(/[^A-Za-z0-9_-]/g, '');
  const kind = token[0];
  const bytes = b64urlDecode(token.slice(1));
  let json;
  if(kind === 'd'){
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter();
    w.write(bytes); w.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    json = new TextDecoder().decode(buf);
  } else if(kind === 'g'){
    const ds = new DecompressionStream('gzip');
    const w = ds.writable.getWriter();
    w.write(bytes); w.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    json = new TextDecoder().decode(buf);
  } else {
    json = new TextDecoder().decode(bytes);
  }
  return JSON.parse(json);
}
async function shareDeck(d){
  // A share *link* only exists if this app itself lives at a real web address.
  // Opened as a local file (file:// or content://) there is nothing for the
  // link to point at, so share the decklist as text instead of a dead link.
  const hosted = /^https?:/i.test(location.href);
  if(!hosted){
    const lines = [`${d.name} — ${deckFormat(d)==='commander'?'Commander':'Admiral'} deck`];
    if(d.admiral) lines.push(`${fmtName(d)}: ${d.admiral.name}`);
    if(d.partner) lines.push(`Partner: ${d.partner.name}`);
    lines.push('', ...d.cards.map(c=>'1 '+c.name));
    const text = lines.join('\n');
    if(navigator.share){
      try{ await navigator.share({ title: d.name, text }); return; }
      catch(e){ if(e && e.name==='AbortError') return; }
    }
    try{ await navigator.clipboard.writeText(text); toast('Decklist copied — share links need the app hosted at a web address.'); return; }
    catch(e){ toast('Could not share this deck.'); }
    return;
  }
  // Byline: shown on the shared deck page. Asked once, remembered for future
  // shares, editable any time from this prompt.
  if(d.author === undefined || d.author === null){
    const remembered = localStorage.getItem(LS_PREFIX+'authorName') || '';
    const name = await new Promise(res=>openInAppPrompt('Sign your deck', 'Your name or handle (optional)', remembered, v=>res(v)));
    d.author = (name||'').trim();
    if(d.author){ try{ localStorage.setItem(LS_PREFIX+'authorName', d.author); }catch(e){} }
    persistDeck(d);
  }
  let url;
  try{ url = await buildShareUrl(d); }
  catch(e){ console.error('share encode failed', e); toast('Could not build a share link for this deck.'); return; }
  const isLocalFile = location.protocol === 'file:' || location.protocol === 'content:';
  const text = `${d.name} — ${deckFormat(d)==='commander'?'Commander':'Admiral'} format decklist`;
  if(navigator.share){
    try{ await navigator.share({ title: d.name, text, url }); return; }
    catch(e){ if(e && e.name==='AbortError') return; /* fall through to clipboard */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    toast(isLocalFile ? 'Link copied — it only opens for people with this same file.' : 'Deck link copied to clipboard.');
  }catch(e){ toast('Could not share or copy this deck.'); }
}
/* If the app was opened via a share link, offer to import the deck it carries. */
function pendingShareToken(){
  try{
    const q = new URL(location.href).searchParams.get('deck');
    if(q) return q;
  }catch(e){}
  const h = location.hash || '';
  if(h.startsWith('#deck=')) return h.slice(6);   // legacy links keep working
  return null;
}
async function checkShareLink(){
  const token = pendingShareToken();
  if(!token) return false;
  history.replaceState({screen:'home'}, '', location.pathname); // don't re-import on refresh
  let payload;
  try{ payload = await decodeShareToken(token); }
  catch(e){ console.error('share decode failed', e); hideSplash(); toast('This deck link arrived incomplete — messaging apps sometimes cut long links. Ask the sender to copy the link (Share → copy) and send it as-is.', 5000); return false; }
  openShowcase(payload, {fromLink:true});
  return true;
}

/* ================= DECK SHOWCASE =================
   A shared link opens as a proper deck page — admiral art up top, the
   builder's byline and primer, the full list with prices — with ♥ Save to
   collection and Import buttons. Everything lives in the link itself;
   no server, no accounts. */
/* Close the top overlay, then run `fn` only after the history-driven close has
   actually completed — closing and navigating in the same tick was leaving
   half-rendered screens (missing nav bar) after Save/Import on deck pages. */
function closeOverlayThen(fn){
  if(!state.overlayStack.length){ fn(); return; }
  const top = state.overlayStack[state.overlayStack.length-1];
  if(!top.pushed){
    // Overlay has no history entry — it closes synchronously, no popstate.
    closeTopOverlay();
    fn();
    return;
  }
  let done = false;
  const h = ()=>{ if(done) return; done = true; window.removeEventListener('popstate', h); setTimeout(fn, 30); };
  window.addEventListener('popstate', h);
  setTimeout(h, 600);   // safety: if popstate never fires, proceed anyway
  closeTopOverlay();
}

function currentPreviewSets(){
  const today = new Date().toISOString().slice(0,10);
  const cmdr = isCmdrMode();
  // Standard-legal main sets are Scryfall set_type 'core' or 'expansion'. This
  // keeps Admiral to Standard-legal previews (The Hobbit main set HOB shows;
  // its Commander-only companion HOC — set_type 'commander' — does not), while
  // Commander shows every upcoming paper set. Both read the live Scryfall
  // catalogue so the page is never behind.
  const STANDARD_TYPES = new Set(['core','expansion']);
  const rawByCode = new Map((state.allSetsRaw||[]).map(s=>[s.code, s]));
  const admiralOk = (code, rawType)=>{
    const t = rawType || (rawByCode.get(code)||{}).set_type;
    return cmdr || (t && STANDARD_TYPES.has(t));
  };
  const map = new Map();
  Object.entries(autoSets.previewMeta||{}).forEach(([c,dte])=>{
    if(dte > today && admiralOk(c))
      map.set(c, { code:c, name: autoSets.names[c]||c.toUpperCase(), date:dte, ub:(autoSets.ubCodes||[]).includes(c) || (state.legalSetCodesUB||[]).includes(c) });
  });
  const SKIP_TYPES = new Set(['token','memorabilia','minigame']);
  (state.allSetsRaw||[]).forEach(x=>{
    if(x.digital || !x.released_at || x.released_at <= today || map.has(x.code)) return;
    if(SKIP_TYPES.has(x.set_type)) return;
    if(!admiralOk(x.code, x.set_type)) return;
    map.set(x.code, { code:x.code, name:x.name, date:x.released_at, ub:(autoSets.ubCodes||[]).includes(x.code) || (state.legalSetCodesUB||[]).includes(x.code) });
  });
  return Array.from(map.values()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0, cmdr ? 24 : 16);
}
async function fetchWholeSet(code, fresh){
  state._spoilerCache = state._spoilerCache || {};
  if(!fresh && state._spoilerCache[code]) return state._spoilerCache[code];
  const out = [];
  // No game:paper here — preview cards often carry empty game flags until
  // release, and that filter was silently hiding entire spoiler seasons.
  let url = `${SF_BASE}/cards/search?unique=cards&order=set&q=${encodeURIComponent('set:'+code)}`;
  for(let i=0; i<3 && url; i++){
    try{
      const r = await sfFetch(url, 0, false, !!fresh);
      if(!r.ok) break;
      const d = await r.json();
      (d.data||[]).forEach(c=>out.push(c));
      url = d.has_more ? d.next_page : null;
    }catch(e){ break; }   // keep whatever pages arrived
  }
  state._spoilerCache[code] = out;
  return out;
}

async function wireSpoilersPage(){
  // First visit of the session: force a fresh pull so the page is never behind
  // Scryfall, without the user having to remember the refresh button.
  if(!state._spoilerAutoFresh){
    state._spoilerAutoFresh = true;
    state._spoilerCache = {};
    (async ()=>{
      try{ await resolveLegalSets(true); }catch(e){}   // fresh /sets → allSetsRaw (Commander sees every new set)
      try{ await checkForNewSets(true); }catch(e){}     // refresh curated previewMeta (Admiral's Standard list)
      if(state.screen==='spoilers') render();
    })();
  }
  // Refresh on demand: an explicit button instead of a pull gesture — the
  // document-level drag interception kept colliding with native scrolling,
  // so it's gone; the app no longer touches scroll gestures at all here.
  document.querySelectorAll('[data-spjump]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const head = document.getElementById('spHead-' + b.dataset.spjump);
      if(head) head.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  const rBtn = document.getElementById('spRefreshBtn');
  if(rBtn && !rBtn.dataset.wired){
    rBtn.dataset.wired = '1';
    rBtn.addEventListener('click', async ()=>{
      rBtn.disabled = true;
      rBtn.textContent = '⟳ Checking for new spoilers…';
      state._spoilerCache = {};
      state._spoilerFresh = true;
      try{ await checkForNewSets(true); }catch(e){}
      render();   // sets may have been added, purged, or reclassified
    });
  }
  const freshPull = !!state._spoilerFresh;
  state._spoilerFresh = false;
  for(const x of currentPreviewSets()){
    let cards;
    try{ cards = await fetchWholeSet(x.code, freshPull); }
    catch(e){ cards = null; }   // one bad set must never strand the others
    const box = document.getElementById('spSet-' + x.code);
    if(!box){ if(state.screen !== 'spoilers') return; else continue; }
    if(cards === null){ box.innerHTML = '<p class="hint">Couldn\'t reach the archive for this set — tap “Check for new spoilers” to retry.</p>'; continue; }
    if(!cards.length){ box.innerHTML = '<p class="hint">Nothing spoiled yet — check back soon.</p>'; continue; }
    if(cards.length > (autoSets.previewSeen[x.code]||0)){ autoSets.previewSeen[x.code] = cards.length; saveAutoSets(); }
    box.innerHTML = `<div class="sc-grid">${cards.map(c=>`<button class="sc-tile" data-spn="${escapeHtml(c.name)}"><img loading="lazy" class="${wbClass(c)}" src="${cardImageMed(c)}" alt="${escapeHtml(c.name)}">${ubMarkHtml(c)}${pvMarkHtml(c)}</button>`).join('')}</div>
      <p class="hint" style="margin:6px 0 2px;">${cards.length} card${cards.length===1?'':'s'} previewed so far.</p>`;
    box.querySelectorAll('.sc-tile').forEach(b=>{
      b.addEventListener('click', ()=>{
        const card = cards.find(c=>c.name===b.dataset.spn);
        if(card) openCardInfo(card);
      });
    });
  }
}

/* Resolve the shared names on the receiver's device and show the deck the way
   the app always shows cards — image tiles plus live stats — instead of a
   text list. Names that can't be resolved are listed rather than dropped. */
async function renderShowcaseCards(payload, admiralCard){
  const names = payload.c || [];
  const maybe = payload.m || [];
  let resolved;
  try{ resolved = await namesToLegalCards(names.concat(maybe)); }
  catch(e){ resolved = []; }
  const byName0 = new Map(resolved.map(c=>[c.name.toLowerCase(), c]));
  const out = {
    admiral: admiralCard,
    main: names.map(n=>byName0.get(n.toLowerCase())).filter(Boolean),
    maybe: maybe.map(n=>byName0.get(n.toLowerCase())).filter(Boolean)
  };
  const wrap = document.getElementById('scGridWrap');
  if(!wrap) return out;   // showcase was closed mid-resolve
  const missing = names.concat(maybe).filter(n=>!byName0.get(n.toLowerCase()));

  const tile = (c)=>`<button class="sc-tile" data-scn="${escapeHtml(c.name)}"><img loading="lazy" class="${wbClass(c)}" src="${cardImageMed(c)}" alt="${escapeHtml(c.name)}">${ubMarkHtml(c)}${pvMarkHtml(c)}</button>`;

  // Grouped and sorted exactly like the decklist page's default view: the
  // same categories in the same order, each with its price and count, cards
  // sorted by mana value then name — with the whole-deck total on top.
  const byCat = {}; CATS.forEach(c=>byCat[c]=[]);
  out.main.forEach((c,i)=>byCat[categoryOf(c, pseudo)].push(i));
  let html = `<div class="cat-head" style="margin-bottom:4px;"><span class="t">Total deck price</span><span class="cat-price" id="scDeckTotal">…</span><span class="n">${out.main.length + (admiralCard?1:0)}</span></div>
    <p class="hint" style="margin:0 0 10px;">Cardmarket trend price, cheapest printing of each card.</p>`;
  CATS.forEach(cat=>{
    let idxs = byCat[cat];
    if(!idxs.length) return;
    idxs = sortIdxs(idxs, out.main, 'type-cmc-name');
    const cards = idxs.map(i=>out.main[i]);
    html += `<div class="cat-group">
      <div class="cat-head"><span class="t">${cat}</span><span class="cat-price">${groupPriceLabel(cards)}</span><span class="n">${cards.length}</span></div>
      <div class="cat-body"><div class="sc-grid">${cards.map(tile).join('')}</div></div>
    </div>`;
  });
  wrap.innerHTML = html;
  const mw = document.getElementById('scMaybeWrap');
  if(mw){
    const midx = sortIdxs(out.maybe.map((_,i)=>i), out.maybe, 'type-cmc-name');
    mw.innerHTML = `<div class="sc-grid">${midx.map(i=>tile(out.maybe[i])).join('')}</div>`;
  }
  if(missing.length){
    wrap.insertAdjacentHTML('beforeend', `<p class="hint" style="margin-top:10px;">Couldn't show: ${missing.map(escapeHtml).join(', ')}</p>`);
  }
  const wireRoot = (root, list)=>{
    root.querySelectorAll('.sc-tile:not([data-w])').forEach(b=>{
      b.dataset.w = '1';
      b.addEventListener('click', ()=>{
        const card = list.find(c=>c.name===b.dataset.scn);
        if(card) openCardInfo(card);
      });
    });
  };
  wireRoot(wrap, out.main);
  if(mw) wireRoot(mw, out.maybe);

  // Whole-deck total: the same Cardmarket-trend cheapest-printing pricing the
  // decklist page uses, streaming its progress into the header line.
  (async ()=>{
    try{
      const pseudo = { admiral: admiralCard || null, cards: out.main, maybeboard: [] };
      const { total } = await priceDeck(pseudo, (done, all)=>{
        const t = document.getElementById('scDeckTotal');
        if(t && done < all) t.textContent = `${done}/${all}…`;
      });
      const t = document.getElementById('scDeckTotal');
      if(t) t.textContent = fmtEur(total);
      if(admiralCard){
        const hit = state.priceCache[admiralCard.name];
        const ap = document.getElementById('scAdmPrice');
        if(ap && hit && typeof hit.v === 'number') ap.textContent = fmtEur(hit.v);
      }
    }catch(e){
      const t = document.getElementById('scDeckTotal');
      if(t) t.textContent = '—';
    }
  })();

  // ---- Mana Curve (Overview card removed — curve carries the average) ----
  const statsBox = document.getElementById('scStats');
  if(!statsBox) return out;
  const curveCards = out.main.concat(admiralCard?[admiralCard]:[]);
  const curve = [0,0,0,0,0,0,0];
  let mvSum = 0, mvN = 0;
  curveCards.forEach(c=>{
    const mv = Math.round(c.cmc || 0);
    curve[Math.min(6, mv)]++;
    mvSum += (c.cmc||0); mvN++;
  });
  const maxB = Math.max(1, ...curve);
  const avg = mvN ? (mvSum/mvN).toFixed(2) : '—';
  statsBox.innerHTML = `
    <div class="panel-card" style="margin:0;">
      <div class="panel-h">${out.main.length + (admiralCard?1:0)}/${DECK_TOTAL} Mana Curve <span style="text-transform:none;color:var(--brass);font-weight:700;float:right;">avg mv ${avg}</span></div>
      <div class="curve-panel">${curve.map((n,i)=>`<div class="curve-col"><div class="curve-bar" style="height:${n?(14+(n/maxB)*54):2}px"></div><div class="curve-n">${n||''}</div><div class="curve-lbl">${i===6?'6+':i}</div></div>`).join('')}</div>
    </div>`;
  return out;
}

const EXPORT_FORMATS = [

  {key:'moxfield', label:'Moxfield'},

function buildExport(d, fmt){
  const mb = d.maybeboard || [];
  if(fmt === 'moxfield'){
    const lines = [];
    if(d.admiral) lines.push(`1 ${d.admiral.name} *CMDR*`);
    if(d.partner) lines.push(`1 ${d.partner.name} *CMDR*`);
    d.cards.forEach(c=>lines.push(`1 ${c.name}`));
    if(mb.length){ lines.push('', 'SIDEBOARD:'); mb.forEach(c=>lines.push(`1 ${c.name}`)); }
    return lines.join('\n');
  }
  if(fmt === 'cockatrice'){
    const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const rows = [];
    rows.push('<?xml version="1.0" encoding="UTF-8"?>');
    rows.push('<cockatrice_deck version="1">');
    rows.push(`  <deckname>${esc(d.name||'Admiral deck')}</deckname>`);
    rows.push(`  <comments>${esc((d.primer||'').slice(0,500))}</comments>`);
    rows.push('  <zone name="main">');
    if(d.admiral) rows.push(`    <card number="1" price="0" name="${esc(d.admiral.name)}"/>`);
    if(d.partner) rows.push(`    <card number="1" price="0" name="${esc(d.partner.name)}"/>`);
    d.cards.forEach(c=>rows.push(`    <card number="1" price="0" name="${esc(c.name)}"/>`));
    rows.push('  </zone>');
    if(mb.length){
      rows.push('  <zone name="side">');
      mb.forEach(c=>rows.push(`    <card number="1" price="0" name="${esc(c.name)}"/>`));
      rows.push('  </zone>');
    }
    rows.push('</cockatrice_deck>');
    return rows.join('\n');
  }
  if(fmt === 'plain'){
    const lines = [];
    if(d.admiral) lines.push(d.admiral.name);
    if(d.partner) lines.push(d.partner.name);
    d.cards.forEach(c=>lines.push(c.name));
    return lines.join('\n');
  }
  const lines = [];
  if(d.admiral) lines.push(leaderLineLabel(d)+': ' + d.admiral.name);
  if(d.partner) lines.push('PARTNER: ' + d.partner.name);
  d.cards.forEach(c=>lines.push(c.name));
  return lines.join('\n');
}
function exportExt(fmt){ return fmt==='cockatrice' ? 'cod' : 'txt'; }
function sortIdxs(idxs, cards, mode){
  const byNameOnly = (mode==='type-name' || mode==='name');
  return idxs.sort((a,b)=> byNameOnly
    ? cards[a].name.localeCompare(cards[b].name)
    : (cards[a].cmc||0)-(cards[b].cmc||0) || cards[a].name.localeCompare(cards[b].name));
}
function groupPriceLabel(cards){
  const now = Date.now();
  let total = 0, complete = true;
  const seen = new Set();
  cards.forEach(c=>{
    if(seen.has(c.name)) return;
    seen.add(c.name);
    const hit = state.priceCache[c.name];
    if(hit && now-hit.t < PRICE_TTL){ if(typeof hit.v==='number') total += hit.v; }
    else complete = false;
  });
  return complete ? fmtEur(total) : '';
}

    </div>`;
  }

  if(d.maybeboard.length){
    const mIdxs = d.maybeboard.map((_,i)=>i).sort((a,b)=>d.maybeboard[a].name.localeCompare(d.maybeboard[b].name));
    const collapsed = !!state.collapsed['Maybeboard'];
    html += `<div class="cat-group">
      <div class="cat-head ${collapsed?'collapsed':''}" data-cat="Maybeboard"><span class="t">Maybeboard</span><span class="cat-price">${groupPriceLabel(d.maybeboard)}</span><span class="n">${d.maybeboard.length}</span><span class="car">▾</span></div>

function renderTopPriced(d){

async function loadDeckPrice(d){
  const cardCount = d.cards.length + deckLeaders(d).length;
  if(!cardCount){ const badge0 = document.getElementById('deckTotalBadge'); if(badge0) badge0.textContent = 'Deck total: ' + fmtEur(0); return; }
  const token = ++state._priceRun;   // a later render supersedes this one
  const { total, missing, counted } = await priceDeck(d, (done, all)=>{
    if(state._priceRun !== token) return;
    const live = document.getElementById('deckPriceVal');
    if(live && done < all) live.textContent = `${done}/${all}…`;
  });
  if(state._priceRun !== token) return;
  const live = document.getElementById('deckPriceVal');
  const liveNote = document.getElementById('deckPriceNote');
  if(live) live.textContent = fmtEur(total);
  const badge = document.getElementById('deckTotalBadge');
  if(badge) badge.textContent = 'Deck total: ' + fmtEur(total);
  if(liveNote){
    liveNote.textContent = missing
      ? `Cardmarket trend price, cheapest printing of each card. ${missing} card${missing>1?'s have':' has'} no price listed.`
      : `Cardmarket trend price, cheapest printing of each card.`;
  }
  renderTopPriced(d);
}

  if(!d.admiral) return `<div class="dl-adm-empty" id="findAdmiralBtn">${deckFormat(d)==="commander"?"⚔":"⚓"}<br>No ${fmtName(d)} appointed.<br>Tap to find one.</div>`;

  let inner = cardTileHtml(d.admiral,-1,'admiral');
  if(!d.partner && A) inner += `<button class="pair-add" id="pairAddBtn" title="Add a second ${fmtName(d)} — ${escapeHtml(A.label)}">+</button>`;
  if(!d.partner) return `<div class="leader-wrap">${inner}</div>`;
  // Two seats: the second card overlaps the first diagonally, so the command
  // zone stays compact — the first card's name band remains visible and
  // tappable above the overlap.
  return `<div class="leader-stack"><div class="leader-wrap">${inner}</div><div class="leader-wrap leader-overlap">${cardTileHtml(d.partner,-1,'partner')}</div></div>`;
}
function setPartner(d, c){
  // A copy already sitting in the deck is the one promoted to the second seat.
  const dupIdx = d.cards.findIndex(x=>x.name===c.name);
  if(dupIdx >= 0) d.cards.splice(dupIdx,1);
  d.partner = c;
  logDeckChange(d, {type:'add', name:c.name, card:c});
  state.inspireCache = {};
  scheduleSave(d);
  toast(`${c.name} joins ${d.admiral ? d.admiral.name : 'the deck'} in command.`);
}
function removePartner(d){
  if(!d.partner) return;
  const p = d.partner;
  d.partner = null;
  if(!d.cards.some(x=>x.name===p.name) || allowsDuplicates(p)){
    d.cards.push(p);
    logDeckChange(d, {type:'add', name:p.name, card:p});
    toast(`${p.name} steps down ${isCmdrMode()?'into the deck':'and joins the crew'}.`);
  } else {
    logDeckChange(d, {type:'remove', name:p.name, card:p});
    toast(`${p.name} steps down — a copy was already in the deck.`);
  }
  state.inspireCache = {};
  scheduleSave(d);
}
/* Partner picker: opens pre-filled with every leader that can legally share
   command with the sitting one; typing narrows the list by name. */
function openPartnerSearch(d, onDone, opts){
  opts = opts || {};
  if(!d.admiral || !pairAbility(d.admiral)) return;
  document.getElementById('appointOverlay')?.remove();
  const label = fmtName(d);
  const A = pairAbility(d.admiral);
  const el = document.createElement('div');
  el.id = 'appointOverlay';
  el.innerHTML = `
    <div class="appoint-sheet">
      <div class="appoint-head"><span>${deckFormat(d)==='commander'?'⚔':'⚓'} Second ${escapeHtml(label)} — ${escapeHtml(A.label)}</span><button class="icon-btn" id="appointClose" style="flex:none;">${ICONS.close||'✕'}</button></div>
      <div class="searchbar" style="margin:0 0 10px;"><input id="appointInput" placeholder="Filter eligible pairings…" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
      ${opts.skippable ? `<button class="ghost-btn" id="pairSkipBtn" style="width:100%;margin:0 0 10px;">Continue without a second ${escapeHtml(label)} →</button>` : ''}
      <div id="appointResults" class="appoint-results"><div class="status"><div class="spinner"></div>Finding who can share command…</div></div>
    </div>`;
  document.body.appendChild(el);
  pushOverlay('appoint', ()=>{ document.getElementById('appointOverlay')?.remove(); });
  el.addEventListener('click', (e)=>{ if(!e.target.closest('.appoint-sheet')) closeTopOverlay(); });
  document.getElementById('appointClose').addEventListener('click', ()=> closeTopOverlay());
  document.getElementById('pairSkipBtn')?.addEventListener('click', ()=>{ closeOverlayThen(()=>{ if(opts.onSkip) opts.onSkip(); }); });
  const input = document.getElementById('appointInput');
  let pool = null;
  const draw = ()=>{
    const box = document.getElementById('appointResults');
    if(!box) return;
    if(pool === null){ box.innerHTML = `<div class="status"><div class="spinner"></div>Finding who can share command…</div>`; return; }
    const q = (input.value||'').trim().toLowerCase();
    const list = pool.filter(c=>!q || c.name.toLowerCase().includes(q)).slice(0,40);
    if(!list.length){ box.innerHTML = `<div class="empty-note" style="padding:14px 4px;">No eligible pairing${q?` matches “${escapeHtml(q)}”`:' found'}.</div>`; return; }
    box.innerHTML = list.map((c,i)=>`
      <button class="appoint-row" data-idx="${i}">
        <img loading="lazy" class="${wbClass(c)}" src="${cardImageMed(c)||cardImage(c)}" alt="">
        <div class="appoint-row-txt"><div class="ar-name">${escapeHtml(c.name)}</div><div class="ar-type">${escapeHtml(frontFace(c).type_line||'')}</div></div>
        <span class="ar-set">Pair ▸</span>
      </button>`).join('');
    box.querySelectorAll('.appoint-row').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const c = list[+btn.dataset.idx];
        if(!c) return;
        if(onDone){ closeOverlayThen(()=>onDone(c)); return; }
        setPartner(d, c);
        closeTopOverlay();
        render();
      });
    });
  };
  (async ()=>{
    const clause = pairSearchClause(d.admiral);
    let results = [];
    if(clause){
      try{ const r = await searchAndVerifyLegal(clause, 'edhrec', 300); results = r.results || []; }catch(e){}
    }
    pool = results.filter(c=>partnerEligible(d, c));
    draw();
  })();
  input.addEventListener('input', draw);
}

function oracleBlockHtml(card){
  const faces = (card.card_faces && card.card_faces.length) ? card.card_faces : [card];
  return faces.map(f=>{
    const cost = (f.mana_cost||'').replace(/[{}]/g,'');
    const pt = (f.power!==undefined && f.power!==null) ? `${f.power}/${f.toughness}` : (f.loyalty!==undefined && f.loyalty!==null ? `Loyalty ${f.loyalty}` : '');
    return `<div class="oracle-face">
      <div class="oracle-head">
        <span class="oracle-name">${escapeHtml(f.name||card.name)}</span>
        ${cost?`<span class="oracle-cost">${escapeHtml(cost)}</span>`:''}
      </div>
      <div class="oracle-type">${escapeHtml(f.type_line||'')}${pt?` · ${pt}`:''}</div>
      ${f.oracle_text?`<div class="oracle-text">${escapeHtml(f.oracle_text).replace(/\n/g,'<br>')}</div>`:''}
      ${f.flavor_text?`<div class="oracle-flavor">${escapeHtml(f.flavor_text).replace(/\n/g,'<br>')}</div>`:''}
    </div>`;
  }).join('');
}

async function applyTextToDeck(d, raw, reportElId, isImport){
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let admiralName=null, partnerName=null; const cardNames=[]; const maybeNames=[];
  let inSide=false;
  lines.forEach(l=>{
    const m = l.match(/^(?:ADMIRAL|COMMANDER):\s*(.+)$/i);
    if(m){ admiralName=m[1].trim(); inSide=false; return; }
    const pm = l.match(/^PARTNER:\s*(.+)$/i);
    if(pm){ partnerName=pm[1].trim(); inSide=false; return; }
    // A header line like "SIDEBOARD:", "Maybeboard", "// Sideboard" flips into the maybe list
    if(/^(\/\/\s*)?(side ?board|maybe ?board|considering)\s*:?\s*$/i.test(l)){ inSide=true; return; }
    // A "Deck"/"Commander"/"Mainboard" header flips back to the main list
    if(/^(\/\/\s*)?(deck|main ?board|commander|creatures?|lands?)\s*:?\s*$/i.test(l) && !/\d/.test(l)){ inSide=false; return; }
    const q = l.match(/^(\d+)x?\s+(.+)$/i);
    const nm = q ? q[2].trim() : l;
    // "4 Forest" means four Forests: push the name once per copy. The
    // duplicate rules downstream decide what's allowed to repeat.
    const qty = q ? Math.max(1, Math.min(99, parseInt(q[1], 10) || 1)) : 1;
    for(let i = 0; i < qty; i++) (inSide?maybeNames:cardNames).push(nm);
  });
  document.getElementById(reportElId).innerHTML = `<div class="status"><div class="spinner"></div>Resolving ${cardNames.length+(admiralName?1:0)} cards…</div>`;
  await resolveLegalSets();
  let newAdmiral = isImport ? null : d.admiral;
  let newPartner;   // undefined = leave d.partner untouched
  const report=[];
  const leaderOk = (c)=> deckFormat(d)==='commander'
    ? (isLegendary(c) && isNonlandFront(c) && !(c.legalities && c.legalities.commander==='banned'))
    : (isLegendary(c) && isNonlandFront(c) && !isBanned(c) && (hasPowerToughness(c) || (pairAbility(c)||{}).kind==='background'));
  if(admiralName){
    const r = await resolveCardByName(admiralName);
    if(r && r.found && r.legalPrint && leaderOk(r.card) && (deckFormat(d)!=='commander' ? hasPowerToughness(r.card) : true)){
      newAdmiral = r.card; report.push({name:r.card.name,status:'ok',msg:fmtName(d)+' set'});
    } else report.push({name:admiralName,status:'bad',msg:'Not usable as '+fmtName(d)});
  }
  if(partnerName){
    const r = await resolveCardByName(partnerName);
    const lead = newAdmiral || d.admiral;
    if(r && r.found && r.legalPrint && leaderOk(r.card) && lead && canPair(lead, r.card)){
      newPartner = r.card; report.push({name:r.card.name,status:'ok',msg:'Second '+fmtName(d)+' set'});
    } else report.push({name:partnerName,status:'bad',msg: lead ? ("Can't pair with "+lead.name) : 'No first leader to pair with'});
  }
  const effLead = { admiral: newAdmiral || d.admiral, partner: (newPartner!==undefined ? newPartner : d.partner) || null, format: d.format };
  if(effLead.partner && (!effLead.admiral || !canPair(effLead.admiral, effLead.partner))) effLead.partner = null;
  const leaderNames = new Set(deckLeaders(effLead).map(c=>c.name));
  const results = await resolveManyByName(cardNames, (done, all)=>{
    const el = document.getElementById(reportElId);
    if(el) el.innerHTML = `<div class="status"><div class="spinner"></div>Resolving ${done}/${all} cards…</div>`;
  });

  // Some lookups may have failed purely due to network/rate-limit issues even
  // after sfFetch's internal retries — give those specific cards one more
  // full pass rather than reporting them as illegal or missing.
  const retryIdxs = [];
  results.forEach((r,i)=>{ if(!r || r.networkIssue || r.verifyFailed) retryIdxs.push(i); });
  if(retryIdxs.length){
    document.getElementById(reportElId).innerHTML = `<div class="status"><div class="spinner"></div>Re-checking ${retryIdxs.length} card${retryIdxs.length>1?'s':''} after a network hiccup…</div>`;
    const retried = await runLimited(retryIdxs.map(i=>cardNames[i]), resolveCardByName, 2);
    retryIdxs.forEach((idx,j)=>{ results[idx] = retried[j]; });
  }

  const newDeck=[];
  results.forEach(r=>{
    if(!r || !r.found){
      if(r && r.networkIssue) report.push({name:r.input,status:'notfound',msg:"Couldn't verify — network issue"});
      else report.push({name:r?r.input:'?',status:'notfound',msg:'Not found'});
      return;
    }
    const c=r.card;
    if(r.verifyFailed){ report.push({name:c.name,status:'notfound',msg:"Couldn't verify legality — try again"}); return; }
    if(!r.legalPrint){ report.push({name:c.name,status:'bad',msg:'Never in a legal set'}); return; }
    if(!landOk(c, d)){ report.push({name:c.name,status:'bad',msg:'Land front side'}); return; }
    if(isBanned(c)){ report.push({name:c.name,status:'bad',msg:'Banned'}); return; }
    if(leaderNames.has(c.name)){ report.push({name:c.name,status:'ok',msg:'Kept as '+fmtName(d)}); return; }
    if(effLead.admiral && !colorIdentityOkDeck(c, effLead)){ report.push({name:c.name,status:'bad',msg:'Off-color'}); return; }
    if(newDeck.some(x=>x.name===c.name) && !allowsDuplicates(c)){ report.push({name:c.name,status:'bad',msg:'Duplicate'}); return; }
    newDeck.push(c); report.push({name:c.name,status:'ok',msg:'Added'});
  });
  // Log the diff so the construction history reflects bulk edits too.
  {
    const oldNames = d.cards.map(c=>c.name), newNames = newDeck.map(c=>c.name);
    const removed = d.cards.filter(c=>!newNames.includes(c.name));
    const added = newDeck.filter(c=>!oldNames.includes(c.name));
    if(removed.length + added.length > 40){
      logDeckChange(d, {type:'bulk', name:`Bulk edit: ${added.length} added, ${removed.length} removed`});
    } else {
      removed.forEach(c=>logDeckChange(d, {type:'remove', name:c.name, card:c}));
      added.forEach(c=>logDeckChange(d, {type:'add', name:c.name, card:c}));
    }
    if(newAdmiral && (!d.admiral || d.admiral.name!==newAdmiral.name)) logDeckChange(d, {type:'admiral', name:newAdmiral.name, card:newAdmiral, prev:d.admiral||null});
  }
  // Resolve any sideboard/maybeboard cards and route them to the maybeboard.
  let newMaybe = isImport ? [] : (d.maybeboard || []);
  if(maybeNames.length){
    const mres = await resolveManyByName(maybeNames, null);
    const collected = isImport ? [] : (d.maybeboard || []).slice();
    mres.forEach(r=>{
      if(r && r.found && r.card){
        if(!collected.some(x=>x.name===r.card.name)) collected.push(r.card);
        report.push({name:r.card.name,status:'ok',msg:'To Maybeboard'});
      } else {
        report.push({name:(r && r.input) ? r.input : '?', status:'notfound', msg:'Maybeboard: not found'});
      }
    });
    newMaybe = collected;
  }
  d.cards = newDeck;
  d.maybeboard = newMaybe;
  if(newAdmiral) d.admiral = newAdmiral;
  if(newPartner !== undefined) d.partner = newPartner;
  reconcilePartner(d);
  scheduleSave(d);
  const added = report.filter(r=>r.status==='ok').length;
  const retryable = report.filter(r=>r.status!=='ok' && /network|try again/i.test(r.msg));
  const failures = report.length - added;
  if(!failures){
    // Clean run: close the panel and land back on the decklist.
    state.dlPanel = null;
    toast(isImport ? `Deck imported — ${added} cards ${isCmdrMode()?'added':'aboard'}.` : `Deck updated — ${added} cards.`);
    renderBuilderBody(d);
    return;
  }
  // Something needs attention: keep the panel open with the full report.
  document.getElementById(reportElId).innerHTML = `<p class="hint" style="margin:10px 0 6px;"><strong>${added}/${report.length} resolved — ${failures} not added, listed below:</strong></p><div class="report-list">${report.map(r=>`<div class="report-row ${r.status}"><span>${r.name}</span><span>${r.msg}</span></div>`).join('')}</div>${retryable.length ? `<button class="ghost-btn" id="retryFailedBtn" style="width:100%;margin-top:10px;">↻ Retry ${retryable.length} failed card${retryable.length>1?'s':''}</button>` : ''}`;
  toast(isImport ? 'Deck imported.' : 'Deck updated.');
  const box = document.getElementById('decklistBox');
  if(box){ box.innerHTML = categorizedListHtml(d); wireDecklistInteractions(d); }
  updateDeckMeter(d);
  document.getElementById('retryFailedBtn')?.addEventListener('click', ()=>retryFailedCards(d, retryable.map(r=>r.name), reportElId, newAdmiral));
}

async function retryFailedCards(d, names, reportElId, admiralForColorCheck){
  document.getElementById(reportElId).innerHTML = `<div class="status"><div class="spinner"></div>Retrying ${names.length} card${names.length>1?'s':''}…</div>`;
  const results = await runLimited(names, resolveCardByName, 2);
  const report=[];
  results.forEach(r=>{
    if(!r || !r.found){ report.push({name:r?r.input:'?',status:'notfound',msg: r&&r.networkIssue ? "Still couldn't verify — try again later" : 'Not found'}); return; }
    const c=r.card;
    if(r.verifyFailed){ report.push({name:c.name,status:'notfound',msg:"Still couldn't verify — try again later"}); return; }
    if(!r.legalPrint){ report.push({name:c.name,status:'bad',msg:'Never in a legal set'}); return; }
    if(!landOk(c, d)){ report.push({name:c.name,status:'bad',msg:'Land front side'}); return; }
    if(isBanned(c)){ report.push({name:c.name,status:'bad',msg:'Banned'}); return; }
    if(d.admiral && !colorIdentityOkDeck(c, d)){ report.push({name:c.name,status:'bad',msg:'Off-color'}); return; }
    if(deckLeaders(d).some(L=>L.name===c.name)){ report.push({name:c.name,status:'ok',msg:'Kept as '+fmtName(d)}); return; }
    if(d.cards.some(x=>x.name===c.name) && !allowsDuplicates(c)){ report.push({name:c.name,status:'bad',msg:'Duplicate'}); return; }
    d.cards.push(c); logDeckChange(d, {type:'add', name:c.name, card:c}); report.push({name:c.name,status:'ok',msg:'Added'});
  });
  scheduleSave(d);
  const added = report.filter(r=>r.status==='ok').length;
  const stillRetryable = report.filter(r=>r.status!=='ok' && /network|try again/i.test(r.msg));
  document.getElementById(reportElId).innerHTML = `<p class="hint" style="margin:10px 0 6px;">${added}/${report.length} resolved on retry. Anything not listed here was already settled in the first report — including duplicate or off-color rejections.</p><div class="report-list">${report.map(r=>`<div class="report-row ${r.status}"><span>${r.name}</span><span>${r.msg}</span></div>`).join('')}</div>${stillRetryable.length ? `<button class="ghost-btn" id="retryFailedBtn" style="width:100%;margin-top:10px;">↻ Retry ${stillRetryable.length} failed card${stillRetryable.length>1?'s':''}</button>` : ''}`;
  toast(`${added} more card${added!==1?'s':''} added.`);
  const box = document.getElementById('decklistBox');
  if(box){ box.innerHTML = categorizedListHtml(d); wireDecklistInteractions(d); }
  updateDeckMeter(d);
  document.getElementById('retryFailedBtn')?.addEventListener('click', ()=>retryFailedCards(d, stillRetryable.map(r=>r.name), reportElId, admiralForColorCheck));
}

/* ---------------- RANDOM CARD ----------------
   One random Admiral-legal, non-banned, nonland card per app session, plus a
   reroll button for another draw any time. */
async function loadCardOfTheDay(force){
  const box = document.getElementById('cotdBox');
  if(!box) return;
  if(state.cotd && state.cotd.card && !force){ renderCotd(state.cotd.card); return; }
  box.innerHTML = `<div class="status"><div class="spinner"></div>Drawing a card…</div>`;
  let card = null;
  if(isCmdrMode()){
    // Commander's random card rolls across EVERY Commander-legal card ever
    // printed — not the Admiral set pool, which used to quietly scope it.
    for(let attempt=0; attempt<5 && !card; attempt++){
      try{
        const res = await sfFetch(`${SF_BASE}/cards/random?q=${encodeURIComponent('game:paper -is:digital legal:commander')}`);
        if(!res.ok) continue;
        const c = await res.json();
        if(c && c.name && !isBanned(c)) card = c;
      }catch(e){}
    }
  } else {
    await resolveLegalSets();
    const codes = activeLegalSetCodes();
    if(!codes.length){ box.innerHTML=''; return; }
    for(let attempt=0; attempt<6 && !card; attempt++){
      const set = codes[Math.floor(Math.random()*codes.length)];
      try{
        const q = `set:${set} game:paper -is:digital -t:land`;
        const res = await sfFetch(`${SF_BASE}/cards/random?q=${encodeURIComponent(q)}`);
        if(!res.ok) continue;
        const c = await res.json();
        if(c && c.name && landOk(c) && !isBanned(c)) card = c;
      }catch(e){}
    }
  }
  const live = document.getElementById('cotdBox');
  if(!live) return;   // user navigated away or ran a search
  if(!card){ live.innerHTML=''; return; }
  state.cotd = {card};
  renderCotd(card);
}
function renderCotd(card){
  const box = document.getElementById('cotdBox');
  if(!box) return;
  box.innerHTML = `
    <div class="cotd-h">${modeGlyph()} Random Card</div>
    <img class="${wbClass(card)}" src="${cardImageLarge(card) || cardImage(card)}" alt="${escapeHtml(card.name)}" id="cotdImg">
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">
      <button class="cotd-add" id="cotdAdd" style="margin-top:0;">+ Add to a deck</button>
      <button class="ghost-btn" id="cotdReroll" style="padding:9px 16px;font-size:12.5px;">↻ New card</button>
    </div>`;
  document.getElementById('cotdImg').addEventListener('click', ()=>openCardInfo(card));
  document.getElementById('cotdReroll').addEventListener('click', ()=>loadCardOfTheDay(true));
  document.getElementById('cotdAdd').addEventListener('click', ()=>{
    const pinned = state.searchPinnedDeckId ? getDeck(state.searchPinnedDeckId) : null;
    if(pinned) addCardToDeckValidated(pinned, card);
    else openDeckPickPopup(card, 'main');
  });
}

function buildAdvancedClause(){
  state.searchName = document.getElementById('searchName')?.value ?? state.searchName;
  const parts = [];
  if(state.searchName.trim()) parts.push(`name:"${state.searchName.trim().replace(/"/g,'')}"`);

  // Colour identity (what an Admiral will allow in the deck)
  const chosen = Object.keys(state.searchColors).filter(c=>c!=='C' && state.searchColors[c]);
  if(state.searchColors.C && !chosen.length) parts.push('id=c');
  else if(chosen.length){
    const str = chosen.join('').toLowerCase();
    if(state.searchColorMode==='exact') parts.push(`id=${str}`);
    else if(state.searchColorMode==='including') parts.push(`id>=${str}`);
    else parts.push(`id<=${str}`);
  }

  // Colours actually printed on the card
  const cc = Object.keys(state.searchCardColors).filter(c=>c!=='C' && state.searchCardColors[c]);
  if(state.searchCardColors.C && !cc.length) parts.push('c=c');
  else if(cc.length){
    const str = cc.join('').toLowerCase();
    if(state.searchCardColorMode==='exact') parts.push(`c=${str}`);
    else if(state.searchCardColorMode==='atmost') parts.push(`c<=${str}`);
    else parts.push(`c>=${str}`);
  }

  if(state.searchCmcOp && state.searchCmcVal!=='') parts.push(`cmc${state.searchCmcOp}${state.searchCmcVal}`);
  if(state.searchManaCost.trim()) parts.push(`m:${state.searchManaCost.trim().replace(/\s+/g,'')}`);
  if(state.searchPowOp && state.searchPowVal!=='') parts.push(`pow${state.searchPowOp}${state.searchPowVal.trim()}`);
  if(state.searchTouOp && state.searchTouVal!=='') parts.push(`tou${state.searchTouOp}${state.searchTouVal.trim()}`);
  if(state.searchLoyOp && state.searchLoyVal!=='') parts.push(`loy${state.searchLoyOp}${state.searchLoyVal.trim()}`);
  if(state.searchTypeText.trim()) parts.push(`t:"${state.searchTypeText.trim().replace(/"/g,'')}"`);
  if(state.searchOracleText.trim()){
    let o = state.searchOracleText.trim();
    // A fully quoted phrase passes through; stray/unbalanced quotes are
    // stripped — one lone " used to poison the whole query with a 400.
    if(((o.match(/"/g)||[]).length) % 2) o = o.replace(/"/g,'');
    parts.push(/^".*"$/.test(o) ? `o:${o}` : `o:"${o.replace(/"/g,'')}"`);
  }
  if(state.searchKeyword.trim()) parts.push(`keyword:"${state.searchKeyword.trim().replace(/"/g,'')}"`);
  if(state.searchFlavorText.trim()) parts.push(`ft:"${state.searchFlavorText.trim().replace(/"/g,'')}"`);
  if(state.searchArtist.trim()) parts.push(`a:"${state.searchArtist.trim().replace(/"/g,'')}"`);

  // Rarity: several ticked boxes mean "any of these", so OR them together
  const rars = Object.keys(state.searchRarity).filter(r=>state.searchRarity[r]);
  if(rars.length) parts.push(rars.length===1 ? `r:${rars[0]}` : '(' + rars.map(r=>`r:${r}`).join(' OR ') + ')');

  let clause = parts.join(' ');
  // Belt and braces: a clause with an odd number of quotes is guaranteed
  // malformed — strip them all rather than send Scryfall a broken query.
  if(((clause.match(/"/g)||[]).length) % 2) clause = clause.replace(/"/g,'');
  return clause;
}
async function runAdvancedSearch(){
  const clause = buildAdvancedClause();
  state.searchRan = true; state.searchError = false;
  if(!clause && !state.searchSetCode){ document.getElementById('searchResultsBox').innerHTML = `<div class="empty-note">Enter a name or set at least one filter.</div>`; return; }
  if(state.searchSetCode && !activeLegalSetCodes().includes(state.searchSetCode)){
    const nm = (state.legalSetsMeta||{})[state.searchSetCode] || 'That set';
    document.getElementById('searchResultsBox').innerHTML = `<div class="empty-note">${escapeHtml(nm)} isn't in your card pool right now — switch it on under Extras → Universes Beyond sets, then search again.</div>`;
    return;
  }
  state.searching = true; renderSearchResultsBox();
  const { results, error } = await searchAndVerifyLegal(clause, state.searchSort, 300, { restrictSet: state.searchSetCode, dir: state.searchSortDir });
  state.searchResults = results.filter(c=>landOk(c));
  state.searchError = error;
  state.searching = false;
  renderSearchResultsBox();
}
function renderSearchResultsBox(){
  const box = document.getElementById('searchResultsBox');
  if(!box) return;
  const d = state.searchPinnedDeckId ? getDeck(state.searchPinnedDeckId) : null;
  setCotdVisible(!state.searching && !state.searchRan);
  if(state.searching){ box.innerHTML = `<div class="status"><div class="spinner"></div>Searching…</div>`; return; }
  if(!state.searchRan) return;
  if(state.searchError === 'badquery'){ box.innerHTML = `<div class="error-note">One of the filters contains something Scryfall can't read — most often a stray quote (") or a symbol in Mana Cost. Clear or fix that filter and search again.</div>`; return; }
  if(state.searchError){ box.innerHTML = `<div class="error-note">Scryfall couldn't be reached just now. Check your connection and try again — the search retries on its own, so this only appears after several failed attempts.</div>`; return; }
  if(!state.searchResults.length){ box.innerHTML = `<div class="empty-note">No legal cards found for that search.</div>`; return; }
  box.innerHTML = '';

/* Sort for recommendation lists: color first (WUBRG, then multicolor, then
   colorless), mana value second, name third. */
function colorGroupOf(c){
  const cols = frontFace(c).colors || c.colors || [];
  if(cols.length === 0) return 6;
  if(cols.length > 1) return 5;
  return {'W':0,'U':1,'B':2,'R':3,'G':4}[cols[0]] ?? 6;
}
function sortColorCmcName(cards){
  return cards.slice().sort((a,b)=>
    (colorGroupOf(a)-colorGroupOf(b)) ||
    ((a.cmc||0)-(b.cmc||0)) ||
    a.name.localeCompare(b.name)
  );
}
/* Fill in the little price line on every visible result tile. Prices come
   from the same cheapest-Cardmarket-printing lookup the decklist uses, so
   anything already priced is instant from cache. */
async function loadTilePrices(cards){
  const pending = cards.filter(c=>document.querySelector(`.st-price[data-pricecard="${encodeURIComponent(c.name)}"]`));
  if(!pending.length) return;
  await runLimited(pending, async (c)=>{
    // Yield the rate-limit queue to any live search before each price lookup
    while(_searchBusy > 0) await new Promise(r=>setTimeout(r, 200));
    if(!document.querySelector(`.st-price[data-pricecard="${encodeURIComponent(c.name)}"]`)) return null;
    const v = await cheapestEur(c);
    document.querySelectorAll(`.st-price[data-pricecard="${encodeURIComponent(c.name)}"]`).forEach(el=>{
      el.textContent = (v===null) ? 'no price listed' : fmtEur(v);
    });
    return v;
  }, 3);
}

/* ---- validated add/assign helpers (shared by pinned mode, popup mode, browse, card of the day) ---- */
function addCardToDeckValidated(d, c, refreshFn){
  if(isBanned(c)){ toast(`${c.name} is banned.`); return false; }
  if(!d.admiral){ toast(`Appoint an Admiral for ${d.name} first.`); return false; }
  if(deckLeaders(d).some(L=>L.name===c.name) && !allowsDuplicates(c)){ toast(`${c.name} is already in command of this deck.`); return false; }
  if(!colorIdentityOkDeck(c, d)){ toast(`${c.name} is off-color for your leader${d.partner?'s':''}.`); return false; }
  if(d.cards.some(x=>x.name===c.name) && !allowsDuplicates(c)){ toast(`${c.name} is already in ${d.name}.`); return false; }
  d.cards.push(c);
  logDeckChange(d, {type:'add', name:c.name, card:c});
  toast(`${c.name} added to ${d.name}.`);
  scheduleSave(d);
  if(refreshFn) refreshFn();
  return true;
}
function addToMaybeValidated(d, c, refreshFn){
  if(isBanned(c)){ toast(`${c.name} is banned.`); return false; }
  ensureMaybeboard(d).push(c);
  logDeckChange(d, {type:'addMaybe', name:c.name, card:c});
  toast(`${c.name} added to ${d.name}'s Maybeboard.`);
  scheduleSave(d);
  if(refreshFn) refreshFn();
  return true;
}
function setAdmiralValidated(d, c, refreshFn){
  if(d.admiral && !confirm(`Make ${c.name} the ${fmtName(d)} of ${d.name}? ${d.admiral.name} will step down into the main deck.`)) return false;
  promoteToAdmiral(d, c);
  if(refreshFn) refreshFn();
  return true;
}
/* Core Admiral swap: the newcomer takes command (leaving the main deck if a
   copy was already there), and the sitting Admiral steps down into the main
   deck — so a switch never loses a card, it grows the deck by one. */
function promoteToAdmiral(d, c){
  const prev = d.admiral || null;
  // If the new Admiral was sitting in the main deck, that copy is promoted.
  const dupIdx = d.cards.findIndex(x=>x.name===c.name);
  if(dupIdx >= 0) d.cards.splice(dupIdx,1);
  // Promoting the second seat to the first simply vacates the second seat.
  if(d.partner && d.partner.name === c.name) d.partner = null;
  if(prev){
    if(d.cards.some(x=>x.name===prev.name) && !allowsDuplicates(prev)){
      toast(`${prev.name} steps down — a copy was already in the deck.`);
    } else {
      d.cards.push(prev);
      logDeckChange(d, {type:'add', name:prev.name, card:prev});
    }
  }
  d.admiral = c;
  reconcilePartner(d);
  logDeckChange(d, {type:'admiral', name:c.name, card:c, prev, prevKept:true});
  state.inspireCache = {};
  scheduleSave(d);
  toast(`${c.name} takes command of ${d.name}${prev?` — ${prev.name} ${isCmdrMode()?'returns to the deck':'joins the crew'}`:''}.`);
}

/* ---------------- PROGRESSIVE RESULTS ----------------
   Big result sets render 40 tiles at a time; scrolling near the bottom loads
   the next 40 (order preserved). Prices are fetched per revealed chunk, so a
   300-card result costs the same up front as a 40-card one. Small sets render
   in one go — no sentinel, no observer. */
function pagedGrid(box, items, tileHtml, afterChunk, opts){
  opts = opts || {};
  // 20 per step: halves the images the phone must fetch and decode before the
  // first grid appears, without touching how many results exist — scrolling
  // streams the rest in just as before.
  const pageSize = opts.pageSize || 20;
  if(opts.prefixHtml) box.insertAdjacentHTML('beforeend', opts.prefixHtml);
  const grid = document.createElement('div');
  grid.className = opts.gridClass || 'sr-grid';
  box.appendChild(grid);
  let shown = 0, io = null, sentinel = null;
  const done = ()=>{ if(io){ io.disconnect(); io = null; } if(sentinel){ sentinel.remove(); sentinel = null; } };
  const renderMore = ()=>{
    if(shown >= items.length){
      // Streaming mode: the array may still be growing in the background —
      // poll briefly instead of tearing down, so new arrivals keep flowing.
      if(opts.stream && !items._complete){ setTimeout(renderMore, 450); return; }
      done(); return;
    }
    const upto = Math.min(items.length, shown + pageSize);
    const chunk = items.slice(shown, upto);
    grid.insertAdjacentHTML('beforeend', chunk.map((it,k)=>tileHtml(it, shown+k)).join(''));
    shown = upto;
    if(afterChunk) afterChunk(chunk, items.slice(0, shown));
    if(shown >= items.length && (!opts.stream || items._complete)) done();
    else if(sentinel) box.appendChild(sentinel);   // keep it below the newest tiles
  };
  if((items.length > pageSize || opts.stream) && 'IntersectionObserver' in window){
    sentinel = document.createElement('div');
    sentinel.style.cssText = 'height:1px;';
    io = new IntersectionObserver(entries=>{ if(entries.some(e=>e.isIntersecting)) renderMore(); }, {rootMargin:'900px'});
    renderMore();
    if(sentinel){ box.appendChild(sentinel); io.observe(sentinel); }
  } else {
    while(shown < items.length) renderMore();
  }
}

function wireResultButtons(list, d, refreshFn, opts){
  opts = opts || {};
  // Switch mode (entered via "Switch Commander/Admiral" on the deck page):
  // any way of choosing an eligible leader performs the swap and returns to
  // the deck — nothing gets silently added to the main deck instead.
  const swd = state.switchSeat ? getDeck(state.switchSeat) : null;
  const leaderReady = (c)=> isLegendary(c) && hasPowerToughness(c) && isNonlandFront(c) && !isBanned(c);
  const doSwitch = (c)=>{
    if(!swd) return false;
    if(!leaderReady(c)){ toast(`${c.name} can't take command.`); return true; }
    promoteToAdmiral(swd, c);
    state.switchSeat = null;
    openDeck(swd.id);
    return true;
  };
  // d = a specific deck (pinned search, inspiration, browse-with-pin) → direct adds.
  // d = null → every action asks which deck via the popup.
  document.querySelectorAll('.add-btn[data-name]:not([data-mb]):not([data-admiral])').forEach(btn=>{
    if(btn.dataset.w) return; btn.dataset.w='1';
    btn.addEventListener('click', ()=>{
      const c = list.find(x=>x.name===decodeURIComponent(btn.dataset.name));
      if(!c) return;
      if(swd){ doSwitch(c); return; }
      if(d) addCardToDeckValidated(d, c, refreshFn);
      else openDeckPickPopup(c, 'main', refreshFn);
    });
  });
  document.querySelectorAll('.add-btn[data-insp]').forEach(btn=>{
    if(btn.dataset.w) return; btn.dataset.w='1';
    btn.addEventListener('click', ()=>{
      const c = list.find(x=>x.name===decodeURIComponent(btn.dataset.name));
      if(!c) return;
      if(d) openCardReco(c, d);
      else if(state.decksIndex.length) openDeckPickPopup(c, 'reco');
      else openCardReco(c, null);
    });
  });
  document.querySelectorAll('.add-btn[data-mb]').forEach(btn=>{
    if(btn.dataset.w) return; btn.dataset.w='1';
    btn.addEventListener('click', ()=>{
      const c = list.find(x=>x.name===decodeURIComponent(btn.dataset.name));
      if(!c) return;
      if(d) addToMaybeValidated(d, c, refreshFn);
      else openDeckPickPopup(c, 'maybe', refreshFn);
    });
  });
  document.querySelectorAll('.add-btn[data-admiral]').forEach(btn=>{
    if(btn.dataset.w) return; btn.dataset.w='1';
    btn.addEventListener('click', ()=>{
      const c = list.find(x=>x.name===decodeURIComponent(btn.dataset.name));
      if(!c) return;
      if(swd){ doSwitch(c); return; }
      if(d) setAdmiralValidated(d, c, refreshFn);
      else openDeckPickPopup(c, 'admiral', refreshFn);
    });
  });
  document.querySelectorAll('.sr-tile img, .sr-row img').forEach(img=>img.addEventListener('click', ()=>{
    const tile = img.closest('[data-name]');
    const c = tile && list.find(x=>x.name===decodeURIComponent(tile.dataset.name));
    if(swd && c && leaderReady(c)){ doSwitch(c); return; }
    if(opts.onCardTap && c){ opts.onCardTap(c); return; }
    if(c){ openCardInfo(c); return; }   // full details: price, Oracle text, rulings
    showPreview(img.dataset.preview, img.dataset.wb === '1');
  }));
}

function inspirationPageHtml(){
  if(!state.decksIndex.length) return `<main>${needDeckHtml('Create a deck first to see recommendations for it.')}</main>`;
  if(!state.inspireDeckId || !getDeck(state.inspireDeckId)) state.inspireDeckId = state.activeDeckId || state.decksIndex[0].id;
  const d = getDeck(state.inspireDeckId);
  if(!d.admiral){
    return `<main>
      <div class="deck-title-row" style="margin-bottom:6px;"><div class="tb-titles"><div class="t2">${escapeHtml(d.name)}</div></div></div>
      <div class="need-deck"><div class="anchor">${modeGlyph()}</div><p>Appoint ${isCmdrMode()?'a Commander':'an Admiral'} for <strong>${escapeHtml(d.name)}</strong> first — recommendations are built from its color identity.</p><button id="goDecklistBtn">Go to Decklist</button></div>
    </main>`;
  }
  const sel = state.inspireSel;
  return `
  <main>
    <p class="hint">The most-played cards in ${escapeHtml(d.admiral.name)}'s colors, filtered to what's legal in Admiral. Tap <strong>+</strong> to add straight to ${escapeHtml(d.name)}, or <strong>☆</strong> for the Maybeboard.</p>
    <div class="browse-selects">
      <div class="bs-row">${cselectHtml('inspType', TYPE_CHIPS.map(c=>({v:c.key, l:c.key==='top'?'Card type — top cards':c.label})), sel.type, 'Card type — top cards')}</div>
      <div class="bs-row">${cselectHtml('inspTheme', [{v:'',l:'Theme — none'}].concat(BROWSE_THEMES.map(c=>({v:c.key, l:c.label}))), sel.theme, 'Theme — none')}</div>
    </div>
    <div id="inspireResults"></div>
  </main>`;
}
function wireInspirationPage(){
  const d = getDeck(state.inspireDeckId);
  if(!d){ wireNeedDeck(); return; }
  document.getElementById('goDecklistBtn')?.addEventListener('click', ()=>{ state.activeDeckId = d.id; switchPage('decklist'); });
  if(!d.admiral) return;
  _csHandlers.inspType = v=>{ state.inspireSel.type = v; render(); };
  _csHandlers.inspTheme = v=>{ state.inspireSel.theme = v; render(); };
  wireCSelects();
  loadInspiration(d);
}
/* Card-type + theme clauses combine, all inside the Admiral's color identity. */
function inspireClause(d){
  const sel = state.inspireSel;
  const parts = [];
  const t = TYPE_CHIPS.find(c=>c.key===sel.type);
  if(t && t.clause) parts.push(t.clause);
  const th = BROWSE_THEMES.find(c=>c.key===sel.theme);
  if(th) parts.push(th.clause);
  parts.push(idClauseForDeck(d));
  return parts.join(' ');
}
function inspireCacheKey(d){ return d.id + ':' + state.inspireSel.type + ':' + (state.inspireSel.theme||'-'); }
async function loadInspiration(d){
  const box = document.getElementById('inspireResults');
  const cacheKey = inspireCacheKey(d);
  if(state.inspireCache[cacheKey]){ renderInspireFromCache(cacheKey, d); return; }
  box.innerHTML = `<div class="status"><div class="spinner"></div>${isCmdrMode()?'Consulting the commander registry…':'Consulting the fleet registry…'}</div>`;
  const clause = inspireClause(d);
  // Fetch a larger pool than we display: when a card gets added to the deck
  // we filter it out and reveal the next one from this same pool instantly,
  // with no extra network round-trip.
  const { results, error } = await searchAndVerifyLegal(clause, 'edhrec', 100);
  if(cacheKey !== inspireCacheKey(d)) return;   // selection changed mid-flight
  if(error){ const b=document.getElementById('inspireResults'); if(b) b.innerHTML = `<div class="error-note">Couldn't reach Scryfall. Check your connection and try again.</div>`; return; }
  const filtered = results.filter(c=> landOk(c, d) && !isBanned(c) && !deckLeaders(d).some(L=>L.name===c.name));
  state.inspireCache[cacheKey] = filtered;
  renderInspireFromCache(cacheKey, d);
}
function renderInspireFromCache(cacheKey, d){
  const box = document.getElementById('inspireResults');
  const pool = state.inspireCache[cacheKey] || [];
  const inDeck = new Set(d.cards.map(c=>c.name));
  const remaining = pool.filter(c=>!inDeck.has(c.name));
  const display = sortColorCmcName(remaining).slice(0,30);
  // Running low on unused recommendations for this category? Quietly fetch a
  // bigger pool in the background so adding cards keeps surfacing new ones
  // instead of just shrinking the list.
  if(remaining.length < 15 && !(state.inspireRefilling && state.inspireRefilling[cacheKey])){
    refillInspireCache(cacheKey, d);
  }
  if(!display.length){ box.innerHTML = `<div class="empty-note">Nothing left to recommend here — you've already added the top picks for this category. Try another one.</div>`; return; }
  box.innerHTML = `<div class="sr-grid">${display.map(c=>searchRowHtml(c,d)).join('')}</div>`;
  wireResultButtons(display, d, ()=>renderInspireFromCache(cacheKey, d));
  loadTilePrices(display);
}
async function refillInspireCache(cacheKey, d){
  if(!state.inspireRefilling) state.inspireRefilling = {};
  state.inspireRefilling[cacheKey] = true;
  try{
    const clause = inspireClause(d);
    const { results, error } = await searchAndVerifyLegal(clause, 'edhrec', 180);
    if(!error){
      const filtered = results.filter(c=> landOk(c, d) && !isBanned(c) && !deckLeaders(d).some(L=>L.name===c.name));
      state.inspireCache[cacheKey] = filtered;
      if(state.screen==='inspiration' && state.inspireDeckId===d.id && cacheKey===inspireCacheKey(d)){
        renderInspireFromCache(cacheKey, d);
      }
    }
  } finally {
    state.inspireRefilling[cacheKey] = false;
  }
}
