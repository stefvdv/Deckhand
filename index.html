function lifeCardHtml(p, idx, count){
  const rot = state.life.rotate ? seatRotation(idx, count) : 0;
  const open = state.life.expandedIdx === idx;
  const col = PLAYER_COLORS[idx % PLAYER_COLORS.length];
  const players = ensureLifePlayers();
  const focus = state.life.expandedIdx;
  const style = `transform:translate(-50%,-50%) rotate(${rot}deg); background:linear-gradient(160deg, ${col.base}, ${col.dark});`;

  // Damage-entry mode: one player is tallying what they've taken, so every
  // *other* player's card becomes a tappable counter laid over their life total.
  if(focus !== null && !open){
    const fp = players[focus];
    const taken = (fp.dmg && fp.dmg[idx]) || 0;
    return `<div class="life-cell"><div class="life-card-v2" data-idx="${idx}" data-rot="${rot}" style="${style}">
      <div class="life-face front">
        <div class="lval2 ghosted">${p.life}</div>
      </div>
      <div class="dmg-overlay ${taken>=lethalDmg()?'lethal':''}" data-dmgfrom="${idx}">
        <div class="dmg-ov-val">${taken}</div>
      </div>
    </div></div>`;
  }

  if(open){
    return `<div class="life-cell"><div class="life-card-v2 focused" data-idx="${idx}" data-rot="${rot}" style="${style}">
      <div class="life-face sub">
        <div class="sub-scroll">
          <div class="focus-name">${escapeHtml(p.name)}</div>
          <div class="back-h">Poison</div>
          <div class="mini-row"><button class="lbtn sm" data-idx="${idx}" data-field="poison" data-d="-1">−</button><span class="mini-val ${p.poison>=10?'danger':''}">${p.poison}</span><button class="lbtn sm" data-idx="${idx}" data-field="poison" data-d="1">+</button></div>
        </div>
        <button class="submenu-toggle done" data-idx="${idx}">✓ Done</button>
      </div>
    </div></div>`;
  }

  const isTurn = false;
  return `<div class="life-cell"><div class="life-card-v2 ${isTurn?'active-turn':''}" data-idx="${idx}" data-rot="${rot}" style="${style}">
    <div class="life-face front ${p.defeated?'defeated':''}">
      ${p.medal?`<div class="medal-badge" title="High roll winner">${modeGlyph()}</div>`:''}
      <div class="tap-zone left" data-idx="${idx}" data-side="minus"><span class="tap-glyph">−</span></div>
      <div class="tap-zone right" data-idx="${idx}" data-side="plus"><span class="tap-glyph">+</span></div>
      <input class="pname-input" data-idx="${idx}" value="${escapeHtml(p.name)}" size="${Math.max(4, Math.min(14, p.name.length || 8))}">
      <div class="lval-row">
        <span class="ldelta minus ${p._delta<0?'show':''}">${p._delta<0?'−'+Math.abs(p._delta):''}</span>
        <div class="lval2" data-setlife="${idx}" title="Tap to set life">${p.life}</div>
        <span class="ldelta plus ${p._delta>0?'show':''}">${p._delta>0?'+'+p._delta:''}</span>
      </div>
      <button class="submenu-toggle" data-idx="${idx}" title="Poison &amp; Admiral damage">☠ ${p.poison>0?p.poison:''}</button>
      ${p.defeated ? `<div class="defeat-banner"><div class="dtxt">${escapeHtml(p.defeatMsg)}</div><button class="revive-btn" data-idx="${idx}">Revive</button></div>` : ''}
    </div>
  </div></div>`;
}
/* Which corner/edge of each player rectangle gets a square cut out to make
   room for the central turn hub. Depends on where the seat sits relative to
   the middle of the table grid. */
function cellNotchClass(idx, count){
  if(count === 2) return idx === 0 ? 'notch-b' : 'notch-t';
  if(count === 3) return ['notch-br','notch-bl','notch-tr'][idx] || '';
  if(count === 4) return ['notch-br','notch-bl','notch-tr','notch-tl'][idx] || '';
  if(count === 5) return ['','','notch-r','notch-l',''][idx] || '';
  if(count === 6) return ['','','notch-r','notch-l','',''][idx] || '';
  return '';
}
function turnHubHtml(){
  const L = state.life;
  const idle = L.turnIdx === null;
  return `<button class="turn-hub ${idle?'idle':''}" id="turnHub" title="${idle?'Start turn tracking':'Pass the turn'}">
    <span class="th-arrow" id="thArrow" style="transform:rotate(${L.arrowAngle}deg);">➤</span>
    <span class="th-num">${idle ? '—' : L.turnNum}</span>
    <span class="th-lbl">${idle ? 'start' : 'turn'}</span>
  </button>`;
}
function pointTurnArrow(){
  const arrow = document.getElementById('thArrow');
  const hub = document.getElementById('turnHub');
  if(!arrow || !hub) return;
  const L = state.life;
  // While the poison / Admiral-damage menu is open the arrow simply keeps the
  // angle it already had — re-measuring against the overlay layout made it
  // wander with every tap.
  if(L.expandedIdx !== null){ arrow.style.transform = `rotate(${L.arrowAngle}deg)`; return; }
  if(L.turnIdx === null){ L.arrowAngle = -90; arrow.style.transform = 'rotate(-90deg)'; return; }
  const card = document.querySelector(`.life-card-v2[data-idx="${L.turnIdx}"]`);
  const cell = card ? card.closest('.life-cell') : null;
  if(!cell) return;
  const hr = hub.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const dx = (cr.left + cr.width/2) - (hr.left + hr.width/2);
  const dy = (cr.top + cr.height/2) - (hr.top + hr.height/2);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;   // ➤ points right at 0°
  L.arrowAngle = ang;
  arrow.style.transform = `rotate(${ang}deg)`;
}

function layoutLifeCards(){

    if(!card) return;
    const rot = +card.dataset.rot;
    const w = cell.clientWidth, h = cell.clientHeight;
    if(!w || !h) return;
    if(rot===90 || rot===270){ card.style.width = h+'px'; card.style.height = w+'px'; }
    else { card.style.width = w+'px'; card.style.height = h+'px'; }
  });
}

function wireTapHold(el, onTap, onHold, holdMs, repeatMs){
  holdMs = holdMs || 550;
  let timer=null, rep=null, moved=false, startX=0, startY=0, held=false;
  const clear = ()=>{
    if(timer){ clearTimeout(timer); timer=null; }
    if(rep){ clearInterval(rep); rep=null; }
  };
  el.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; moved=false; held=false;
    if(onHold) timer = setTimeout(()=>{
      held=true; onHold();
      if(navigator.vibrate) navigator.vibrate(25);
      // Keep the finger down and the action repeats on an interval — one
      // long press can walk life up or down as far as needed.
      if(repeatMs) rep = setInterval(()=>{ onHold(); if(navigator.vibrate) navigator.vibrate(12); }, repeatMs);
    }, holdMs);
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    const dx = e.touches[0].clientX-startX, dy = e.touches[0].clientY-startY;
    if(Math.abs(dx)>10 || Math.abs(dy)>10){ moved=true; clear(); }
  }, {passive:true});
  el.addEventListener('touchend', ()=>{ clear(); if(!moved && !held) onTap(); });
  el.addEventListener('touchcancel', clear);
  el.addEventListener('contextmenu', e=>e.preventDefault());
}

/* ========================= INIT ========================= */
try{ history.replaceState({screen:'home'}, '', '#home'); }catch(e){}
window.addEventListener('popstate', (e)=>{
  // An open Import / Bulk-edit panel consumes the back press: close it and stay.
  if(state.dlPanel){
    state.dlPanel = null;
    const box = document.getElementById('dlPanelBox');
    if(box){
      const d = getDeck(state.activeDeckId);
      if(d){ box.innerHTML = dlPanelHtml(d); document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active')); }
      try{ history.pushState({screen: state.screen}, '', '#'+state.screen); }catch(err){}
      return;
    }
  }
  // An open dropdown or context menu consumes the back press: close it and
  // stay put, instead of navigating the page underneath it.
  const tileMenu = document.getElementById('tileMenuPop');
  const deckPick = document.getElementById('deckPickScrim');
  if(tileMenu || deckPick || state.openCSelect){
    if(tileMenu) tileMenu.remove();
    if(deckPick) deckPick.remove();
    if(state.openCSelect){ state.openCSelect = null; try{ csRerender(); }catch(err){} }
    try{ history.pushState({screen: state.screen, folder: state.folderNav||null}, '', '#'+state.screen); }catch(err){}
    return;
  }
  if(state.overlayStack.length){
    const top = state.overlayStack.pop();
    try{ top.closeFn(); }catch(err){ console.error(err); }
    return;
  }
  const st = e.state || {};
  state.screen = st.screen || 'home';
  // Restore folder context when stepping back through My Decks folders.
  if(state.screen === 'decks') state.folderNav = st.folder || null;
  state.menuOpen = false;
  render();
});
render();
loadSettings().then(render);
/* iOS pinch-zoom still fires gesture events even with user-scalable=no,
   and the attempted zoom is what was shoving parts of the page offscreen.
   Blocking the gesture (and double-tap zoom) keeps the layout anchored. */
// Register the service worker for offline/app-like behavior — only when
// hosted (service workers don't exist for file:// pages, and the app must
// keep working when shared as a bare file).
if('serviceWorker' in navigator && /^https:/.test(location.protocol)){
  // When a new service worker takes control, reload once so the freshly
  // deployed index.html/JS actually runs — without this, an installed PWA keeps
  // running the old code until a manual full reload.
  let _swReloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(_swReloading) return;
    _swReloading = true;
    location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const promote = w => { if(w) w.postMessage({type:'SKIP_WAITING'}); };
      try{ reg.update(); }catch(e){}
      if(reg.waiting && navigator.serviceWorker.controller) promote(reg.waiting);
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(nw) nw.addEventListener('statechange', ()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller) promote(nw);
        });
      });
      // Catch updates that land while the app is open
      setInterval(()=>{ try{ reg.update(); }catch(e){} }, 60*60*1000);
    }).catch(e=>console.warn('SW registration failed', e));
  });
}
// Ask the browser to protect our storage from automatic eviction, so decks
// aren't silently cleared when the device runs low on space.
// Capture the browser's install prompt so Extras can offer a real install
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); state._installEvt = e; });

if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}

document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('gesturechange', e=>e.preventDefault());
// Two-finger touches are never a gesture this app uses, and any browser
// pinch attempt is what shifts the layout — cancel them outright.
document.addEventListener('touchstart', e=>{ if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', e=>{ if(e.touches.length > 1) e.preventDefault(); }, {passive:false});

/* launch splash: keep it up long enough for the animation, never past readiness+min */
const _splashT0 = Date.now();
function hideSplash(){
  const el = document.getElementById('appSplash');
  if(!el || el.classList.contains('out')) return;
  // Long enough for both sonar pulses to complete before the fade.
  const wait = Math.max(0, 1950 - (Date.now() - _splashT0));
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 500); }, wait);
}
setTimeout(hideSplash, pendingShareToken() ? 9000 : 4000);   // safety: never trap the user behind it

qdbPrune();
loadFormatFile().then(()=>resolveLegalSets()).then(()=>checkForNewSets()).then(()=>{ maybeShowFormatChanges(); classifyUBBans(); });
loadDecksIndex().then(async ()=>{
  if(state.screen==='decks') render();
  // A share link keeps the splash up until the deck page itself is drawn —
  // flashing the home screen first made receivers doubt the link worked.
  if(!pendingShareToken()) hideSplash();
  if(!maybeShowWelcome()) maybeShowChangelog();
  // A share link needs the legal-set list before it can resolve any cards
  if(pendingShareToken()){
    await resolveLegalSets();
    checkShareLink();
  }
});
</script>
