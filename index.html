// EDHREC color-page slugs are always in strict WUBRG order (themes/x/wbr,
// never themes/x/rwb). Our combo keys are in guild/wedge order, so they must
// be re-sorted before building an EDHREC URL or the page 404s.
function wubrgSlug(combo){
  const order = {w:0,u:1,b:2,r:3,g:4};
  return combo.toLowerCase().split('').filter(c=>c in order).sort((a,b)=>order[a]-order[b]).join('');
}
function browseColorClause(){
  const sel = state.browseSel;
  // A specific combo means EXACTLY that color identity — Mardu (rwb) returns
  // three-color Mardu Admirals, not mono/two-color cards that merely fit.
  // (The earlier c= was invalid syntax; id= is exact identity, the right dim.)
  if(sel.combo) return sel.combo==='c' ? 'id=c' : 'id=' + sel.combo;
  const cc = COLOR_COUNTS.find(c=>c.key===sel.count);
  return (cc && cc.clause) || '';

/* Build the combined Scryfall clause for a theme. When aggregating for an
   Admiral-mode gallery we want breadth (any signal counts); for a card-type
   staples search the oracle pattern alone is cleaner. */
function themeQueryClause(themeKey, admiralMode){
  const meta = THEME_META[themeKey] || {};
  const otags = THEME_OTAGS[themeKey] || [];
  const parts = [];
  otags.forEach(t=>parts.push('otag:'+t));
  if(meta.broad){
    // meta.broad is already a parenthesised OR-group of oracle patterns —
    // splice its inner terms in so the whole thing is one big OR.
    const inner = meta.broad.replace(/^\(/,'').replace(/\)$/,'');
    parts.push(inner);
  }
  if(!parts.length) return '';
  return '(' + parts.join(' or ') + ')';
}
function browseQuery(){
  const sel = state.browseSel;
  const parts = [];
  if(browseAdmiralMode()){
    parts.push('t:legendary t:creature');
    const col = browseColorClause();
    if(col) parts.push(col);
  } else {
    const t = TYPE_CHIPS.find(c=>c.key===sel.type);
    if(t && t.clause) parts.push(t.clause);
    // Colors combine with the type: Izzet + Instants = instants that fit an
    // Izzet identity. A color count alone matches that exact number of colors.
    if(sel.combo && sel.combo!=='c') parts.push('id=' + sel.combo);
    else if(sel.combo==='c') parts.push('id=c');
    else if(sel.count){
      const cc = COLOR_COUNTS.find(c=>c.key===sel.count);
      if(cc && cc.clause) parts.push(cc.clause);
    }
  }
  if(sel.theme){
    const th = BROWSE_THEMES.find(c=>c.key===sel.theme);
    if(th) parts.push(browseAdmiralMode() ? (th.broad || th.clause) : th.clause);
  }
  return parts.join(' ').trim();
}
/* Admiral mode = everything except the staples-by-card-type chips. A theme on

/* Landing on the page fires no search at all. A search only starts once the
   user makes a meaningful pick: a specific color combination, a theme, or a
   card-type chip. Choosing only a color *count* (or leaving "Admirals — any
   colors") waits for more. */

/* ---- EDHREC play-data themes for the Inspiration browse page ----
   The catalog comes from /pages/tags.json (cached a week); picking one loads
   that theme's top commanders from its /pages/tags/<slug>.json page, resolved
   through the app's own legality engine and filtered to the chosen colors
   client-side. The built-in Scryfall-clause themes stay as the backbone —
   EDHREC entries extend the list with everything the community actually
   builds (Aikido and friends). */
function edhrecTagCatalogFrom(data){
  // The tags hub's exact shape is undocumented, so walk the whole document
  // and harvest anything that looks like a theme link, wherever it lives.
  const out = [], seen = new Set();
  const push = (label, slug, count)=>{
    label = String(label||'').trim(); slug = String(slug||'').trim().toLowerCase();
    if(!label || !slug || slug==='tags' || seen.has(slug)) return;
    seen.add(slug); out.push({ label, slug, count: count||0 });
  };
  const walk = (node, depth)=>{
    if(!node || depth > 7) return;
    if(Array.isArray(node)){ node.forEach(x=>walk(x, depth+1)); return; }
    if(typeof node !== 'object') return;
    const u = typeof node.url === 'string' ? node.url : '';
    const m = u.match(/^\/tags\/([a-z0-9%+-]+)\/?$/i);
    if(m) push(node.name || node.value || node.label || m[1].replace(/-/g,' '), m[1], node.num_decks || node.count || 0);
    if(typeof node.slug === 'string' && (node.value || node.tag)) push(node.value || node.tag, node.slug, node.count || 0);
    for(const k in node){ if(k !== 'cardviews' || m || true) walk(node[k], depth+1); }
  };
  try{ walk(data, 0); }catch(e){}
  out.sort((a,b)=>(b.count||0)-(a.count||0));
  return out.slice(0, 500);
}
async function ensureEdhrecTags(){
  if(state.edhrecTags && state.edhrecTags.length) return;
  if(state._edtagsAt && (Date.now() - state._edtagsAt) < 60000) return;   // retry at most once a minute
  state._edtagsAt = Date.now();
  try{
    const raw = localStorage.getItem('admiral_app:edhrecTags2');
    if(raw){
      const j = JSON.parse(raw);
      if(j && Array.isArray(j.v) && j.v.length && (Date.now() - (j.t||0)) < 7*24*3600*1000){
        state.edhrecTags = j.v; return;
      }
    }
  }catch(e){}
  const data = await edhrecFetchJson('/pages/tags.json');
  const tags = edhrecTagCatalogFrom(data);
  if(tags.length){
    state.edhrecTags = tags;
    try{ localStorage.setItem('admiral_app:edhrecTags2', JSON.stringify({ t: Date.now(), v: tags })); }catch(e){}
    if(state.screen==='browse') render();
  }
}
const COLOR_TAG_NAMES = new Set(['azorius','dimir','rakdos','gruul','selesnya','orzhov','izzet','golgari','boros','simic',
  'bant','esper','grixis','jund','naya','abzan','jeskai','sultai','mardu','temur',
  'yore-tiller','glint-eye','dune-brood','ink-treader','witch-maw','five-color','five color','wubrg','colorless']);
function isColorComboTag(t){
  const l = String(t.label||'').toLowerCase().trim();
  const sl = String(t.slug||'').toLowerCase();
  if(COLOR_TAG_NAMES.has(l) || COLOR_TAG_NAMES.has(sl)) return true;
  return /^(mono[- ]|sans[- ]|four[- ]color)/.test(l) || /^(mono-|sans-|four-color)/.test(sl);
}
function edhrecComboCounts(){
  const map = {};
  (state.edhrecTags||[]).forEach(t=>{
    if(isColorComboTag(t)) map[String(t.slug||t.label).toLowerCase()] = t.count || 0;
  });
  return map;
}
function sortCombosByPlay(list){
  // EDHREC's colour-combination tags carry deck counts — use them to order
  // the colour dropdown by what people actually play. Falls back to the
  // built-in order until the catalog has loaded.
  const cc = edhrecComboCounts();
  if(!Object.keys(cc).length) return list;
  const countFor = (c)=>{
    const l = String(c.label||'').toLowerCase();
    return cc[l] ?? cc['mono-'+l] ?? 0;
  };
  return list.slice().sort((a,b)=>countFor(b)-countFor(a));
}
function browseThemeOptions(){
  const ed = state.edhrecTags || [];
  if(ed.length){
    // Play data drives both modes now: the community catalog IS the theme
    // list, alphabetical. (Kindred lives in its own dropdown.) Admiral mode
    // filters everything through its own legality afterwards.
    const ks = kindredNameSet();
    return ed.filter(t=>!ks.has(String(t.label||'').toLowerCase()) && !isColorComboTag(t))
             .sort((a,b)=>a.label.localeCompare(b.label)).map(t=>({ v: 'ed:'+t.slug, l: t.label }));
  }
  return BROWSE_THEMES.map(c=>({v:c.key, l:c.label}));
}
function mergeEdhrecTags(list){
  // Commander pages carry themes the hub's top-list omits (Aikido and other
  // niche builds) — fold every theme we meet into the stored catalog so the
  // dropdown keeps growing with use.
  if(!Array.isArray(list) || !list.length) return;
  const cur = state.edhrecTags || [];
  const have = new Set(cur.map(t=>t.slug));
  let grew = false;
  list.forEach(t=>{
    if(t && t.slug && !have.has(t.slug)){ cur.push({ label: t.label, slug: t.slug, count: t.count||0 }); have.add(t.slug); grew = true; }
  });
  if(grew){
    state.edhrecTags = cur;
    try{ localStorage.setItem('admiral_app:edhrecTags2', JSON.stringify({ t: Date.now(), v: cur })); }catch(e){}
  }
}
const KINDRED_PLURAL_IRREGULAR = { Elf:'Elves', Wolf:'Wolves', Werewolf:'Werewolves', Dwarf:'Dwarves', Mouse:'Mice', Fox:'Foxes', Sphinx:'Sphinxes', Phoenix:'Phoenixes', Ox:'Oxen', Octopus:'Octopuses' };

function edhrecCommanderNamesFrom(data){
  const lists = (((data||{}).container||{}).json_dict||{}).cardlists || [];
  const cmd = lists.filter(L=>/commander/i.test(L.header||''));
  const use = cmd.length ? cmd : lists;
  const seen = new Set(), out = [];
  for(const L of use){
    for(const cv of (L.cardviews||[])){
      if(cv && cv.name && !seen.has(cv.name)){ seen.add(cv.name); out.push(cv.name); }
    }
  }
  return out;
}

/* Typal gets its own two-step view: first a gallery of creature types (each
   shown as its most-played legal Admiral, labeled with the type), then —
   after tapping one — the most-played Admirals of that type. */
async function loadTypal(box, key){
  const sel = state.browseSel;
  const colClause = browseColorClause() || '';
  if(state.browseTypal){
    const tribe = state.browseTypal;
    const q = `t:legendary t:creature t:${tribe.toLowerCase()} ${colClause}`.trim();
    const { results, error } = await searchAndVerifyLegal(q, 'edhrec', 200);

    const live = document.getElementById('browseResults');
    if(!live) return;
    if(error){ live.innerHTML = `<div class="error-note">Couldn't reach Scryfall. Check your connection and try again.</div>`; return; }

    document.getElementById('typalBack').addEventListener('click', ()=>{ state.browseTypal = null; render(); });
    if(pool.length){
      pagedGrid(live, pool, (c)=>searchRowHtml(c, pinned, {showAdmiralBtn:true}),
        (chunk)=>{ wireResultButtons(pool, pinned, ()=>loadTypal(box, key), {onCardTap:(c)=>openAdmiralReco(c)}); loadTilePrices(chunk); });
    }
    return;
  }
  // Gallery view: bucket the top legendaries by creature type
  const idxKey = 'typal-index|' + colClause + '|' + ubSelectionSig();
  state._typalIndex = state._typalIndex || {};
  let items = state._typalIndex[idxKey];
  if(!items){
    const { results, error } = await searchAndVerifyLegal(`t:legendary t:creature ${colClause}`.trim(), 'edhrec', 600);

    if(error){ live0.innerHTML = `<div class="error-note">Couldn't reach Scryfall. Check your connection and try again.</div>`; return; }

      const rep = pool.find(c=>{

      });
      if(rep) items.push({tribe, card: rep});

    state._typalIndex[idxKey] = items;

  if(!live || state.browseSel.theme!=='typal' || state.browseTypal) return;

async function loadBrowse(){
  const box = document.getElementById('browseResults');
  if(!box) return;
  if(!browseReady()){
    box.innerHTML = `<div class="empty-note">Pick colors or a theme above — results appear here.</div>`;
    return;
  }
  const key = JSON.stringify(state.browseSel);
  if(isCmdrMode() && browseAdmiralMode() && state.browseSel.combo) loadLeaderPairs(key, state.browseSel.combo, (!state.browseSel.tribe && state.browseSel.theme && state.browseSel.theme.indexOf('ed:')!==0) ? state.browseSel.theme : '');
  if(state.browseCache[key]){ renderBrowseResults(key); return; }
  box.innerHTML = `<div class="status"><div class="spinner"></div>${isCmdrMode()?'Consulting the commander registry…':'Consulting the fleet registry…'}</div>`;
  const admiralMode = browseAdmiralMode();
  const sel = state.browseSel;
  if(admiralMode && sel.theme==='typal'){ await loadTypal(box, key); return; }
  if(admiralMode && sel.tribe){ await loadEdhrecTypalBrowse(box, key, sel.tribe); return; }
  if(admiralMode && sel.theme && sel.theme.indexOf('ed:')===0){ await loadEdhrecThemeBrowse(box, key, sel.theme.slice(3)); return; }
  // Scryfall-native engine. Every theme maps to a bundle of Scryfall queries
  // (community function tags + oracle patterns); results sort by Scryfall's
  // popularity rank so recognisable Admirals lead. No external data source.
  let filtered = null;
  const themeClause = sel.theme ? themeQueryClause(sel.theme, admiralMode) : '';
  const base = admiralMode ? 't:legendary t:creature' : (function(){
    const t = TYPE_CHIPS.find(c=>c.key===sel.type); return (t&&t.clause)||'';
  })();
  const colClause = browseColorClause();
  const fullClause = [base, colClause, themeClause].filter(Boolean).join(' ');

  // ---- BLEND, fully parallel ----
  // The tag/text query and the curated-staples resolution launch TOGETHER, so
  // total wait ≈ the slower of the two, not their sum. Curated staples are
  // also cached per theme for the session — a colour change re-filters them
  // locally with zero requests.
  const curatedPromise = (admiralMode && sel.theme) ? (async ()=>{
    const names = CURATED_THEME_COMMANDERS[sel.theme] || [];
    if(!names.length) return [];
    state._curatedCache = state._curatedCache || {};
    if(!state._curatedCache[sel.theme]){
      const ck = 'curated|' + sel.theme;
      state._curatedCache[sel.theme] = (async ()=>{
        const disk = await qdbGet(ck);
        if(disk && (Date.now() - (disk.t||0)) < QCACHE_TTL && Array.isArray(disk.v)) return disk.v;
        const cards = (await namesToLegalCards(names)).filter(c=>
          isLegendary(c) && hasPowerToughness(c) && isNonlandFront(c));
        if(cards.length) qdbSet(ck, cards);
        return cards;
      })();
    }
    return (await state._curatedCache[sel.theme]).filter(c=>!isBanned(c));
  })() : Promise.resolve([]);

  const [{ results, error }, curatedAll] = await Promise.all([
    searchAndVerifyLegal(fullClause, 'edhrec', 300),
    curatedPromise.catch(()=>[])
  ]);
  if(key !== JSON.stringify(state.browseSel)) return;   // selection changed mid-flight
  let list = (results||[]).filter(c=> landOk(c) && !isBanned(c));
  if(admiralMode) list = list.filter(c=> isLegendary(c) && hasPowerToughness(c));

  const inColor = (curatedAll||[]).filter(colorSelectionAllows);
  if(inColor.length){
    const seen = new Set(inColor.map(c=>c.name));
    list = inColor.concat(list.filter(c=>!seen.has(c.name)));
  }

  if(error && !list.length){
    const l=document.getElementById('browseResults');
    if(l) l.innerHTML = `<div class="error-note">Couldn't reach Scryfall. Check your connection and try again.</div>`;
    return;
  }
  filtered = list;
  filtered._complete = true;
  if(key !== JSON.stringify(state.browseSel)) return;
  state.browseCache[key] = filtered;
  renderBrowseResults(key);
}
/* Does the current color picker admit this card? Mirrors the query's color
   clause so curated seeds are held to the same standard. */
function colorSelectionAllows(card){
  const sel = state.browseSel;
  if(sel.combo) return colorIdentityExact(card, sel.combo);
  if(sel.count){
    const n = (card.color_identity||[]).length;
    if(sel.count==='45') return n>=4;
    return n === parseInt(sel.count,10);
  }
  return true;   // any colors
}
function renderBrowseResults(key){
  const box = document.getElementById('browseResults');
  if(!box) return;
  const pool = state.browseCache[key] || [];   // live array — background waves keep growing it
  // Two-commander pairs render BELOW the single-commander results: a color
  // combination's page ends with every pairing that totals those colors.
  const appendPairs = ()=>{
    const html = leaderPairsSectionHtml(key);
    if(!html) return;
    const sec = document.createElement('div');
    sec.id = 'pairSection';
    sec.innerHTML = html;
    box.appendChild(sec);
    wirePairTiles(key);
  };
  if(!pool.length){
    box.innerHTML = `<div class="empty-note">No ${browseAdmiralMode()?'single '+(isCmdrMode()?'Commanders':'Admirals'):'cards'} found for this combination — try loosening the theme or colors.</div>`;
    appendPairs();
    return;
  }
  const pinned = state.searchPinnedDeckId ? getDeck(state.searchPinnedDeckId) : null;
  const boundary = -1;
  const note = (browseAdmiralMode() && state.browseSel.theme)
    ? `<p class="hint" style="margin:8px 0 0;">Admirals for this theme, most-played first.</p>`
    : '';
  box.innerHTML = note;
  const admiralMode = browseAdmiralMode();
  const wireOpts = admiralMode ? {onCardTap:(c)=>openAdmiralReco(c)} : undefined;
  const after = (chunk)=>{ wireResultButtons(pool, pinned, ()=>renderBrowseResults(key), wireOpts); loadTilePrices(chunk); };
  const streaming = !pool._complete;
  if(boundary > 0 && boundary < pool.length){
    // Two independently-paged tiers: play data first, text matches below
    pagedGrid(box, pool.slice(0, boundary), (c)=>searchRowHtml(c, pinned, {showAdmiralBtn:true}), after);
    box.insertAdjacentHTML('beforeend', `<div class="chip-label" style="margin-top:16px;">More Admirals matching this theme</div>`);
    const t2box = document.createElement('div');
    box.appendChild(t2box);
    pagedGrid(t2box, pool.slice(boundary), (c)=>searchRowHtml(c, pinned, {showAdmiralBtn:true}), after);
  } else {
    pagedGrid(box, pool, (c)=>searchRowHtml(c, pinned, {showAdmiralBtn:true}), after, {stream: streaming});
  }
  appendPairs();
}

/* ---- Two-commander pairings for a chosen color combination ---- */
function pairsCacheKey(key){ return key + '::pairs'; }
async function loadLeaderPairs(key, combo, theme){
  const pk = pairsCacheKey(key);
  if(state.browseCache[pk] !== undefined) return;
  state.browseCache[pk] = null;   // null = loading
  const colClause = combo === 'c' ? 'id=c' : ('id<=' + combo);
  let results = [];
  try{
    const themeClause = theme ? themeQueryClause(theme, true) : '';
    const r = await searchAndVerifyLegal(['t:legendary', colClause, ANY_PAIR_CLAUSE, themeClause].filter(Boolean).join(' '), 'edhrec', 350);
    results = r.results || [];
  }catch(e){}
  const cands = results.filter(c=> isNonlandFront(c) && isLegendary(c)
    && !(c.legalities && (c.legalities.commander==='banned' || c.legalities.commander==='not_legal'))
    && pairAbility(c));
  state.browseCache[pk] = computeLeaderPairs(cands, combo);
  if(key === JSON.stringify(state.browseSel) && state.browseCache[key]) renderBrowseResults(key);
}
function computeLeaderPairs(cands, combo){
  const want = combo === 'c' ? '' : combo.toUpperCase().split('').sort().join('');
  cands = cands.slice().sort((a,b)=>(a.edhrec_rank||99999)-(b.edhrec_rank||99999));
  const abil = new Map(cands.map(c=>[c.id||c.name, pairAbility(c)]));
  const pairs = [];
  for(let i=0;i<cands.length && pairs.length<120;i++){
    for(let j=i+1;j<cands.length && pairs.length<120;j++){
      const a=cands[i], b=cands[j];
      if(!abil.get(a.id||a.name) || !abil.get(b.id||b.name)) continue;
      if(!canPair(a,b)) continue;
      const u = Array.from(new Set([].concat(a.color_identity||[], b.color_identity||[]))).sort().join('');
      if(u !== want) continue;
      pairs.push(orderPair(a,b));
    }
  }
  return pairs;
}
/* First seat goes to the "chooser" of the pairing (Doctor, Choose-a-Background
   card); the enabler (companion, Background) sits second. */
function orderPair(a,b){
  const ka=(pairAbility(a)||{}).kind;
  if(ka==='background' || ka==='companion') return [b,a];
  return [a,b];
}
function leaderPairsSectionHtml(key){
  if(!(isCmdrMode() && browseAdmiralMode() && state.browseSel.combo)) return '';
  const pairs = state.browseCache[pairsCacheKey(key)];
  if(pairs === null || pairs === undefined) return `<div class="status" style="margin:12px 0 10px;"><div class="spinner"></div>Assembling two-commander pairs…</div>`;
  if(!pairs.length) return '';
  const shown = pairs.slice(0, 60);
  return `<div class="chip-label" style="margin-top:16px;">Two-commander pairs — ${pairs.length}${pairs.length>shown.length?` (showing ${shown.length})`:''}</div>
    <p class="hint" style="margin:2px 0 8px;">Pairings whose combined color identity totals exactly this combination. Tap either card for its details, or start a deck with both in command.</p>
    <div class="pair-grid">${shown.map((pr,i)=>`
      <div class="pair-cell">
        <div class="pair-imgs">
          <img loading="lazy" class="${wbClass(pr[0])}" src="${cardImageMed(pr[0])}" data-pcard="${i}:0" alt="${escapeHtml(pr[0].name)}">
          <img loading="lazy" class="${wbClass(pr[1])}" src="${cardImageMed(pr[1])}" data-pcard="${i}:1" alt="${escapeHtml(pr[1].name)}">
        </div>
        <div class="pair-cap">${escapeHtml(pr[0].name.split(',')[0])} &amp; ${escapeHtml(pr[1].name.split(',')[0])}</div>
        <button class="ghost-btn pair-use" data-pairuse="${i}">${modeGlyph()} Start a deck</button>
      </div>`).join('')}</div>`;
}
function wirePairTiles(key){
  const pairs = state.browseCache[pairsCacheKey(key)] || [];
  // Each card opens its normal detailed view (price, Oracle text, rulings).
  document.querySelectorAll('.pair-imgs img[data-pcard]').forEach(img=>img.addEventListener('click', ()=>{
    const [i,j] = img.dataset.pcard.split(':').map(Number);
    const c = pairs[i] && pairs[i][j];

function startPairDeck(a, b){
  const nm = a.name.split(',')[0] + ' & ' + b.name.split(',')[0];
  createNewDeck(nm);
  const d = getDeck(state.activeDeckId);
  if(!d) return;
  d.admiral = a; d.partner = b;
  logDeckChange(d, {type:'admiral', name:a.name, card:a, prev:null});
  persistDeck(d);
  toast(`${a.name} and ${b.name} take joint command.`);
  render();
}

/* ================= NAME RESOLUTION =================
   The Inspiration engine is fully Scryfall-native — no external data source,
   nothing that can be rate-limited or blocked. Curated staple commanders are
   resolved to Admiral-legal cards here and blended ahead of the broad
   tag-matched pool.

   Batches stay small: each query also carries the ~65-set legality clause, and
   long card names in big batches can exceed Scryfall's URL length limit. If a
   batch still errors, it splits in half and retries, so one bad batch can
   never silently zero out the results. */
async function resolveNameChunk(chunk){
  if(!chunk.length) return [];
  const clause = '(' + chunk.map(exactNameClause).join(' or ') + ')';
  const { results, error } = await searchAndVerifyLegal(clause, 'edhrec', 100).catch(()=>({results:[], error:true}));
  if(!error || chunk.length <= 2) return results || [];
  const mid = Math.ceil(chunk.length/2);
  const halves = await Promise.all([resolveNameChunk(chunk.slice(0,mid)), resolveNameChunk(chunk.slice(mid))]);
  return halves.flat();
}
async function namesToLegalCards(names){
  const chunks = chunkArr(names.slice(0, 600), 10);
  const settled = await Promise.all(chunks.map(resolveNameChunk));
  const byName = new Map();
  settled.flat().forEach(c=>{ if(!byName.has(c.name)) byName.set(c.name, c); });
  return names.map(n=>byName.get(n)).filter(Boolean);
}
function colorIdentityWithin(card, combo){
  if(combo==='c') return (card.color_identity||[]).length===0;
  const want = new Set(combo.toLowerCase().split(''));
  return (card.color_identity||[]).every(c=>want.has(c.toLowerCase()));
}
function colorIdentityExact(card, combo){
  if(combo==='c') return (card.color_identity||[]).length===0;
  const want = combo.toLowerCase().split('').sort().join('');
  const have = (card.color_identity||[]).map(c=>c.toLowerCase()).sort().join('');
  return want===have;
}
function cardColorsExact(card, combo){
  const cols = (card.color_identity||[]).map(c=>c.toLowerCase()).sort().join('');
  const want = combo==='c' ? '' : combo.split('').sort().join('');
  return cols === want;
}

/* ---------------- CARD SYNERGY ("played with") ----------------
   The ✦ button on any card opens an EDHREC-style view: the card on top, and
   below it the most-played legal cards that share its themes and fit its
   colors. Themes are detected from the card's own text against our theme
   catalog (lifegain, tutors-adjacent draw, protection, and so on), then
   Scryfall ranks the matches by EDHREC play data. */
function themeMatchesCard(theme, card){
  const faces = card.card_faces && card.card_faces.length ? card.card_faces : [card];
  const text = faces.map(f=>((f.oracle_text||'')+' '+(f.type_line||''))).join(' ').toLowerCase();
  const kwSet = new Set((card.keywords||[]).map(k=>k.toLowerCase()));
  const quoted = Array.from(theme.clause.matchAll(/o:"([^"]+)"/g)).map(m=>m[1].toLowerCase().replace(/\'/g,"'"));
  const kws = Array.from(theme.clause.matchAll(/kw:(\w+)/g)).map(m=>m[1].toLowerCase());
  const types = Array.from(theme.clause.matchAll(/t:(\w+)/g)).map(m=>m[1].toLowerCase());
  return quoted.some(q=>text.includes(q)) || kws.some(k=>kwSet.has(k) || text.includes(k)) || types.some(t=>text.includes(t));
}
function detectCardThemes(card){
  return BROWSE_THEMES.filter(t=>themeMatchesCard(t, card)).slice(0, 4);
}
function openCardReco(card, forDeck){
  let el = document.getElementById('cardRecoOverlay');
  if(!el){ el = document.createElement('div'); el.className='overlay'; el.id='cardRecoOverlay'; document.body.appendChild(el); }
  pushOverlay('cardReco', ()=>{ document.getElementById('cardRecoOverlay')?.remove(); });
  const themes = detectCardThemes(card);
  const scope = forDeck && forDeck.admiral
    ? `within ${forDeck.admiral.name}'s colors`
    : 'any colors';
  el.innerHTML = `<div class="overlay-inner">
    <div class="topbar" style="position:relative;">
      <button class="icon-btn" id="crBack">${ICONS.back}</button>
      <div class="tb-titles"><div class="t1">Played with ${escapeHtml(card.name)}</div><div class="t2">${themes.length?themes.map(t=>escapeHtml(t.label)).join(' · ')+' · ':''}${escapeHtml(scope)}</div></div>
    </div>
    <main>
      <div class="reco-admiral">
        <img class="${wbClass(card)}" src="${cardImageLarge(card)}" id="crImg" alt="${escapeHtml(card.name)}">
        <div class="ra-nm">${escapeHtml(card.name)}</div>
        <div class="ra-sub">${escapeHtml(frontFace(card).type_line||'')}</div>
      </div>
      <div id="crBody"><div class="status"><div class="spinner"></div>${isCmdrMode()?'Consulting the commander registry…':'Consulting the fleet registry…'}</div></div>
    </main>
  </div>`;
  document.getElementById('crBack').addEventListener('click', closeTopOverlay);
  document.getElementById('crImg').addEventListener('click', ()=>showPreview(cardImageLarge(card), card.border_color==='white'));
  loadCardReco(card, themes, forDeck || null);
}
async function loadCardReco(card, themes, forDeck){
  // Synergy from Scryfall: we read the card's OWN function tags (what it does)
  // and find other cards that share those roles/themes, ranked by EDHREC
  // popularity via order:edhrec. The chosen deck sets the colour ceiling.
  const idClause = (forDeck && forDeck.admiral) ? idClauseForDeck(forDeck) : '';
  // 1) detect this card's function tags
  const tagMap = await detectOtagsForCards([card]);
  const cardTags = (tagMap[card.name] || []);
  const themeParts = (themes && themes.length) ? themes.map(t=>t.clause) : [];
  // 2) build a synergy clause: shares a tag OR shares a theme pattern
  const signalParts = cardTags.map(t=>'otag:'+t).concat(themeParts);
  let pool = [];
  if(signalParts.length){
    const clause = ['(' + signalParts.join(' or ') + ')', idClause].filter(Boolean).join(' ');
    const { results } = await searchAndVerifyLegal(clause, 'edhrec', 200);
    pool = (results||[]).filter(c=> landOk(c) && !isBanned(c) && c.name !== card.name);
  }
  // 3) fallback: colour-matched format staples by popularity
  if(pool.length < 6){
    const { results, error } = await searchAndVerifyLegal(idClause, 'edhrec', 200);
    const errBox = document.getElementById('crBody');
    if(!errBox) return;
    if(error && !pool.length){ errBox.innerHTML = `<div class="error-note">Couldn't reach Scryfall. Check your connection and try again.</div>`; return; }
    const seen = new Set(pool.map(c=>c.name));
    (results||[]).filter(c=> landOk(c) && !isBanned(c) && c.name !== card.name && !seen.has(c.name)).forEach(c=>pool.push(c));
  }
  pool = pool.slice(0, 150);
  const box = document.getElementById('crBody');
  if(!box) return;   // overlay closed meanwhile
  if(!pool.length){ box.innerHTML = `<div class="empty-note">No recommendations found for this card.</div>`; return; }
  const roleTxt = cardTags.length ? ` — sharing its role${cardTags.length>1?'s':''} (${cardTags.slice(0,3).map(escapeHtml).join(', ')})` : '';
  box.innerHTML = `<p class="hint" style="margin:0 0 4px;text-align:center;">Cards that play well with ${escapeHtml(card.name)}${roleTxt}, most-played first.</p>`;
  pagedGrid(box, pool, (c)=>searchRowHtml(c, forDeck, {showAdmiralBtn:true}),
    (chunk)=>{ wireResultButtons(pool, forDeck, ()=>loadCardReco(card, themes, forDeck)); loadTilePrices(chunk); });
}

/* ---------------- BUDGET ALTERNATIVES ----------------
   Finds the deck's 10 priciest cards, then for each one suggests 2 cheap
   cards in a similar role (same primary type + shared detected themes,
   within the Admiral's colors, and under a budget ceiling scaled to the
   expensive card). Layout: pricey card centered, its two budget stand-ins
   in a 2-column row beneath, then the next trio. */
function primaryTypeOf(card){
  const tl = (frontFace(card).type_line||'');
  for(const t of ['Planeswalker','Creature','Instant','Sorcery','Enchantment','Artifact','Battle']){
    if(tl.includes(t)) return t.toLowerCase();
  }
  return '';
}
async function openBudgetOverlay(d){
  let el = document.getElementById('budgetOverlay');
  if(!el){ el = document.createElement('div'); el.className='overlay'; el.id='budgetOverlay'; document.body.appendChild(el); }
  pushOverlay('budget', ()=>{ document.getElementById('budgetOverlay')?.remove(); });
  el.innerHTML = `<div class="overlay-inner">
    <div class="topbar" style="position:relative;">
      <button class="icon-btn" id="bgBack">${ICONS.back}</button>
      <div class="tb-titles"><div class="t1">Budget Alternatives</div><div class="t2">${escapeHtml(d.name)}</div></div>
    </div>
    <main><div id="bgBody"><div class="status"><div class="spinner"></div>Weighing the treasure chest…</div></div></main>
  </div>`;
  document.getElementById('bgBack').addEventListener('click', closeTopOverlay);
  loadBudgetAlternatives(d);
}
/* Oracle tags (Scryfall Tagger) we probe for. One batched query per tag
   identifies which of the deck's pricey cards carry it — then budget picks
   must share those very tags (removal begets removal). */
const BUDGET_OTAGS = ['removal','boardwipe','counterspell','ramp','tutor','burn','lifegain','mill','discard','draw','reanimate','protection','token-generator','sacrifice-outlet','graveyard-hate'];
async function detectOtagsForCards(cards){
  const byName = {}; cards.forEach(c=>{ byName[c.name] = []; });
  // Chunked so the query URL stays well inside Scryfall's length limit even
  // when a deck has many pricey cards.
  const groups = chunkArr(cards, 10);
  for(const group of groups){
    const nameClause = '(' + group.map(c=>exactNameClause(c.name)).join(' or ') + ')';
    await runLimited(BUDGET_OTAGS, async (tag)=>{
      try{
        const res = await sfFetch(`${SF_BASE}/cards/search?unique=cards&q=${encodeURIComponent(nameClause + ' otag:' + tag)}`);
        if(!res.ok) return;   // 404 = none of them carry this tag
        const data = await res.json();
        (data.data||[]).forEach(hit=>{ if(byName[hit.name]) byName[hit.name].push(tag); });
      }catch(e){}
    }, 4);
  }
  return byName;
}
async function loadBudgetAlternatives(d){
  const all = deckLeaders(d).concat(d.cards||[]);
  if(!all.length){ const b=document.getElementById('bgBody'); if(b) b.innerHTML=`<div class="empty-note">No cards in this deck yet.</div>`; return; }
  await runLimited(all.filter(c=>{
    const hit = state.priceCache[c.name];
    return !(hit && Date.now()-hit.t < PRICE_TTL);
  }), async (c)=>{ await cheapestEur(c); }, 3);
  // Every card at €5 or more, however many that is
  const BUDGET_FLOOR = 5;
  const priced = all
    .map(c=>({ c, v: (state.priceCache[c.name] && typeof state.priceCache[c.name].v==='number') ? state.priceCache[c.name].v : 0 }))
    .filter(x=>x.v >= BUDGET_FLOOR)
    .sort((a,b)=>b.v-a.v);
  const box = document.getElementById('bgBody');
  if(!box) return;
  if(!priced.length){ box.innerHTML = `<div class="empty-note">No cards at €5 or more in this deck — ${isCmdrMode()?'it\'s already built thrifty.':'this crew is already sailing cheap. ⚓'}</div>`; return; }
  box.innerHTML = `<p class="hint" style="text-align:center;margin:0 0 8px;">${priced.length} card${priced.length>1?'s':''} at €5 or more, each with two thriftier stand-ins for the same job. Tap + to swap one in.</p>`;
  // Build ONE shared candidate pool up front — EDHREC's dedicated budget page
  // for this commander (real play data) plus the most-played cheap cards in
  // identity, fetched in parallel — then match every pricey card against it
  // LOCALLY. The old engine ran a hundred-plus serial searches and looked
  // frozen; this one paints in seconds.
  box.insertAdjacentHTML('beforeend', `<div class="status" id="bgPoolStatus"><div class="spinner"></div>Gathering thrifty candidates…</div>`);
  const idClause = d.admiral ? idClauseForDeck(d) : '';
  const inDeck = new Set(all.map(c=>c.name));
  const priceOf = (x)=>{
    const hit = state.priceCache[x.name];
    if(hit && typeof hit.v==='number') return hit.v;
    const raw = x.prices && x.prices.eur; const e = raw ? parseFloat(raw) : NaN;
    return isNaN(e) ? null : e;
  };
  let pool = [];
  try{
    const lead = deckLeaders(d)[0];
    const budgetNamesP = (isCmdrMode() && lead)
      ? edhrecFetchJson('/pages/commanders/' + edhrecSlug(lead.name) + '/budget.json').then(j=> j ? edhrecNamesFrom(j).slice(0, 80) : []).catch(()=>[])
      : Promise.resolve([]);
    const staplesP = searchAndVerifyLegal((idClause + ' eur<=5').trim(), 'edhrec', 250).catch(()=>({results:[]}));
    const [bn, st] = await Promise.all([budgetNamesP, staplesP]);
    let bCards = [];
    if(bn.length){
      bCards = await resolveEdhrecNames(bn, (x)=> isNonlandFront(x) && !isBanned(x));
    }
    const seen = new Set();
    bCards.concat((st && st.results) || []).forEach(x=>{
      if(seen.has(x.name)) return; seen.add(x.name);
      if(!isNonlandFront(x) || isBanned(x) || inDeck.has(x.name)) return;
      pool.push(x);
    });
  }catch(e){}
  document.getElementById('bgPoolStatus')?.remove();
  if(!document.getElementById('bgBody')) return;
  if(!pool.length){
    box.insertAdjacentHTML('beforeend', `<div class="empty-note">Couldn't gather budget candidates — check your connection and reopen this page.</div>`);
    return;
  }
  const fp = new Map();
  const themesOf = (x)=>{ if(!fp.has(x.name)) fp.set(x.name, new Set(detectCardThemes(x).map(t=>t.key))); return fp.get(x.name); };
  for(const {c, v} of priced){
    if(!document.getElementById('bgBody')) return;   // overlay closed
    const trio = document.createElement('div');
    trio.className = 'budget-trio';
    const myThemes = detectCardThemes(c);
    trio.innerHTML = `
      <div class="budget-star">
        <img class="${wbClass(c)}" src="${cardImageMed(c)}" alt="${escapeHtml(c.name)}">
        <div class="bs-nm">${escapeHtml(c.name)}</div>
        <div class="bs-pr">${fmtEur(v)}${myThemes.length?` · ${myThemes.map(t=>escapeHtml(t.label)).join(', ')}`:''}</div>
      </div>
      <div class="sr-grid budget-subs"></div>`;
    box.appendChild(trio);
    trio.querySelector('.budget-star img').addEventListener('click', ()=>openCardInfo(c));
    const ptype = primaryTypeOf(c);
    const ceiling = Math.max(1.5, Math.min(5, v * 0.35));
    const mine = new Set(myThemes.map(t=>t.key));
    const scored = [];
    for(let i=0; i<pool.length; i++){
      const x = pool[i];
      if(inDeck.has(x.name)) continue;
      const pv = priceOf(x);
      if(pv===null || pv > ceiling) continue;
      let sc = 0;
      if(primaryTypeOf(x)===ptype) sc += 3;                       // same job shape
      const tx = themesOf(x);
      let shared = 0; mine.forEach(k=>{ if(tx.has(k)) shared++; });
      sc += Math.min(3, shared * 1.5);                            // shared themes
      sc += Math.max(0, 2 - Math.abs((x.cmc||0)-(c.cmc||0))) * 0.5;  // similar cost
      sc -= i * 0.004;                                            // earlier in pool = more played
      scored.push([sc, x]);
    }
    scored.sort((a,b)=>b[0]-a[0]);
    const subs = scored.slice(0, 2).map(sx=>sx[1]);
    const subsBox = trio.querySelector('.budget-subs');
    if(!subsBox || !subsBox.isConnected) return;
    if(!subs.length){ subsBox.innerHTML = `<div class="empty-note" style="grid-column:1/-1;padding:6px 0;">No cheap stand-ins found for this one.</div>`; continue; }
    subs.forEach(x=>inDeck.add(x.name));   // don't recommend the same card twice
    subsBox.innerHTML = subs.map(x=>searchRowHtml(x, d, {showAdmiralBtn:false})).join('');
    wireResultButtons(subs, d, ()=>{}, undefined);
    loadTilePrices(subs);
  }
}

/* EDHREC integration: the cards ACTUALLY most played with this exact leader,
   in true play-rate order. Names are resolved through searchAndVerifyLegal so
   every format rule (Admiral set pool, bans, no-lands / Commander legality)
   still applies. Falls back to the local synergy engine when EDHREC has no
   page for a leader or can't be reached. */
function edhrecSlug(name){
  return String(name).split('//')[0].trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/['\u2019]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
async function edhrecFetchJson(path){
  // Same-origin first: on the deployed site, Netlify's _redirects proxy
  // fetches EDHREC server-side, so the browser's CORS wall never applies.
  const urls = ['/edhrec' + path, 'https://json.edhrec.com' + path];
  for(const u of urls){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 6000);
    try{
      const res = await fetch(u, { signal: ctrl.signal });
      if(res.ok){ const data = await res.json(); if(data) return data; }
    }catch(e){}
    finally{ clearTimeout(timer); }
  }
  return null;
}
function edhrecNamesFrom(data){
  const lists = (((data||{}).container||{}).json_dict||{}).cardlists || [];
  const seen = new Set(), out = [];
  for(const L of lists){
    for(const cv of (L.cardviews||[])){
      if(cv && cv.name && !seen.has(cv.name)){ seen.add(cv.name); out.push(cv.name); }
    }
  }
  return out;
}
function edhrecThemesFrom(data){
  // The leader's page carries its own community theme list (Aikido, Storm,
  // Spellslinger, …). Shapes vary a little between pages, so read both known
  // homes for it and normalise to {label, slug, count}.
  try{
    const dict = (((data||{}).container||{}).json_dict||{});
    const tl = ((data||{}).panels||{}).taglinks || (dict.panels||{}).taglinks || [];
    let out = [];
    if(Array.isArray(tl) && tl.length){
      out = tl.map(t=>({ label: t.value || t.tag || '', slug: t.slug || edhrecSlug(t.value || t.tag || ''), count: t.count || 0 })).filter(t=>t.label);
    } else {
      const tc = dict.tag_counts || (data||{}).tag_counts || {};
      out = Object.keys(tc).map(k=>({ label: k, slug: edhrecSlug(k), count: tc[k] || 0 }));
    }
    out.sort((a,b)=>(b.count||0)-(a.count||0));
    return out.slice(0, 10);
  }catch(e){ return []; }
}
async function edhrecCommanderPage(card){
  const data = await edhrecFetchJson('/pages/commanders/' + edhrecSlug(card.name) + '.json');
  if(!data) return { names: [], themes: [] };
  return { names: edhrecNamesFrom(data), themes: edhrecThemesFrom(data) };
}
async function edhrecThemeNames(card, themeSlug){
  const data = await edhrecFetchJson('/pages/commanders/' + edhrecSlug(card.name) + '/' + themeSlug + '.json');
  return data ? edhrecNamesFrom(data) : [];
}
async function resolveEdhrecNames(names, keep){
  const rank = new Map(names.map((n,i)=>[n,i]));
  const chunks = chunkArr(names, 30);
  const settled = await Promise.all(chunks.map(ch =>
    searchAndVerifyLegal('(' + ch.map(n=>exactNameClause(n)).join(' or ') + ')', 'name', ch.length)
      .catch(()=>({results:[]}))
  ));
  const seenN = new Set(); const got = [];
  settled.forEach(r=>(r.results||[]).forEach(c=>{ if(!seenN.has(c.name)){ seenN.add(c.name); got.push(c); } }));
  return got.filter(keep).sort((a,b)=>(rank.has(a.name)?rank.get(a.name):999)-(rank.has(b.name)?rank.get(b.name):999));
}
/* Reads a leader's OWN oracle text for its specific hooks — the tribes it
   names, the mechanics it triggers on — and turns each into a precise search
   clause. Entirely local: no network. This is what separates two "token
   leaders" whose actual games look nothing alike. */
const RECO_TRIBES = ['Spirit','Goblin','Elf','Zombie','Vampire','Dragon','Angel','Demon','Wizard','Warrior','Soldier','Human','Merfolk','Sliver','Dinosaur','Cat','Dog','Bird','Rat','Squirrel','Pirate','Knight','Rogue','Cleric','Elemental','Beast','Hydra','Sphinx','Faerie','Treefolk','Giant','Dwarf','Samurai','Ninja','Eldrazi','Insect','Spider','Snake','Fox','Monk','Shaman','Druid','Artificer','Wolf','Wraith','Skeleton','Horror','Illusion','Kraken','Serpent','Phoenix','Ox','Frog','Turtle','Crab','Golem','Myr','Thopter','Construct','Assassin','Mercenary','Berserker','Aetherborn','Vedalken','Kor','Leonin','Loxodon','Viashino','Minotaur','Centaur','Satyr','Dryad','Nymph','Zubera','Moonfolk','Kirin','Otter','Raccoon','Bat','Lizard','Scorpion','Plant','Fungus','Saproling','Ooze','Elk','Boar','Badger','Rabbit','Mouse','Weird','Devil','Imp','Nightmare','Specter','Shade','Gorgon','Naga','Ape','Monkey'];
const RECO_MECHANICS = [
  [/whenever you cast a (?:noncreature|instant or sorcery)|instant or sorcery spell|prowess|magecraft/i, '(o:"instant or sorcery" or kw:prowess or o:magecraft)'],
  [/sacrifice (?:a|another) creature|whenever .{0,40}dies/i, '(o:"sacrifice a creature" or o:"sacrifice another" or o:"whenever" o:"dies")'],
  [/\+1\/\+1 counter/i, 'o:"+1/+1 counter"'],
  [/treasure token/i, 'o:"treasure token"'],
  [/landfall|land enters the battlefield|land you control enters/i, '(kw:landfall or o:"land enters")'],
  [/you gain life|lifelink|life you.{0,20}gain/i, '(o:"you gain life" or kw:lifelink or o:"whenever you gain life")'],
  [/whenever you draw|draws? your second card/i, '(o:"whenever you draw" or o:"second card")'],
  [/return .{0,40}from your graveyard|from your graveyard to the battlefield/i, '(o:"from your graveyard to the battlefield" or o:"return target creature card")'],
  [/mill|puts? the top .{0,30}library into .{0,20}graveyard/i, '(kw:mill or o:mills)'],
  [/discards? a card|whenever .{0,30}discard/i, '(o:"discards a card" or o:madness)'],
  [/creature token/i, '(o:"create" o:"creature token")'],
  [/equipment|equip |attach/i, '(t:equipment or o:"attached")'],
  [/aura|enchanted creature/i, '(t:aura or o:"enchanted creature")'],
  [/energy counter/i, 'o:"energy counter"'],
  [/artifact (?:enters|you control|spell)/i, '(t:artifact or o:"artifacts you control")'],
  [/enchantment (?:enters|you control|spell)|constellation/i, '(t:enchantment or o:"enchantments you control")'],
  [/whenever .{0,30}attacks|combat damage to a player/i, '(o:"whenever" o:"attacks" or o:"combat damage to a player")'],
  [/flying/i, '(kw:flying o:"flying")'],
  [/from exile|exiles? .{0,30}(?:card|creature)|impulse/i, '(o:"exile the top" or o:"you may play")'],
  [/counter target .{0,20}spell/i, 'o:"counter target"'],
  [/copy (?:target|a|that) (?:spell|instant|sorcery)/i, '(o:"copy target" or o:"copy that spell")'],
  [/party|cleric.{0,30}rogue.{0,30}warrior.{0,30}wizard/i, 'o:"your party"'],
  [/the ring tempts you|amass|surveil/i, '(o:"the ring tempts you" or kw:surveil or o:amass)'],
  [/venture into the dungeon|initiative/i, '(o:"venture into" or o:initiative)'],
  [/food token/i, 'o:"food token"'],
  [/clue|investigate/i, '(o:investigate or o:"clue token")'],
  [/blood token/i, 'o:"blood token"'],
  [/modif(?:y|ied)|reconfigure|backup/i, '(o:modified or kw:backup)'],
  [/deathtouch|whenever .{0,30}deals damage to a creature/i, '(kw:deathtouch o:deathtouch)'],
  [/storm|you.?ve cast .{0,20}this turn|casts? (?:your|their) (?:second|first) spell/i, '(o:"second spell" or kw:storm or o:"cast this turn")']
];
function leaderSignals(card){
  const f = frontFace(card);
  const txt = (f.oracle_text || '') + ' ' + (card.card_faces && card.card_faces[1] ? (card.card_faces[1].oracle_text||'') : '');
  const out = [];
  for(const t of RECO_TRIBES){
    if(new RegExp('\\b' + t + 's?\\b').test(txt)) out.push('t:' + t.toLowerCase());
    if(out.length >= 3) break;   // a leader rarely truly supports more tribes
  }
  for(const [re, clause] of RECO_MECHANICS){
    if(re.test(txt)) out.push(clause);
    if(out.length >= 8) break;   // keep the query compact and fast
  }
  return out;
}
async function loadRecoPool(){
  const R = state.reco;
  if(!R) return;
  const theme = state.browseSel.theme ? BROWSE_THEMES.find(t=>t.key===state.browseSel.theme) : null;
  const themeClause = theme ? theme.clause + ' ' : '';
  const idClause = idClauseFor(R.admiral);
  const keep = (c)=> landOk(c) && !isBanned(c) && c.name !== R.admiral.name;
  // What does this leader actually DO? Detected LOCALLY from its own oracle
  // text and type line (no extra network round-trips) — those theme clauses
  // form the synergy signal, and colour staples only fill in behind. Both
  // searches run in parallel, so this is as fast as a single lookup.
  // 1) EDHREC first: the cards most played with THIS leader, in play-rate
  //    order. Skipped when a browse theme filter is active (theme wins then).
  if(!theme){
    try{
      const page = await edhrecCommanderPage(R.admiral);
      if(!state.reco || state.reco !== R) return;
      R.themes = page.themes || [];
      mergeEdhrecTags(R.themes);
      const names = (page.names || []).slice(0, 90);
      if(names.length >= 20){
        const rank = new Map(names.map((n,i)=>[n,i]));
        const byRank = (a,b)=>(rank.has(a.name)?rank.get(a.name):999)-(rank.has(b.name)?rank.get(b.name):999);
        // The Scryfall queue is strictly serial, so fewer, larger name chunks
        // matter — and the page renders the moment the FIRST chunk (the very
        // most-played cards) resolves, with the rest streaming in behind.
        const chunks = chunkArr(names, 30);
        const proms = chunks.map(ch =>
          searchAndVerifyLegal('(' + ch.map(n=>exactNameClause(n)).join(' or ') + ')', 'name', ch.length)
            .catch(()=>({results:[]}))
        );
        const seenN = new Set(); const got = [];
        const absorb = (r)=>(r.results||[]).forEach(c=>{ if(!seenN.has(c.name)){ seenN.add(c.name); got.push(c); } });
        absorb(await proms[0]);
        if(!state.reco || state.reco !== R) return;
        let pool = got.filter(keep).sort(byRank);
        if(pool.length >= 10){
          R.loading = false; R.edhrecSourced = true;
          R.pool = pool.slice(0, 180);
          renderRecoBody();
        }
        (await Promise.all(proms.slice(1))).forEach(absorb);
        if(!state.reco || state.reco !== R) return;
        pool = got.filter(keep).sort(byRank);
        if(pool.length >= 10){
          R.loading = false; R.edhrecSourced = true;
          R.pool = pool.slice(0, 180);
          R._mainPool = R.pool;
          renderRecoBody();
          // Arrived here from a play-data theme on the browse page? Follow
          // through: pre-select that same theme chip for this leader.
          const tr = state.browseSel && state.browseSel.tribe;
          const bs = state.browseSel && state.browseSel.theme;
          if(tr){
            // Arrived from a Kindred browse: focus this leader's list on that
            // creature type (its own theme page carries the tribal build).
            loadRecoTheme(tr);
          } else if(bs && bs.indexOf('ed:')===0){
            loadRecoTheme(bs.slice(3));
          }
          return;
        }
      }
    }catch(e){}
    if(!state.reco || state.reco !== R) return;
  }
  // 2) Fallback: this leader's own hooks, detected locally from its card text.
  const parts = new Set();
  leaderSignals(R.admiral).forEach(cl=>parts.add(cl));               // this leader's OWN hooks first
  detectCardThemes(R.admiral).forEach(t=>{ if(t.clause) parts.add(t.clause); });
  const synPromise = parts.size
    ? searchAndVerifyLegal(themeClause + '(' + Array.from(parts).join(' or ') + ') ' + idClause, 'edhrec', 200)
    : Promise.resolve({ results: [] });
  const staplePromise = searchAndVerifyLegal(themeClause + idClause, 'edhrec', 250);
  const [r1, r2] = await Promise.all([synPromise, staplePromise]);
  if(!state.reco || state.reco !== R) return;   // overlay closed or replaced meanwhile
  R.loading = false;
  const synergy = (r1.results||[]).filter(keep);
  if(r2.error && !synergy.length){ R.error = true; renderRecoBody(); return; }
  const seen = new Set(synergy.map(c=>c.name));
  // Staples are a short tail behind the leader's own package, never the bulk
  // of the page — that sameness was exactly what made every page feel alike.
  const stapleRoom = Math.max(30, 180 - synergy.length);
  const staples = (r2.results||[]).filter(c=> keep(c) && !seen.has(c.name)).slice(0, Math.min(stapleRoom, 60));
  // Both lists arrive from Scryfall already in play-popularity order — keep it.
  // (The old colour/cost re-sort is what made pages read white-then-blue-then-red.)
  R.pool = synergy.slice(0, 180 - staples.length).concat(staples);
  renderRecoBody();
}
async function loadRecoTheme(slug){
  const R = state.reco;
  if(!R || R.loading) return;
  if(R.activeThemeSlug === slug){
    // Tapping the active theme again returns to the leader's main list.
    R.activeThemeSlug = null;
    if(R._mainPool){ R.pool = R._mainPool; }
    renderRecoBody();
    return;
  }
  if(!R._mainPool) R._mainPool = (R.pool || []).slice();
  R.activeThemeSlug = slug;
  const box = document.getElementById('recoBody');
  if(box) box.innerHTML = `<div class="status"><div class="spinner"></div>Charting themed recommendations…</div>`;
  try{
    const names = (await edhrecThemeNames(R.admiral, slug)).slice(0, 60);
    if(!state.reco || state.reco !== R || R.activeThemeSlug !== slug) return;
    const keep = (c)=> landOk(c) && !isBanned(c) && c.name !== R.admiral.name;
    const pool = names.length ? await resolveEdhrecNames(names, keep) : [];
    if(!state.reco || state.reco !== R || R.activeThemeSlug !== slug) return;
    if(pool.length >= 8){
      R.pool = pool.slice(0, 180);
    } else {
      toast('No themed play data for this leader.');
      R.activeThemeSlug = null;
      R.pool = R._mainPool || R.pool;
    }
  }catch(e){
    R.activeThemeSlug = null;
    R.pool = R._mainPool || R.pool;
  }
  renderRecoBody();
}
function renderRecoBody(){
  const box = document.getElementById('recoBody');
  const R = state.reco;
  if(!box || !R) return;
  if(R.error){ box.innerHTML = `<div class="error-note">Couldn't reach Scryfall. Check your connection and try again.</div>`; return; }
  if(!R.pool.length){ box.innerHTML = `<div class="empty-note">No recommendations found for this combination.</div>`; return; }
  const chipList = (R.themes||[]).slice();
  if(R.activeThemeSlug && !chipList.some(t=>t.slug===R.activeThemeSlug)){
    chipList.unshift({ label: R.activeThemeSlug.replace(/-/g,' ').replace(/(^|\s)\w/g, ch=>ch.toUpperCase()), slug: R.activeThemeSlug, count: 0 });
  }
  const activeTheme = R.activeThemeSlug ? chipList.find(t=>t.slug===R.activeThemeSlug) : null;
  const hint = R.edhrecSourced
    ? `<p class="hint" style="text-align:center;margin:0 0 8px;">${activeTheme ? 'Most-played <b>'+escapeHtml(activeTheme.label)+'</b> cards with this leader.' : 'Most-played cards with this leader, by real play data.'}</p>`
    : '';
  const chips = chipList.length
    ? `<div class="reco-themes">${chipList.map(t=>`<button class="rt-chip ${R.activeThemeSlug===t.slug?'on':''}" data-rtheme="${escapeHtml(t.slug)}">${escapeHtml(t.label)}</button>`).join('')}</div>`
    : '';
  box.innerHTML = hint + chips;
  const recoTile = (c)=>{
    const sel = R.selected.has(c.name);
    return `<div class="sr-tile selectable ${sel?'selected':''}" data-name="${encodeURIComponent(c.name)}">
      <span class="sel-check">✓</span>
      <img class="${wbClass(c)}" src="${cardImageMed(c)}" alt="${escapeHtml(c.name)}" loading="lazy">${ubMarkHtml(c)}${pvMarkHtml(c)}
      <div class="st-body">
        <div class="st-nm">${escapeHtml(c.name)}</div>
        <div class="st-tl">${frontFace(c).type_line||''}</div>
        <div class="st-meta-row">
          <div class="st-price" data-pricecard="${encodeURIComponent(c.name)}">…</div>
          <button class="tile-info" data-info="${encodeURIComponent(c.name)}">Details</button>
        </div>
      </div>
    </div>`;
  };
  pagedGrid(box, R.pool, recoTile, (chunk)=>{ wireRecoChunk(); loadTilePrices(chunk); });
  box.querySelectorAll('[data-rtheme]').forEach(b=>{
    b.addEventListener('click', ()=> loadRecoTheme(b.getAttribute('data-rtheme')));
  });
  function wireRecoChunk(){
    box.querySelectorAll('.tile-info').forEach(b=>{
      if(b.dataset.w) return; b.dataset.w='1';
      b.addEventListener('click', (e)=>{
        e.stopPropagation();
        const c = R.pool.find(x=>x.name===decodeURIComponent(b.dataset.info));
        if(c) openCardInfo(c);
      });
    });
    box.querySelectorAll('.sr-tile.selectable').forEach(tile=>{
      if(tile.dataset.w) return; tile.dataset.w='1';
      tile.addEventListener('click', ()=>{
        const name = decodeURIComponent(tile.dataset.name);
        if(R.selected.has(name)) R.selected.delete(name); else R.selected.add(name);
        tile.classList.toggle('selected', R.selected.has(name));
        const btn = document.getElementById('recoCreate');
        const n = R.selected.size;
        btn.disabled = !n;
        btn.innerHTML = `＋ Add to deck${n?` (${n})`:''}`;
      });
    });
  }
}

function openRecoDeckChooser(){

  if(!el){ el = document.createElement('div'); el.className='deckpick-scrim'; el.id='deckPickPopup'; document.body.appendChild(el); }

  el.innerHTML = `<div class="deckpick">

    <div class="deckpick-list">

      ${mode!=='reco' ? `<button class="dp-row" data-newdeck="1"><div class="dp-txt">＋ New deck<div class="dp-meta">Create a fresh deck and add ${escapeHtml(card.name)} to it</div></div></button>` : ''}
      ${state.decksIndex.map(d=>`<button class="dp-row" data-deck="${d.id}">
        <div class="dp-txt">${escapeHtml(d.name)}<div class="dp-meta">${d.cards.length} cards${d.admiral?` · ${escapeHtml(d.admiral.name)}`:' · no Admiral yet'}</div></div>
      </button>`).join('')}
    </div>
    <button class="dp-cancel" id="dpCancel">Cancel</button>
  </div>`;
  const close = ()=>el.remove();
  document.getElementById('dpCancel').addEventListener('click', close);
  el.addEventListener('click', e=>{ if(e.target===el) close(); });
  el.querySelector('[data-newdeck]').addEventListener('click', ()=>{ close(); createDeckFromReco(); });
  el.querySelectorAll('.dp-row[data-deck]').forEach(row=>{
    row.addEventListener('click', ()=>{ close(); addRecoPicksToDeck(getDeck(row.dataset.deck)); });
  });
}
function addRecoPicksToDeck(d){
  const R = state.reco;
  if(!R || !d) return;
  const picks = R.pool.filter(c=>R.selected.has(c.name));
  // A deck with no Admiral yet adopts this one (it's what the page is about)
  let admiralSet = false;
  if(!d.admiral){
    d.admiral = R.admiral;
    logDeckChange(d, {type:'admiral', name:R.admiral.name, card:R.admiral, prev:null});
    admiralSet = true;
  }
  let added = 0, offColor = 0, dupes = 0;
  picks.forEach(c=>{
    if(d.cards.some(x=>x.name===c.name) || (d.admiral && d.admiral.name===c.name)){ dupes++; return; }
    if(d.admiral && !colorIdentityOkDeck(c, d)){ offColor++; return; }
    d.cards.push(c);
    logDeckChange(d, {type:'add', name:c.name, card:c});
    added++;
  });
  persistDeck(d);
  const bits = [`${added} added to ${d.name}`];
  if(admiralSet) bits.unshift(`${R.admiral.name} takes the helm`);
  if(offColor) bits.push(`${offColor} outside its colors`);
  if(dupes) bits.push(`${dupes} already aboard`);
  toast(bits.join(' · ') + '.');
  if(added || admiralSet){ closeTopOverlay(); openDeck(d.id); }
}
function createDeckFromReco(){
  const R = state.reco;
  if(!R || !R.selected.size) return;
  const name = prompt('Name your new deck:', `${R.admiral.name}'s Fleet`);
  if(name === null) return;   // cancelled
  const picks = R.pool.filter(c=>R.selected.has(c.name));
  const d = { id: uid(), name: (name.trim() || `${R.admiral.name}'s Fleet`), admiral: R.admiral, cards: [], maybeboard: [], tags: {}, primer: '', createdAt: Date.now(), updatedAt: Date.now() };
  state.decksIndex.unshift(d);
  logDeckChange(d, {type:'admiral', name:R.admiral.name, card:R.admiral, prev:null});
  picks.forEach(c=>{ d.cards.push(c); logDeckChange(d, {type:'add', name:c.name, card:c}); });
  persistDeck(d);
  toast(`${d.name} launched with ${picks.length+1} cards.`);
  closeTopOverlay();
  openDeck(d.id);
}

function rulesTextHtml(){
  if(isCmdrMode()) return commanderFullRulesHtml();
  if(RULES_OVERRIDE.full) return fullRulesFromLines(RULES_OVERRIDE.full);
  return `<div class="rules-text">
    <p style="margin-top:0;">Admiral is a four-player singleton format for the cards of Standard's whole history, led by a legendary Admiral and built on a shared Landing Zone that replaces lands in decks entirely. These are the full rules.</p>

    <h4>Your Admiral</h4>
    <p>Choose a legendary card with power and toughness printed on its front side as the Admiral of your deck. That means legendary creatures — and other legendary cards with printed power and toughness, such as Vehicles — while planeswalkers and battles don't qualify.</p>
    <p>Being an Admiral is not a characteristic [CR 109.3]; it is a property tied directly to the physical card. "Admiral-ness" cannot be copied or overwritten by continuous effects. The card remains your Admiral through any status changes, and is still your Admiral even while another player controls it.</p>

    <h4>Deckbuilding</h4>
    <p>An Admiral deck contains exactly ${DECK_TOTAL} cards, including its Admiral. Every card must have been legal in Standard — or its predecessor, Type 2 — at some point in its history, and every card must have a nonland front side (modal double-faced cards with a land front are not eligible).</p>
    <p>Singleton: no two cards in the deck may share an English name. Some cards (e.g. Relentless Rats) carry rules text that overrides this restriction.</p>
    <p>A card's color identity is its color plus the colors of any mana symbols in its rules text. Color identity is established before the game begins and cannot be changed by game effects. No card in the deck may have a color in its identity that isn't in the color identity of the deck's Admiral.</p>
    <p>To keep play immersed in the world of Magic itself, an Admiral deck contains only cards from within Magic: The Gathering's own multiverse — Universes Beyond cards are not part of the format.</p>
    <p style="color:var(--sub-text-2);font-size:12px;">Why the hard line? Admiral is built to feel like Magic: one connected multiverse with a consistent story, style and identity. Crossover sets are wonderful products, but they are written for other worlds first — and a format is at its best when its card pool tells one coherent story.</p>
    <p><strong>Rule Zero.</strong> Like every casual Magic format, Admiral games begin with the unwritten rule that outranks all written ones: your playgroup decides together what your games look like. If your table wants to welcome Universes Beyond cards, that is a perfectly legitimate use of Rule Zero — agree on it before the game begins. The app supports exactly this: the "Include all Standard-legal sets" switch in Extras opens the full pool and extends the banned list to cover it.</p>

    <h4>The Landing Zone</h4>
    <p>Decks contain no lands. Instead, the game begins with a shared zone called the Landing Zone, stocked with an unlimited supply of basic lands of every type, including Wastes. Snow versions are available too: whenever you take a basic from the Landing Zone, you choose whether it is the snow version.</p>
    <p>The <strong>corresponding basic</strong> for a card follows its color identity — white corresponds to Plains, blue to Island, black to Swamp, red to Mountain, green to Forest, and a colorless identity to Wastes. For a multicolored card, you choose one of its colors when you take the basic.</p>
    <p><strong>Playing a land.</strong> Whenever you could normally play a land from a zone (hand, the top of your library, and so on), you instead exile that card face up from that zone and put a corresponding basic onto the battlefield from the Landing Zone. This is a special action: it doesn't use the stack, can't be responded to, counts as your land play, and exiling the card this way doesn't trigger any abilities or effects.</p>
    <p>Effects that let you play lands from another zone — the graveyard, exile, or the top of your library — work exactly the same way, even though no actual land cards are there: you exile a card from that zone and take the corresponding basic. A Perennial Behemoth lets you exile a card from your graveyard for a basic; a Courser of Kruphix, from the top of your library. Effects that grant additional land plays grant additional exchanges.</p>
    <p style="color:var(--sub-text-2);font-size:12px;">Example — with Courser of Kruphix and Perennial Behemoth in play, during your main phase with an empty stack, you may exile a card from your hand, your graveyard, or the top of your library to put a corresponding basic onto the battlefield.</p>
    <p><strong>Effects that move lands.</strong> If a spell or ability instructs you to put one or more lands from any zone other than the battlefield into another zone, you instead exile that many cards face up from the source zone — up to a maximum of five per instruction — and put corresponding basics into the destination zone as part of resolving it, tapped or untapped as the effect specifies. Exiling cards this way doesn't trigger any abilities or effects. If the effect asks for lands of specific types, the cards you exile must have the matching colors in their identity. Lands already on the battlefield change zones normally.</p>
    <p style="color:var(--sub-text-2);font-size:12px;">Examples — Cultivate: exile up to two cards from your library; a corresponding basic enters the battlefield tapped and another goes to your hand. Splendid Reclamation: exile up to five cards from your graveyard and put that many corresponding basics onto the battlefield. Borborygmos Enraged: exile a card from your hand, put a corresponding basic into your hand, then discard it to the ability.</p>
    <p><strong>Reveals.</strong> When an effect reveals cards and refers to lands among them, each revealed nonland card may be treated as a land of its corresponding types — but only for that effect's land-related instructions. Everything else about the card is unchanged.</p>
    <p style="color:var(--sub-text-2);font-size:12px;">Examples — Satyr Wayfinder: reveal the top four cards; you may choose one as your "land", exiling it to put a corresponding basic into your hand, and the rest go to your graveyard. Destroy the Evidence: the destroyed land's controller reveals cards until revealing a "land" — the first card revealed qualifies — and it goes to the graveyard with the rest.</p>
    <p><strong>After the Zone.</strong> A basic taken from the Landing Zone is owned by the player who put it onto the battlefield. From then on it is a normal card: if it's destroyed it goes to that player's graveyard, if bounced to their hand, and so on — it never returns to the Landing Zone.</p>

    <h4>Casting your Admiral</h4>
    <p>Admirals begin the game in the command zone. While your Admiral is in the command zone, you may cast it, subject to the normal timing restrictions for its card types. You must pay an additional {2} for each time it was previously cast from the command zone.</p>
    <p>If your Admiral is in a graveyard or in exile and was put there since the last time state-based actions were checked, you may put it into the command zone. If your Admiral would be put into your hand or library from anywhere, you may put it into the command zone instead; this replacement effect may apply more than once to the same event.</p>

    <h4>Winning &amp; Losing</h4>
    <p>Mulligans work as in Commander: the London mulligan, with the first mulligan free in multiplayer games.</p>
    <p>Players begin the game with ${START_LIFE} life. All normal ways to win and lose apply — and in addition, a player who has been dealt 18 or more combat damage by a particular Admiral over the course of the game loses the game.</p>
  </div>`;
}
function banPillarsHtml(){

    <p style="margin-top:0;">This banlist serves as a guideline designed to preserve the spirit and enjoyment of the game for everyone at the table — a balance aimed at fun, fairness, and meaningful interaction. It rests on four pillars.</p>

    <p>Cards that generate excessive or overly efficient mana early disrupt the natural pace of the game. When they upset the balance of when players can cast powerful spells, they short-circuit strategic depth and cut into the opportunity for thoughtful play. Keeping mana acceleration in check keeps building resources feeling rewarding rather than skippable.</p>
    <h4>2. Avoiding centralization of game-time</h4>
    <p>Some cards or strategies let one player take disproportionately long turns — chaining extra turns, resetting the game state, or grinding through overly intricate repetitive plays — which slows the whole table down and leaves everyone else disengaged. This pillar limits cards and combos that eat up game-time at the expense of everyone else's turns.</p>
    <h4>3. Preserving player agency</h4>
    <p>The heart of the game is a player's ability to make meaningful choices. Cards that oppressively lock opponents out, prevent them from playing spells, or strip away their control diminish that agency and turn active participants into passive observers. This pillar protects everyone's ability to actually play the game.</p>
    <h4>4. Preserving the Singleton Spirit and Land-Play Balance</h4>
    <p>Admiral's shared Landing Zone mechanic is designed to enhance balance and strategic engagement — this pillar targets cards that exploit or bypass it in ways that break the intended flow. It also covers the most efficiently costed "universal" tutors: limiting cards that search for any specific answer keeps the high-variance, singleton nature of the format intact instead of letting decks become repetitive or overly predictable.</p>
    <p style="margin-top:10px;color:var(--sub-text-2);font-size:11.5px;">These four pillars are guidelines for fun play — worth keeping in mind while building and playing your Admiral deck, not just a checklist for what's banned.</p>

function backupAllDecks(){
  // FULL backup: every piece of app data on this device — decks, folders,
  // collection, settings, mode, learned catalogs — captured as the complete

  // along so files stay readable by earlier versions.

async function restoreFromFile(file){
  let payload;
  try{ payload = JSON.parse(await file.text()); }
  catch(e){ toast("That file isn't valid JSON."); return; }
  if(payload && payload.ls && typeof payload.ls === 'object' && !Array.isArray(payload.ls)){
    // Full backup: replace this device's app data wholesale, then reboot the
    // app so every screen rebuilds from the restored storage.
    const keys = Object.keys(payload.ls).filter(k=>k.indexOf(LS_PREFIX)===0);
    if(!keys.length){ toast('That backup file looks empty.'); return; }
    const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleString() : 'an unknown date';
    const nDecks = keys.filter(k=>k.indexOf(LS_PREFIX+'deck:')===0).length;
    if(!confirm(`Full backup from ${when} — ${nDecks} deck${nDecks===1?'':'s'} plus collection and settings.\n\nRestoring REPLACES everything currently in this app on this device. Continue?`)) return;
    try{
      const drop = [];
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(LS_PREFIX) === 0) drop.push(k);
      }
      drop.forEach(k=>localStorage.removeItem(k));
      keys.forEach(k=>localStorage.setItem(k, payload.ls[k]));
    }catch(e){
      toast('Restore hit a storage error — free some space and try again.');
      return;
    }
    toast('Everything restored — reloading…');
    setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 700);
    return;
  }
  const decks = Array.isArray(payload) ? payload : payload.decks;
  if(!Array.isArray(decks) || !decks.length){ toast("No decks found in that file."); return; }
  const importedFolders = (!Array.isArray(payload) && Array.isArray(payload.folders)) ? payload.folders : [];
  if(!Array.isArray(payload) && payload.globalTags && typeof payload.globalTags==='object'){
    const g = ensureGlobalTags();
    Object.entries(payload.globalTags).forEach(([name, list])=>{
      const cur = g[name] || (g[name]=[]);
      (Array.isArray(list)?list:[]).forEach(t=>{ if(t && !cur.some(x=>x.toLowerCase()===String(t).toLowerCase())) cur.push(String(t)); });
    });
    saveGlobalTags();
  }
  const valid = decks.filter(d=>d && typeof d.name==='string' && Array.isArray(d.cards));
  if(!valid.length){ toast("That file doesn't look like an Admiral backup."); return; }
  const replace = state.decksIndex.length
    ? confirm(`Restore ${valid.length} deck${valid.length>1?'s':''}.\n\nOK = replace everything currently saved.\nCancel = add them alongside your existing decks.`)
    : true;
  if(replace){
    await Promise.all(state.decksIndex.map(x=>deleteDeckStorage(x.id)));
    state.decksIndex = [];
    state.activeDeckId = state.searchDeckId = state.inspireDeckId = null;
    state.folders = importedFolders.slice();
    saveFolders();
  } else if(importedFolders.length){
    const have = new Set((state.folders||[]).map(f=>f.id));
    importedFolders.forEach(f=>{ if(!have.has(f.id)) state.folders.push(f); });
    saveFolders();
  }
  const existingIds = new Set(state.decksIndex.map(d=>d.id));
  for(const d of valid){
    const deck = Object.assign({ maybeboard:[], tags:{}, primer:'', admiral:null, createdAt:Date.now() }, d);
    if(!deck.id || existingIds.has(deck.id)) deck.id = uid();   // avoid clobbering a deck we already have
    existingIds.add(deck.id);
    deck.updatedAt = deck.updatedAt || Date.now();
    delete deck._saveStatus;
    state.decksIndex.push(deck);
    await persistDeck(deck);
  }
  state.decksIndex.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  toast(`Restored ${valid.length} deck${valid.length>1?'s':''}.`);
  switchPage('decks');
}

function ensureLifePlayers(){
  const L = state.life;
  if(!L.players) L.players = [];
  while(L.players.length < L.count) L.players.push({ name:'Player '+(L.players.length+1), life:lifeStart(), poison:0, dmg:[], defeated:false, defeatMsg:'', medal:false });
  L.players.length = L.count;
  L.players.forEach((p,i)=>{
    if(!p.name) p.name = 'Player '+(i+1);
    if(!p.dmg) p.dmg = [];
    while(p.dmg.length < L.count) p.dmg.push(0);
    p.dmg.length = L.count;
  });
  return L.players;
}
function lifeLog(msg){
  state.life.history.unshift(msg);
  if(state.life.history.length > 40) state.life.history.length = 40;
}
function checkDefeat(p){
  const L = state.life;
  if(!L.settings.autoKill || p.defeated) return;
  let cause = null;
  if(p.life <= 0) cause = 'life';
  else if(L.settings.poison && p.poison >= 10) cause = 'poison';
  else if(L.settings.admiralDamage && p.dmg.some(d=>d>=lethalDmg())) cause = 'admiral';
  if(cause){
    p.defeated = true;
    p.defeatMsg = L.settings.salty ? SALTY_MESSAGES[Math.floor(Math.random()*SALTY_MESSAGES.length)] : 'Defeated.';
    lifeLog(`⚔ ${p.name} was defeated (${cause==='life'?'0 life':cause==='poison'?'10 poison':lethalDmg()+' '+fmtName()+' damage'}).`);
  }
}
function seatRotation(i, count){
  // With the phone lying flat in the middle of the table: two players facing
  // across get 180/0 (classic 2-up layout). For 3+ players in the 2-column
  // grid, every card in the left column reads sideways one way and every
  // card in the right column reads sideways the other way, regardless of
  // row — this matches how the app is actually held between players.
  if(count === 2) return i===0 ? 180 : 0;
  return (i % 2 === 0) ? 90 : 270;
}
function adjustLifeField(idx, field, d, from){
  const players = ensureLifePlayers();
  const p = players[idx];
  if(field==='life'){
    p.life += d; if(p.defeated && p.life>0){ }
    // Running −X / +X beside the total: rapid taps accumulate into one
    // number, which fades out a moment after the tapping stops.
    p._delta = (p._delta||0) + d;
    if(p._delta === 0) delete p._delta;
    clearTimeout(p._deltaT);
    p._deltaT = setTimeout(()=>{ delete p._delta; renderLifeGrid(); }, 2500);
    lifeLog(`${p.name}: life ${d>0?'+':''}${d} → ${p.life}`);
  }
  else if(field==='poison'){ p.poison = Math.max(0, p.poison+d); lifeLog(`${p.name}: poison ${d>0?'+':''}${d} → ${p.poison}`); }
  else if(field==='dmg'){ p.dmg[from] = Math.max(0, p.dmg[from]+d); lifeLog(`${p.name}: Admiral dmg from ${players[from].name} ${d>0?'+':''}${d} → ${p.dmg[from]}`); }
  checkDefeat(p);
  renderLifeGrid();
}
async function animatedHighRoll(){
  const players = ensureLifePlayers();
  const n = players.length;
  if(state.life.spinning) return;
  state.life.spinning = true;
  const winner = Math.floor(Math.random()*n);
  const extraLoops = 2 + Math.floor(Math.random()*2); // 2-3 full loops before landing
  const totalSteps = n*extraLoops + winner + 1;
  let delay = 70;
  for(let step=0; step<totalSteps; step++){
    setSpinHighlight(step % n);
    await new Promise(r=>setTimeout(r, delay));
    const remaining = totalSteps - step;
    if(remaining <= n) delay = Math.min(480, delay*1.35); // decelerate hard on the final loop
    else delay = Math.min(140, delay*1.06);
  }
  setSpinHighlight(null);
  players.forEach((p,i)=>{ p.medal = (i===winner); });
  state.life.turnIdx = winner;
  state.life.startIdx = winner;
  state.life.turnNum = 1;
  lifeLog(`🎡 Spin the wheel — ${players[winner].name} goes first!`);
  toast(`${players[winner].name} goes first!`);
  state.life.spinning = false;
  renderLifeGrid();
}
/* Seats in *visually clockwise* order around the 2-column table grid:
   top row left→right, then down the right column, then the bottom row
   right→left, then up the left column. */
function clockwiseOrder(count){
  switch(count){
    case 2: return [0,1];
    case 3: return [0,1,2];
    case 4: return [0,1,3,2];
    case 5: return [0,1,3,4,2];
    case 6: return [0,1,3,5,4,2];
    default: return Array.from({length:count},(_,i)=>i);
  }
}
function passTurn(){
  const players = ensureLifePlayers();
  const L = state.life;
  const order = clockwiseOrder(players.length);
  if(L.startIdx == null || L.startIdx >= players.length) L.startIdx = (L.turnIdx != null ? L.turnIdx : 0);
  if(L.turnIdx === null){
    L.turnIdx = L.startIdx; L.turnNum = 1;
    lifeLog(`↻ Turn 1 — ${players[L.turnIdx].name}`);
    renderLifeGrid(); return;
  }
  let pos = order.indexOf(L.turnIdx);
  if(pos < 0) pos = 0;
  for(let i=0;i<order.length;i++){
    pos = (pos + 1) % order.length;
    const seat = order[pos];
    // The turn number only ticks up when play comes back around to the
    // starting player's seat — one full clockwise rotation of the table.
    if(seat === L.startIdx) L.turnNum++;
    if(!players[seat].defeated){ L.turnIdx = seat; break; }
  }
  lifeLog(`↻ Turn ${L.turnNum} — ${players[L.turnIdx].name}`);
  renderLifeGrid();
}

/* ---- screen wake lock: keep the phone awake while the life tracker is up ----
   Needs a secure context (https:// or localhost), so it quietly no-ops when the
   file is opened directly from disk. */
let _wakeLock = null;
async function acquireWakeLock(){
  if(_wakeLock) return;
  try{
    if('wakeLock' in navigator){
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', ()=>{ _wakeLock = null; });
    }
  }catch(e){ console.warn('Wake lock unavailable:', e && e.message); }
}
function releaseWakeLock(){
  try{ if(_wakeLock) _wakeLock.release(); }catch(e){}
  _wakeLock = null;
}
document.addEventListener('visibilitychange', ()=>{
  // Browsers drop the lock when the tab is backgrounded — take it again on return
  if(document.visibilityState === 'visible' && state.lifeOpen && !_wakeLock) acquireWakeLock();
});

function openLifeOverlay(){
  state.lifeOpen = true;
