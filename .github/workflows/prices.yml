name: Daily card prices

# Scryfall refreshes its price data early each morning. We run just after, so
# the file on the site is never more than a day behind. This job is small:
# one download, one 300 KB file, no Scryfall searches at all.
#
# The file goes to the "data" branch, which has no history (see
# scripts/data-branch.sh): yesterday's prices are replaced, not kept forever.
on:
  schedule:
    - cron: '0 10 * * *'      # 10:00 UTC daily
  workflow_dispatch:

# Every data robot shares this group: never two of them on the data branch.
concurrency:
  group: bulk-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Get the current data files
        run: bash scripts/data-branch.sh pull

      - name: Build the price file
        run: OUT_DIR=data node scripts/build-bulk.mjs --prices

      - name: What the build produced
        run: ls -l data/prices-slim.tsv.gz data/prices-meta.json && cat data/prices-meta.json

      - name: Publish
        run: bash scripts/data-branch.sh push "Daily prices"
