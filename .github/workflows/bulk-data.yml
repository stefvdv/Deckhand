# Weekly Scryfall bulk-data refresh for Deckhand.
#
# Every Monday at 03:20 UTC (and on demand via the Actions tab's
# "Run workflow" button) this downloads Scryfall's Oracle Cards and
# Rulings bulk files and trims them to only the fields the app uses:
#
#   oracle-slim.jsonl.gz    rulings-slim.jsonl.gz    bulk-meta.json
#   tags-slim.jsonl.gz      tags-index.json          combos-slim.jsonl.gz
#
# The files live on the "data" branch, which has no history: every run
# replaces it with one fresh commit (scripts/data-branch.sh), so the repo
# does not grow by a few MB every week. The site serves them at the same
# addresses as before through _redirects.
#
# Scryfall sees ONE download per week, from GitHub's machines. The job
# refuses to publish when the outputs look broken (the script's sanity
# checks throw), so a bad Scryfall day can never overwrite last week's
# good files. A file the build chose not to write keeps last week's copy.

name: Weekly Scryfall bulk data

on:
  schedule:
    - cron: '20 3 * * 1'   # Mondays, 03:20 UTC
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

# Every data robot shares this group: never two of them on the data branch.
concurrency:
  group: bulk-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # a hung source gives up instead of burning hours
    steps:
      - name: Check out the repo (latest commit only)
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Get the current data files
        run: bash scripts/data-branch.sh pull

      - name: Build the trimmed bulk files
        run: OUT_DIR=data node scripts/build-bulk.mjs

      - name: What the build produced
        if: always()
        run: ls -lh data/

      - name: Publish
        run: |
          # The three core files decide whether this run is worth publishing.
          missing=""
          for f in oracle-slim.jsonl.gz rulings-slim.jsonl.gz bulk-meta.json; do
            [ -f "data/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::The build produced nothing to publish — missing:$missing"
            exit 1
          fi
          bash scripts/data-branch.sh push "Weekly Scryfall bulk data"
