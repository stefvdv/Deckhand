name: Card art fingerprints (scanner)

# The card scanner recognises the exact printing by its art. This builds the
# fingerprints from Scryfall's images: weekly, only the new printings.
#
# The file goes to the "data" branch, which has no history (see
# scripts/data-branch.sh): last week's copy is replaced, not kept forever.
on:
  schedule:
    - cron: '30 4 * * 2'      # Tuesday 04:30 UTC, after Monday's card build
  workflow_dispatch:

# Every data robot shares this group: never two of them on the data branch.
concurrency:
  group: bulk-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  arthash:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: JPEG decoder (pure JavaScript, nothing to compile)
        run: npm install --no-save jpeg-js@0.4.4

      - name: Get the current data files
        run: bash scripts/data-branch.sh pull

      - name: Build the fingerprints
        run: OUT_DIR=data node scripts/build-arthash.mjs

      - name: What the build produced
        run: ls -l data/arthash.tsv.gz data/arthash-meta.json && cat data/arthash-meta.json

      - name: Publish
        run: bash scripts/data-branch.sh push "Art fingerprints"
