# Deckhand — weekly metagame for Standard, Pauper, Modern, Legacy, Vintage.
#
# Reads open tournament data (MTGODecklistCache) and the community's open
# archetype rules (MTGOFormatData), both on GitHub, and writes meta.json to
# the "data" branch (no history, see scripts/data-branch.sh). The app reads
# that file from its own site: no scraping of other websites, no cross-site
# requests from the phone.
#
# Start by hand: Actions -> Weekly metagame -> Run workflow (website only).
name: Weekly metagame

on:
  schedule:
    - cron: '40 4 * * 2'      # Tuesdays 04:40 UTC -- after the weekend's events are in
  workflow_dispatch:

permissions:
  contents: write

# Every data robot shares this group: never two of them on the data branch.
concurrency:
  group: bulk-data
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Get the current data files
        run: bash scripts/data-branch.sh pull

      - name: Fetch the last three months of tournaments
        run: |
          set -e
          D15=$(date -u +%Y-%m-15)
          M0=$(date -u -d "$D15" +%Y/%m)
          M1=$(date -u -d "$D15 -1 month" +%Y/%m)
          M2=$(date -u -d "$D15 -2 month" +%Y/%m)
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/Jiliac/MTGODecklistCache.git ../MTGODecklistCache
          cd ../MTGODecklistCache
          git sparse-checkout init --no-cone
          PATHS=""
          for S in mtgo.com_limited_data melee.gg mtgo.com topdeck.gg; do
            for M in $M2 $M1 $M0; do PATHS="$PATHS /Tournaments/$S/$M/"; done
          done
          git sparse-checkout set $PATHS
          git checkout
          du -sh Tournaments || true

      - name: Fetch the archetype rules
        run: git clone --depth 1 https://github.com/Badaro/MTGOFormatData.git ../MTGOFormatData

      - name: Build meta.json
        run: |
          node scripts/build-meta.mjs --cache ../MTGODecklistCache --rules ../MTGOFormatData --out data/meta.json --days 28 --cards data/oracle-slim.jsonl.gz
          ls -l data/meta.json

      - name: Publish
        run: bash scripts/data-branch.sh push "Weekly metagame"
